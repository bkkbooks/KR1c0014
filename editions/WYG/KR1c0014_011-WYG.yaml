body:
  text: 詩總聞卷十一宋王質撰鴻鴈一章鴻鴈于飛肅肅其羽西北鴻鴈来正月節此詩當是春來鴻鴈初歸故鄉新棲未定舊迹已湮故曰哀鳴嗷嗷之子于征劬勞于野爰及矜人哀此鰥寡當是授民以田也最可憐者孤獨鰥寡之人人而重可哀者鰥寡之人也老而無子尚可養旁親為義子㓜而無父尚可依他族為義父惟老而無妻無復更娶老而無夫無復更嫁終身永已故可哀也二章鴻鴈于飛集于中澤之子于垣百堵皆作雖則劬勞其究安宅當是授民以舎也雖勞畢事則歸家自解之辭也三章鴻鴈于飛哀鳴嗷嗷維此哲人謂我劬勞維彼愚人謂我宣驕哲人暢于人情憫我之勞也愚人暗于物理謂我為民任勞示之以驕將不可令也大率一種無識者謂百姓不足顧恤顧恤則頑肆惟有事則深懲無事則勿顧則民知畏而易馭彼以為有術有能而不自知其真愚也聞音曰野上與切寡果五切澤徒洛切宅逹各切班氏陳湯傳斬越毒鼔顔氏西域傳作毋寡此作毋鼓聲相近夷狄之音不甚諦也此音至漢猶存至唐已不傳矣鄭氏縫人注引書宅西曰昧谷作度西曰栁糓陸氏古文宅與度相近因此而誤此音至漢亦存至唐又不傳也大率古音漸逺漸轉而况愈逺今併載於此總聞曰此士大夫將王命而定民所者也三章劬勞皆士大夫自謂恐難獨以中章為勸民之辭女今雖病勞終有安居此意甚佳但語勢不爾庭燎一章夜如何其夜未央庭燎之光君子至止鸞聲將將二章夜如何其夜未艾庭燎晰晰君子至止鸞聲噦噦三章夜如何其夜鄉晨庭燎有煇君子至止言觀其旂聞音曰將七羊切艾魚肺切晰之逝切煇許云切旂渠斤切總聞曰鄭氏宣王問早晚之辭人君數問夜亦非體此當是執事之人夜未央未艾而聞車音夜鄉晨而見旂色嘆夜漏之未盡而朝臣之已集也所謂不圖今日復見漢官威儀乆不接耳目驟以為驚且為喜也恐是殿庭之間宫掖之内執事者相與問答之辭也禮雞人夜呼旦以驚百官漢儀中黄門持五夜甲乙丙丁戊相傳朱明衛士起唱所謂雞鳴歌也或是此曹沔水一章沔彼流水朝宗于海鴥彼飛隼載飛載止嗟我兄弟邦人諸友莫肯念亂誰無父母二章沔彼流水其流湯湯鴥彼飛隼載飛載揚念彼不蹟載起載行心之憂矣不可弭忘屈氏歩徙倚而遥思怊惝恍而永懐意荒蕩而流蕩心愁悽而轉悲言不循法度之人而反以我為此流故懐憂如此鄭氏以起行為妄興師出兵事實既不然人情亦不爾若此詩人之情喪也三章鴥彼飛隼率彼中陵民之訛言寜莫之懲我友敬矣䜛言其興陳氏闕沔彼流水云八字亦精考者然不必如此前二章見隼止沔水之旁後一章見隼循中陵之上當是中陵與沔水異塗各道所見不必相同也聞音曰海虎猥切友羽軌切毋滿罪切湯失羊切行户郎切聞跡曰沔水出武都沮縣毛氏流滿未考總聞曰當是關輔諸侯有來朝後時者興下之䜛致上之疑徃時固有亂者固有不蹟者今誰念之而効之乎皆由訛言不懲故懐敬君之心得慢君之咎有此䜛也見順流之水自適之禽而嘆其不如是必其䜛已就欲見而不敢見慮蹈禍也此或為其友愬䜛者故曰我友敬矣䜛言其興鶴鳴一章鶴鳴于九臯聲聞于野魚濳在淵或在于渚二章樂彼之園爰有樹檀其下維蘀他山之石可以為錯澤玩鶴水玩魚言賢者退處自樂也不惟如此而園有檀可以為器其墮葉亦可以代薪其穀菜亦可以為茹山有石亦可以為礪取用何闕所以為樂也三章鶴鳴于九臯聲聞于天魚在于渚或濳在淵四章樂彼之園爰有樹檀其下維穀他山之石可以攻玉聞音曰野上與切檀徒泫切天淵從今音不必作鐡因一均詩用天二十三用淵六雖無叶他年縈年二切既叶亦可吳氏不必從一讀也聞章曰舊二章今為四章聞物曰糓菜葉似王𤓰實若龍葵今山間多食總聞曰清修隠逸之士多喜觀鶴亦多喜觀魚列子詹何莊子惠子之事可見載在傳記及見篇章甚多祈父一章祈父止予王之爪牙胡轉予于恤靡所止居此士卒怨將帥之辭也呼之以父而告之以情我于王為爪牙衛國家者也何忍轉我于憂不安其居而無所至怨之辭也二章祈父止予王之爪士胡轉予于恤靡所底止三章祈父止亶不聰胡轉予于恤有母之尸饔白駒一章皎皎白駒食我場苗縶之維之以永今朝所謂伊人於焉逍遥二章皎皎白駒食我埸藿縶之維之以永今夕所謂伊人於焉嘉客三章皎皎白駒賁然來思爾公爾侯逸豫無期慎爾優㳺勉爾遁思此必舊為公侯而今遁山林者也度斯人浪適其來無期少寄丁寜頌禱之辭愛賢之深也四章皎皎白駒在彼空谷生芻一束其人如玉毋金玉爾音而有遐心始猶兾白駒之來可以施謀今不復望知白駒終不出谷也猶欲寄生芻以秣白駒而又恐其人過潔雖芻亦不肯受也今相踈如此不可閟其音而與我絶有相逺之意也盖欲時通訊問以求善言也聞音曰夕祥龠切客克各切古客皆讀如恪三恪即三客也孔叢子陳王問太師三恪曰封夏殷之後為二代紹虞帝之𦙍備三恪恪敬也禮之如賓客也客恪皆同楚辭易林古詩漢歌皆用此思新齎切總聞曰此亦在野之賢者尚與世相通欲求道義為師友而所欲挽者又長徃而不返者也黄鳥一章黄鳥黄鳥無集于穀無啄我粟此邦之人不我肯糓言旋言歸復我邦族此離散之餘去本邦而寓他土者也借黄鳥為辭無集我糓無啄我粟留為歸資復見舊族也厭他土而思本邦之辭也二章黄鳥黄鳥無集于桑無啄我梁此邦之人不可與明言旋言歸復我諸兄三章黄鳥黄鳥無集于栩無啄我黍此邦之人不可與處言旋言歸復我諸父聞音曰明謨良切兄虛王切父扶雨切聞訓曰無集于穀楮也不我肯糓善也上糓從木下糓從米總聞曰當是為生異方必經多時種木植禾已成不復戀而决舎去者此邦必有所不可留而非得已也我行其野一章我行其野蔽芾其樗昏姻之故言就而居爾不我畜復我邦家二章我行其野言采其蓫昏姻之故言就爾宿爾不我畜言歸斯復三章我行其野言采其葍不思舊姻求爾新特成不以富亦祗以異此以貧欲棄舊婚而以富欲求新匹者也雖成不足以致富假使有得亦終散而不聚也適足以為怪言逐夫而適夫豈有此理也此皆婿辭聞音曰家古胡切葍筆力切異逸織切聞物曰樗即楮也毛氏他氏皆但謂之惡木不言何木也樗楮相邇今俗傳雖薪亦不堪然皮可紙實可練葉可覆麴醬極易長茂蓫葍毛鄭皆云惡菜鄭氏言蓫牛蘈菜也郭氏方莖莖長而鋭有穗有花花紫縹鄭氏葍䔰也爾雅蔓芽也郭氏葍大葉白花赤花為蔓初不言何物本草陳氏引詩言采其蓫羊蹄草也許氏以蔓為葍一名蕣集韻丁氏蕣木槿也引詩顔如蕣英雖不引此然今木槿有白紫二種與郭氏正合人雖采但不見食耳當是西北與東南又不同總聞曰觀此詩然後知前詩之所以不可處者也二詩當出一人斯干一章秩秩斯干幽幽南山干幹也今言人命上下為支干故下言松竹也凡居向南為正靣南山則坐北山也如竹苞矣如松茂矣言靣勢物色皆嘉也兄及弟矣式相好矣無相猶矣言門户氣象又皆嘉也二章似續妣祖築室百堵西南其戸爰居爰處爰笑爰語然後興功作室也似續生者之室也妣祖死者之室也死户向西坐東也生户向南坐北也死者於此居處生者於此笑語言各安其所也三章約之閣閣椓之槖槖風雨攸除鳥鼠攸去君子攸芋自此以下毎章結以君子芋有數訓平聲一草盛也一大也仄聲草名也吳氏所引説文大葉實根駭人故謂之芌王過切者乃從芌也於文象氣之舒若從芋當作平聲于文象氣之平雖通用而有異意集韻撫芋通用荒胡切覆也大也有也用此為的鄭氏改芋為憮亦不誤但不須變字爾去除皆當從平聲四章如跂斯翼如矢斯棘如鳥斯革如翬斯飛君子攸躋五章殖殖其庭有覺其楹噲噲其正噦噦其𡨕君子攸寜皆生者所享也六章下筦上簟乃安斯寢乃寢乃興乃占我夢吉夢維何維熊維羆維虺維蛇居旣安則福可致也七章大人占之維熊維羆男子之祥維虺維蛇女子之祥鄭氏熊羆在山陽之祥也虺蛇在穴陰之祥也此意甚嘉而未盡凡物不蟄者属陽蟄者属陰虎以冬交藉陰以成也蛇以夏交藉陽以成也床在高陽也而璋以水成濟以陰也地在下隂也而瓦以火成濟以陽也古人處事制法無不合理無羊之夢亦然魚陰也禾亦陰也魚非水則不生然附日影乃成禾非水則不生然向日色乃成盖同類也故夢魚占豐年旟鳥隼飛者陽類也然寒乃健旐龜蛇濳者陰類也然勢乃毒萬物無逃二氣之間故夢旟旐多室家盖隂陽相交男女乃孶也易曰天地絪緼萬物化醇男女搆精萬物化生八章乃生男子載寢之牀載衣之裳載㺯之璋其泣喤喤朱芾斯皇室家君王室家皆事君王言貴近也九章乃生女子載寢之地載衣之禓載㺯之瓦無非無儀唯酒食是議無父母詒罹男子願使為公卿女子乃不願使為后妃惟議酒食所謂中饋也此事多詒父母之憂罕延門户之福有識士大夫所以不欲也鄭氏儀善也婦人無所專於家事有非非婦人也有善亦非婦人也此意亦嘉而未盡但不當彰是非之名于外爾聞音曰苞補掫切茂莫口切好許厚切猶余救切户後五切草訖力切正諸盈切簟子禁切今人猶有此聲吳氏前二章皆用引韻此一章不用未詳盖未察此也寢千尋切夢彌登切蛇余支切瓦危委切議魚覊切聞章曰舊九章四章七句五章五句今畧如舊章而差移舊句聞事曰四如言人功之敏也跂敏于足而若有翼者言如鳥也矢敏於逺而又敏於近棘讀作㦸鳥敏於羽而若有革言若獸也翬敏於躍而又敏於飛翬雉也飛一作蜚蜚如螟春秋秋有蜚總聞曰此士大夫卜地作室者也以為王者無見無羊倣此無羊一章誰謂爾無羊三百維群誰謂爾無牛九十其犉二章爾羊來思其角濈濈爾牛來思其耳濕濕或降於阿或飲於池或寢或訛三章爾牧來思何蓑何笠或負其餱三十維物爾牲則具爾牧來思以薪以蒸以雌以雄第五句爾牲則具當移入第七句以薪以蒸下以薪蒸之葉為牛羊雌雄之食也羊以三數凡三百頭是羊群之數牛以十數凡九十頭是牛群之數三十之物此也盖應上數四章爾羊來思矜矜兢兢不騫不崩麾之以肱畢來既升第二句矜矜兢兢下恐少爾牛來思一句羊小畜矜矜兢兢羊畏聳貌牛大畜不騫不崩牛堅重貌明兢兢下不騫上少爾牛一句五章牧人乃夢衆維魚矣旐維旟矣大人占之衆維魚矣實維豐年旐維旟矣室家溱溱説見斯干聞音曰犉而純切濈莊立切池唐何切物㣲律切今猶有此音雄于陵切孔氏兆如山陵有夫出征而喪其雄繇辭皆韻又古讀雄與陵爲韻詩正月無羊皆以雄韻陵韻蒸韻又張氏賓爵下華田鼠上騰牛哀虎變鯀化為熊乆血為燐積灰生蝇或疑張氏王氐古讀熊與雄皆于陵切張用舊韻也年彌因切聞章曰舊四章今為五章聞字曰濈濈鋭貌正羊角之狀從角尤佳不從角亦可説文和也毛氏息也似不必他訓牛安則耳潤病則耳燥濕濕牛安也毛氏動也訓亦似未當羊以角言牛以耳言恐是當時降阿飲池皆為水所沾後世不肯從物情時態推測古人簡易之意多以造意為能然古字亦通用斯干于加草亦止是于意戢從水亦止是鋭意總聞曰此詩每章稱爾必雙舉牛羊而此章獨闕牛文勢似不具識者更詳此士大夫檢校産畜料理生業者也喪亂之後零替者多忽然見之人相與生驚故曰誰謂爾無也詩總聞卷十一
