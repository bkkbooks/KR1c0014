body:
  text: 詩總聞卷五宋王質撰齊風雞鳴一章雞既鳴矣朝既盈矣匪雞則鳴蒼蠅之聲非雞鳴乃蠅聲非東眀乃月光所以不安二章東方明矣朝既昌矣匪東方則明月出之光三章蟲飛薨薨甘與子同夢㑹且歸矣無庶予子憎雖曉尚以同夢為美俾趨朝者且歸令人無多以我爾為憎予斥已也子斥君也言不使其歸則二人皆受多慊也此皆婦人之辭聞音曰明謨郎切惟皇矣其德克眀如今音餘皆謨郎故詩韻亦不可盡拘古而廢今也夢莫滕切總聞曰可見賢妃警戒之意孔氏以為非雞實鳴乃蠅之聲夫人在君所心常警懼故以蠅聲為雞鳴盖謂警懼之心亂其神故雞蠅之聲亂其聴也識者更詳還一章子之還兮遭我乎峱之間兮並驅從兩肩兮揖我謂我儇兮二章子之茂兮遭我乎峱之道兮並驅從兩牡兮揖我謂我好兮三章子之昌兮遭我乎峱之陽兮並驅從兩狼兮揖我謂我臧兮肩牡狼皆稱兩者彼亦有之此亦有之也故上皆稱並驅下皆言從兩聞音曰還旬緣切間居賢切茂莫口切道徒厚切好許厚切聞跡曰峱山在齊地當是如犬形嶑山􅿪山皆取形似聞人曰以子為稱以揖為禮似是士大夫聞事曰竝驅不必同行東西相遇亦曰並並言旁也漢書並音補曠切總聞曰此中土常態亦不必太誇當是輕儇驕恣之人非嘉士也不若大叔于田將叔無狃戒其傷女此頗有愛主及物之情也著一章俟我於著乎而君子與婦人成昏相肅之際也充耳以素乎而尚之以瓊華乎而二章俟我於庭乎而充耳以青乎而尚之以瓊瑩乎而三章俟我於堂乎而充耳以黄乎而尚之以瓊英乎而言其服不言其人似鄙其人也或指服為美或指服為惡尚餙也言餙即不足于真美加餙以外美故知為鄙辭也聞音曰著直居切素孫租切華芳無切瑩于平切英於良切總聞曰當是貴勢耑事服餙稍虧禮文故女子有望辭三進而三見易服乎疑辭而鄙辭此女子必有識者也今東人下流相語皆以而殺聲玩易之意也東方之日一章東方之日兮東方日出謂寅卯間也東方月出謂十五六間也此男女竊合同邁之日時也彼姝者子在我室兮在我室兮履我即兮二章東方之月兮彼姝者子在我闥兮在我闥兮履我發兮此男子本誘婦人而来乃若無故而至者佯為驚狀欲攜婦人而去乃若見廹不得已者佯為窘狀此滛夫而又有狡數者也即就也發起也履踐也凡足所就所起之地皆履踐之俗謂一歩踏一歩也總聞曰婦人墮其詭計可憐東方未眀一章東方未眀顛倒衣裳顛之倒之自公召之二章東方未晞顛倒裳衣倒之顛之自公令之三章折柳樊圃狂夫瞿瞿不能辰夜不夙則莫赴朝不厭早興趙盾所以却鉏麑也况欲曉未曉當興乆矣此必是醉亂之中偶有徴召之命而以非時召臣咎其君以逞狂駭人罪其使至以我折柳為藩故狂夫得越也俗所謂放鵰者也既挟持其君又挟持其將命之人言以君召臣非早則晚不過在日未有在夜者也君召有急則非時至之安論早夜此臣當是狡膓凶德者也聞音曰眀謨郎切顛之因切令離呈切圃博故切瞿俱具切夜羊茹切莫幕故切總聞曰君不能御下臣不能奉上君命不俟駕而行何咎之有雖其君有以致之然其臣亦太難堪也舊説歸過於君恐未然又歸過於壼人似亦無謂南山一章南山崔崔雄狐綏綏雄者如此雌者可知當是士大夫之在田野者作此故以南山野狐起辭其中麻畆薪斧皆田野之物此必士大夫所居在南山而近魯道所見者也魯道有蕩齊子由歸既曰歸止曷又懐止毛氏襄公文姜之醜見魯桓十八年既歸於人雖故情亦宜斷何尚有懐也二章葛屨五兩冠緌雙止魯道有蕩齊子庸止既曰庸止曷又從止葛屨在足冠緌在首各有所麗不可差也文姜雖齊妹而魯婦既用此禮其勢豈可以復相從責齊表之辭三章蓺麻如之何衡從其畆取妻如之何必告父母既曰告止曷又鞠止麻必附畆而蓺妻必告父母而取言文姜初以告父母為夫婦正也婚而不能以正裁制飬成至此自是而下責魯桓之辭四章析薪如之何匪斧不克取妻如之何匪媒不得既曰得止曷又極止薪必以斧而析妻必以媒而成言文姜初以媒妁而為夫婦亦正也大率其初皆以正而其末乃流于惡至此極也聞音曰懐胡隈切雙所終切畆莫後切母莫後切告姑沃切總聞曰文姜鄭忽所辭者也以為賢而不娶識者更詳甫田一章無田甫田維莠驕驕田大則人功難周故多莠人逺則國力難及故多勞也無思逺人勞心忉忉此人似是襄公古人取名不一且以童年取名言之襄公諸兒即其身取晋侯小子潞子嬰兒亦即其身取此詩稱總角至突弁略似襄公氣象也二章無田甫田維莠桀桀無思逺人勞心怛怛三章婉兮孌兮總角丱兮未幾見兮突而弁兮初見童稚忽見長成言年長而識不長也聞音曰丱扃縣切總聞曰此老臣事㓜君之辭不曉者以為孩撫其君曉者以為真愛其君也襄公自掩紀之後必啓其圖逺之心而有無厭之志此臣當已先覺連稱管至父之釁有萌不若姑置逺而且防近也似是鮑叔牙之流盧令一章盧令令其人美且仁言縱犬獵獸之人也此事仁者為之方為美也下章他美皆生於此二章盧重環其人美且鬈三章盧重鋂其人美且偲聞音曰令盧經切説文獜也引詩盧獜獜可從若從本文作鈴聲亦可環胡涓切偲新齎切説文以思得聲總聞曰此當是旁觀而為之夸譽者也能以仁為首辭則作此詩者必有識者也敝笱一章敝笱在梁其魚魴鰥齊子歸止其從如雲敝笱在梁則魚之恣適可知齊姜之狀如此當有同惡相為慫慂者衆也故曰如雲如雨如水二章敝笱在梁其魚魴鱮齊子歸止其從如雨三章敝笱在梁其魚唯唯齊子歸止其從如水聞音曰鰥姑倫切鱮才呂切唯維癸切聞訓曰惟毛氏以為出入不制鄭氏以為行相隨順猶人譍諾曰唯隨順者是總聞曰南山歸魯之時此則如齊之時也蓋魯桓未殞雖未殞如無人如笱既敝而在梁烏能制魚也其他㑹齊則魯桓已殞雖笱亦無也載驅一章載驅薄薄簟茀朱鞹魯道有蕩齊子發夕以暮發言心急也二章四驪濟濟垂轡濔濔魯道有蕩齊子豈弟三章汶水湯湯行人彭彭魯道有蕩齊子翶翔四章汶水滔滔行人儦儦魯道有蕩齊子逰遨聞音曰薄普各切夕祥龠切弟待禮切湯失章切彭必旁切聞訓曰豈弟樂易也在詩皆為美稱故鄭氏疑之以豈為闓以弟為圛言開眀猶發夕也以為古文尚書以弟為圛今攷皆無樂易猶彷徉與下文相應不强改聞事曰簟茀朱鞹自是文姜所乗之餙不必言襄公盖謂朱鞹諸侯之路車故以為齊侯是時文姜若乗魯侯之車何人能禁文勢自是文姜也總聞曰文姜自歸魯之後一與莊公如齊出魯還魯之後五自㑹齊杜氏夫人為魯人所責故出奔内諱奔故謂之孫又文姜與桓俱行而桓為齊所殺故不敢還若爾則非奔也又文姜未還故傳稱文姜出姜于是感公意而還若爾則復還也此詩當在孫齊之後也猗嗟一章猗嗟昌兮頎而長兮抑若揚兮美目揚兮巧趨蹌兮射則臧兮二章猗嗟名兮美目清兮儀既成兮終日射侯不出正兮展我甥兮俗傳外甥多似舅或魯莊稍肖齊襄好騰口者遂有齊侯之子之稱故詩人為魯莊解謗言信為我甥也三章猗嗟孌兮清揚婉兮舞則選兮射則貫兮四矢反兮以禦亂兮齊莊與文姜㑹禚㑹榖猶在齊地至防則不㑹齊地而㑹魯地恐越境貽患故齊人諷魯莊防變言不若反去矢而禦内亂盖懲魯桓之事也聞音曰正諸盈切貫扃縣切反孚絇切亂盧眷切聞訓曰昌名孌皆譽其才之辭長清婉皆譽其貌之辭不應二章目上為名目下為清不必從爾雅止作名譽之名文勢為佳總聞曰桓公父也文姜母也莊公子也莊公早年而桓公已殁文姜已出其後縱横徃来魯齊之間挾母之尊倚齊之強安可防閑雖髙世大賢處此亦難以為魯莊無出羣之英斷無化物之妙用則可失子道則太過也自舜之後豈可輕以此責人莊公未見可罪但見可憐爾魏風葛屨一章糾糾葛屨可以履霜摻摻女手可以縫裳葛屨忽已履霜言時易遷夏忽冬也女手忽已縫裳言人易長小忽大也當嫁之時也下所謂佩其象揥亦同二章要之襋之好人服之好人提提宛然左辟要䙅襋領也好人服之者言將適人以此供夫服也好人提提夫壻行將至也提提渉泥水貌宛然左辟忽已在左也旁邊貌妻父母之前男居左女居右今猶言左辟右辟辟有數訓一辟有積言稠叠也一摘辟言多禮節也一糾摘也一眩也一邪也一法也一君也一除也此當為除言礙路過兩旁故曰除道此皆入聲去聲囘也毛氏不敢當尊宛然而左辟亦在旁之意陸氏讀作避叶揥恐非三章佩其象揥維是褊心是以為刺言婚嫁太速其意欲早使夫力婦功以濟其家不虚度也此所以為褊而可刺也今河東風俗如此人家無有聞食者雖幼兒稚女亦隨力有職易林引此絲紵布帛人所衣服摻摻女手絃績繕織南國饒足取之有息自北言之則魏近南故曰南國此其民風大略也聞音曰服滿北切辟吴氏毗義切叶揥刺今連上叶襋服刺七賜切當與闕相近如雌為妻此為泚今俗讀吪吴氏良是聞章曰舊二章今為三章總聞曰既以民待之安有葛屨不可履霜今民草履不問嚴寒烈雪細民皆然又安得廟見三月方可執婦功又安得為女不可縫下服女子亦有下服如衵服皆與男子同制此亦非所以待民也毛氏鄭氏之説識者更詳汾沮洳一章彼汾沮洳言采其莫彼其之子美無度美無度殊異乎公路水際采草為人葅采木為蠶飼此窮賤之事也賦丰美之容而躬窮賤之役殊不似貴族訝之辭也二章彼汾一方言采其桑彼其之子美如英美如英殊異乎公行三章彼汾一曲言采其藚彼其之子美如玉美如玉殊異乎公族聞音曰莫末故切英於良切行戶郎切聞物曰莫茂子也如楮實藚澤㵼也牛脣初生皆可葅亦謂牛脣菜聞跡曰班氏魏在晋南河曲故曰彼汾一曲寘諸河之側不必如此水豈有無曲莫不有側特語法若此爾總聞曰貴者􅈕任賤者之事為人所難當為衆所服而見者已有殊異之辭寖生輕心當是障固山澤奪凡民所資也園有桃一章園有桃其實之殽心之憂矣我歌且謡不知我者謂我士也驕彼人是哉子曰何其心之憂矣其誰知之其誰知之盖亦勿思二章園有棘其實之食心之憂矣聊以行國不知我者謂我士也㒺極彼人是哉子曰何其心之憂矣其誰知之其誰知之蓋亦勿思采桃實以為殽采棘實以為食士大夫朋友相與㑹集游適者也但其憂不知何事發之歌謡付之行國必有難言而不可顯陳者也當時寡識者以歌謡為縱情而事驕佚以行國為騁意而無終窮懐憂者稍辨數之彼人君也是此事也言不君也何其當如何也言將亡也我之所憂人所不知所以不知者特不思而已苟思則與我同憂也此必其君或愎而自是或昏而無知而君子避患隠憂為國而有此風大不美也聞音曰哉將黎切思新齎切國越逼切聞人曰魏自周惠王庚申為晉所滅以封畢萬當時已有先覺者卜偃以為魏大名也萬盈數也畢萬之後必大司馬氏以為自晋獻公卒四子争立而畢萬之後彌大自晉文公入而武子有功晋悼公立而昭子又有功獻子桓子奕世愈張此當是有識者憂晋之終為魏有也但不知在何時周威烈王戊寅始建國裂晋分邦與韓趙同恢形勢已乆卜偃能見于初封之時而况寖乆而寖現乎此士大夫與朋友相與言者也故曰子曰何其此人未必深相知然可與言者也總聞曰鄭氏魏君薄公税省國用不取於民食園桃而已不修徳教民無以戰此侵削之由惟患公税不薄國用不省雖食園桃何害土階茅茨此堯所為聖人也德教孰大於此有君如是凡民願戴何患無以戰此富强之本非侵削之端也識者更詳陟岵一章陟彼岵兮瞻望父兮父曰嗟止予子行役夙夜無已上慎旃哉猶来無止此已解而尚相顧子有恨無言瞻望而已其父之辭督以勤勉以謹如此尚可来歸母兄之辭皆然止留也病而留所在不能歸也弃遺也鈍而不及其部伍不能同歸也死甚于止弃也皆庶幾不如此悲之辭也二章陟彼屺兮瞻望母兮母曰嗟止予季行役夙夜無寐上慎旃哉猶来無棄三章陟彼岡兮瞻望兄兮兄曰嗟止予弟行役夙夜必偕上慎旃哉猶來無死與部伍偕行不可獨後後必刑也聞音曰岵後五切父扶雨切子奨禮切屺坡里切母滿罪切兄虚王切弟待禮切偕舉里切死想止切聞句曰嗟斷句文勢當然語意愈切總聞曰毛氏父尚義母尚恩兄尚親尋詩予子予季予弟之辭皆親也夙夜上愼之辭皆義也無止無棄無死之辭皆恩也偶行役者少子爾非專愛其少子也若使孟子仲子當亦復然十畆之間一章十畆之間兮桑者閑閑兮行與子還兮居民唯恐其不多上固欲如此下亦欲如此翕集則舒愉此樂國之象也當是人多桑少為權力所障固采摘故民他求桑以育蠶爾今鄉落之間蠶時至為急廹近無所取則逺無所不至有有獲而徑歸者有無獲而不肯空歸前邁而逺求者此或還或逝者也二章十畆之外兮桑者泄泄兮行與子逝兮聞音曰間居賢切閑胡田切泄以世切總聞曰魏俗多以蠶為業以縑轉食蓋地勢隘而稼事不廣也蠶月壯者用力於外弱者用力於内晝夜奔疲今其風尚如此閑空也言桑葉稀也泄漏也言桑䕃薄也受畆之内無所取受畆之外又無所取以他求也亦可見當時促廹氣象伐檀一章坎坎伐檀兮寘之河之干兮河水清且漣猗不稼不穡胡取禾三百㕓兮不狩不獵胡曕爾庭有懸貆兮彼君子兮不素餐兮君子伐檀以易食非無故而取給者也不稼穡者胡為而取禾不狩獵者胡為而懸貆胡言汝何為而乃如此也君子不然計木之大小長短為資之贏虧多寡非拱手端坐而圖飽也二章坎坎伐輻兮寘之河之側兮河水清且直猗不稼不穡胡取禾三百億兮不狩不獵胡瞻爾庭有懸特兮彼君子兮不素食兮三章坎坎伐輪兮寘之河之漘兮河水清且淪猗不稼不穡胡取禾三百囷兮不狩不獵胡瞻爾庭有懸鶉兮彼君子兮不素飱兮後章言輻言輪則前章所以伐檀者蓋為此具也毛氏檀輻檀輪良是聞音曰檀徒沿切干居焉切餐七宣切側莊力切飱須倫切總聞曰覩河之清感君子之潔當是在清河清漳附近大率詩人觸境而後興辭河本渾而以為清或者即委曲解釋此談詩之獘也碩鼠一章碩鼠碩鼠無食我黍三嵗貫女莫我肯顧逝將去女適彼樂土樂土樂土爰得我所此必為吏臨民者習熟至於三年爾不相顧我亦不想戀凡人情一年猶有望二年已生心三年遂决志不皆如此大略如此也謂鼠無食我黍無食我麥無食我苗遺我為行資也二章碩鼠碩鼠無食我麥三嵗貫女莫我肯徳逝将去女適彼樂國樂國樂國爰得我直直價也所攜之黍之麥之苗苗萊也毛氏苗嘉糓也茅方苗則可茹榖方苗未可飯也言以此物于他國轉易以為生不虧其價也今人稱當價猶曰直杜氏城中斗米換衾裯相許寧論兩相直此言至急不復論直也三章碩鼠碩鼠無食我苗三嵗貫女莫我肯勞逝將去女適彼樂郊樂郊樂郊誰之永號永號言不知在後而不能前者何人長號也以去為喜以留為憂聞音曰顧果五切麥訖力切國越逼切聞字曰勞即下泉郇伯勞之之勞彼去音此平音音不同意則一吕氏春秋注作逃無謂聞訓曰永號難為歌號先號咷而後笑喜悲自是兩事歌號自是兩音語勢亦不如此總聞曰以鼠斥君度民心雖甚怨之亦不至此又以三年大比民于是徙若不堪而他適何俟大比也當是居官滿三嵗如今三年為任之類三載考績自舜法如此想周制猶然詩總聞卷五
