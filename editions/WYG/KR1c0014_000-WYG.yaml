body:
  text: 詩總聞詩類提要臣等謹案詩總聞二十卷宋王質撰質字景文興國人博通經史善屬文紹興三十年進士官至樞宻院編修出通判荆南府改吉州皆不行此書取詩三百篇毎章説其大義復有聞音聞訓聞章聞句聞字聞物聞用聞跡聞事聞人之别又問為總聞而聞南聞風聞雅聞頌冠於四始之首自漢以來説詩者多依小序蘓轍詩傳始去取相半其廢序言詩則鄭樵唱而質和之也質自謂覃精研思幾三十年始成是書吳興陳日强跋而鋟之富川稱其以意逆志自成一家雖間涉穿鑿亦可謂苦心立言者矣日强跋又曰其刪除小序實與文公朱先生合今考其書雖廢序說詩與朱子同而其為說則各異跋作於淳祐癸夘朱子之學方盛故日强假之以重質耳究非確論也乾隆四十三年閏六月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀詩總聞原序宋雪山王先生詩説二十卷其家櫝藏且五十年未有發揮之者臨川貳車國正韓公攝守是邦慨念前莗著述不可湮沒迺従其孫宗旦求此書鋟梓以廣其傳命工經始而日强分符來此公餘因取讀之其刪除詩序實與文公朱先生合至於以意逆志自成一家眞能寤寐詩人之意於千載之上斯可謂之窮經矣趣使鑱刻凡三閲月而後竣事使斯文顯行於世後學之幸也淳祐癸卯季冬上澣吳興陳日强書於富川郡齋詩總聞原例聞音者凡音韻是古音無有不叶特稱謂之殊呼吸之别傳寫舛訛連析差跌與夫古人取叶之法不同轉紐之法亦異雖古律不可以此而推然吟咏諷誦亦有所助葢倐見古人之心期語法有不期而㑹者作聞音一聞訓者凡字義是古訓多不同隨語生意亦有不當為此訓而為此訓有當為此訓而不為此訓有本無異義强出多端故語意多暗失作聞訓二聞章者凡分段是古為章後為解或以韻轉或以語轉或以事轉或以勢轉當是音調抑揚低昻不同故文辭相依隨而為節奏大率以意細推自見若拘於繁簡短長則其意不附章而生作聞章三聞句者凡句讀是古句有以肅為整有以亂為整或其意一斷一續之間一上附一下連之際逈令人開拓以至嘬嚅咨嗟従此得入作聞句四聞字者凡字畫是古字固多通用亦於偏傍繁省之間清濁輕重之際矯揉櫽括不勞更張自生義味但不可率情變文以附合已意若繩削得宜古今略無差别不見外手他迹作聞字五聞物者凡鳥獸草木是古物無異今物但稱謂差殊今詩所見不出書傳所載但博搜詳味或冇三見共同一出即可從不然亦必兩合其合仍須有理可以中情不可徒求合也切不用求竒喜新宛轉推測其衆所共識已所經見者不與作聞物六聞用者凡器物是古今尤無定展轉差殊今一鄉一里其所用制度稱謂有各不同制度雖同而稱謂不同者稱謂雖同而制度不同者而況方俗隔絶年代深邈但首尾前後以意細推自出縱不即出乆當自省作聞用七聞跡者凡在處是山川土壤州縣鄉落皆不可輕認亦必左右前後參伍錯綜以相推測或可得其眞亦有不似所在而實所在亦冇實所在而不似所在先繹本文徐及他載作聞跡八聞事者凡事實是古事安可容易推尋但先平心精意熟玩本文深繹本意然後即其文意之罅探其事實之跡雖無可考而亦可旁見隔推有相霑帶自然顯見作聞事九聞人者凡姓號是古人可顯考者固不在論其隠昧遺落亦就本文本意及旁人左右前後推量雖不得其眞亦可窺見其生死悲愉善惡老少雖不得其全亦可附見其風俗美惡時節寒暄與其人互相發明亦得彷彿作聞人十
