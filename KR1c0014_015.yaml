body:
  text: 詩總聞卷十五宋王質撰魚藻一章魚在在藻有頒其首當是朝廷以魚侑酒以豈為樂而勸王者之飲喜功成治定也說文豈還師振旅之樂從心從豈者非王在在鎬豈樂飲酒二章魚在在藻有莘其尾王在在鎬飲酒樂豈三章魚在在藻依于其蒲王在在鎬有那其居此飲酒畢奏樂也願安所處言人情愛君上如今言甚勞少歇也聞音曰此詩上下句皆對叶總聞曰治亂之世辭意氣象自可見無疑似可推演得以委曲扳援者皆盛時之詩强生辭以為亂世則恐錯亂情實非考古之正法也采菽一章采菽采菽筐之筥之當是諸侯來朝人君致禮都人登山臨水觀之後世郭子儀李晟之流來京師都人以為盛事或見歌詩恐殆亦類此君子來朝何錫豫之雖無豫之路車乘馬又何豫之𤣥衮及黼路車乘馬𤣥衮及黼可謂大賜而尚言無豫者自以為薄也謙之辭也下章旗鸞驂駟赤芾邪幅皆次第錫賚者也故初言豫之後言申之二章觱沸檻泉言采其芹君子來朝言觀其旗其旗淠淠鸞聲嘒嘒載驂載駟君子所届三章赤芾在股邪幅在下彼交匪紓天子所豫樂只君子天子命之樂只君子福祿申之四章維柞之枝其葉蓬蓬樂只君子殿天子之邦樂只君子萬福攸同平平左右亦是率從言君臣和順也安平在王之側有令則率從恭之辭也五章泛泛楊舟紼纚維之樂只君子天子葵之樂只君子福祿膍之優哉游哉亦是戾矣亦言君臣和順也優游處王之側有召則至亦恭之辭也聞音曰豫弋渚切馬滿補切泉才勻切旗渠斤切届居氣切下後五切命彌并切邦卜工切哉將黎切矣作平音總聞曰采菽者登山采菽為食而觀者也采芹者臨水采芹為食而觀者也枝者既飽依樹而立而觀者也楊舟或泛或維追逐而觀者也故詩稱言觀此為盡終日之觀則備終日之饌今人出遊出觀梢從容長逺者多然角弓一章騂騂角弓翩其反矣弓向外則弦上而矢發反則無用俗謂之反張病有此狀者難療兄弟昏姻無胥逺矣二章爾之逺矣民胥然矣爾之教矣民胥效矣三章此令兄弟綽綽有裕不令兄弟交相為愈令兄弟雖相逺能安處不令則交為相害言怨心生也四章民之無良相怨一方受爵不讓至于已斯亡言情不通也爵相爭而不相遜至其末則情皆亡言情從讓起從爭喪五章老馬反為駒不顧其後如食冝飫如酌孔取以老馬為駒已亦將有老時也食量所飫而酌量所取則不傷不量飢飽而食不忖多寡而酌亦不顧其後也言有後患也當是親戚之間有小人以年而先于衆者又當是親戚之間有君子以惡而逺其人者又不讓以美官使處下位故小人懷忿鷙肆忍毒尋詩皆勸君子慮後患者也六章毋教猱升木如塗塗附君子有徽猷小人與屬猱升木不待教塗附塗不待附言兄弟之情自然非由人力也君子小人雖異然同氣相連亦自其性也此必有兄弟之中小人以異趣害君子詩人言此天性不以君子小人而别也七章雨雪瀌瀌見睍曰消莫肯下遺式居婁驕言小人之惡亦易回稍下心與之則翻然既不肯降意小人又自處多驕無怪小人之欲快其志也言君子亦不善待小人咎之辭也八章雨雪浮浮見睍曰流如蠻如髦我是用憂小人蠻也蠻人心多悍君子髦也髦士心多正恐不勝小人是可憂也故再三勸君子少屈以下小人愛之辭也聞音曰反芬邅切逺於圎切愈羊汝切讓如陽切後下五切屬殊遇切髦莫侯切總聞曰詩人固消小人而長君子亦屈君子而下小人而况骨肉之間雖稍下之何足為屈也以五剛决一柔亦必健而說决而和故君子懲小人亦必有道也菀栁一章有菀者栁不尚息焉栁菀當是夏時今嵗又過半而為惡尚未息凡人以一時為一變時再變而惡如故處心寬者靜以待後也上帝甚蹈無自昵焉俾豫靖之後豫極焉以天自驚也無也俾也後也皆使之辭也蹈動也天意甚相動勿自親但守靜徐觀所至也言俟其惡稍息二章有菀者栁不尚愒焉上帝甚蹈無自瘵焉俾豫靖之後豫邁焉三章有鳥髙飛亦傅于天彼人之心于何其臻曷豫靖之居以凶矜言不若髙飛而避害也彼人斥在上也其心何所不至哉可守靜而待其居我凶危之地也决之辭也聞音曰瘵子例切邁力制切天鐵因切總聞曰此當危疑自寬解以待者也世固有用此道而安亦有用此道而危言可待者善人而偶誤用心不待者惡人而稔熟為惡也故末章有斷制之辭都人士一章彼都人士狐裘黃黃當是都人之賢士君子賢女相為夫婦而去都都人思之者也此似餞送之辭其容不改出言有章行歸于周萬民所望當是其士既賢而其女又淑先章全言士者本其夫也後章夫婦併言二章彼都人士臺笠緇撮彼君子女綢直如髮我不見兮我心不說三章彼都人士充耳琇實彼君子女謂之尹吉我不見兮我心苑結尹氏吉氏婚姻之著姓舊說亦有此理二姓同出尹吉甫一以官為氏一以字為氏不必改作姞四章彼都人士垂帶而厲彼君子女卷髮如蠆我不見兮言從之邁五章匪伊垂之帶則有餘匪伊卷之髮則有旟我不見兮云何盱矣言士則指其衣服言女則指其髮旟不欲斥言故舉其在身之物以思其人也聞音曰望無方切撮租悅切髮方月切說欲雪切結激質切厲落蓋切盱叶旟不用矣若用矣旁紐作平聲協兮總聞曰此必在東都而歸西周者也雖在東必以西為宗故言周道周京皆指故都為宗周三家無初章止三章唯毛氏有之大要在行歸于周一句豈可闕也行平音采緑一章終朝采緑不盈一掬豫髮曲局薄言歸沐二章終朝采藍不盈一襜五日為期六日不詹三章之子于狩言韔其弓之子于釣言綸之繩四章其釣維何維魴及鱮維魴及鱮薄言觀者黍苗一章芃芃黍苗隂雨膏之悠悠南行召伯勞之二章我任我輦我車我牛我行既集蓋云歸哉三章我徒我御我師我旅我行既集蓋云歸處四章肅肅謝功召伯營之烈烈征師召伯成之五章原隰既平泉流既清召伯有成王心則寧隰桑一章隰桑有阿其葉有難既見君子其樂如何二章隰桑有阿其葉有沃既見君子云何不樂三章隰桑有阿其葉有幽既見君子德音孔膠既見非已見也想像既見之後所說之情當如此也四章心乎愛矣遐不謂矣中心藏之何日忘之心甚愛斯賢而以逺不能告語為恨徒深藏而不忘也此必有欲言不得者也聞音曰難乃多切沃鬱縛切幽於交切愛許既切總聞曰君子所居有隰有桑是在野也思在野而不得見則必在位而不能往者也其詳見白華白華一章白華菅兮白茅束兮之子之逺俾我獨兮有花曰菅無花曰茅其色皆白大率此詩所引山野氣象為多草木之類則菅茅稻田桑薪之類鳥獸則鶖鶴鴛鴦天則雲露地則滮池扁石家則行竈漁梁皆山廬野宅所見所有者也二章英英白雲露彼菅茅天步艱難之子不猶天步如此艱難而不得與此人同謀也古以星土辨九州之地封域皆有分星略見丹元子步天歌天步謂此三章滮池北流浸彼稻田嘯歌傷懷念彼碩人四章樵彼桑薪卬烘于煁維彼碩人實勞我心五章鼓鐘于宫聲聞于外念子懆懆視我邁邁此所謀之大槩也必是人君袵席之間有所隱慝今則外彰念子不可見則愁不申視我無與同則意不悅其事迫而其情急也六章有鶖在梁有鶴在林維彼碩人實勞我心七章鴛鴦在梁戢其左翼之子無良二三其德自此人之外無良朋以相助所與處音皆二三之人豈可共謀也八章有扁斯石履之畢兮之子之逺俾我疷兮扁小石也此人當在巖谷之下故曰畢也初則傷次則勞次則病思之極也聞音曰茅莫侯切田地因切煁市林切邁力制切疷祈支切聞用曰煁烓也今行竈聞跡曰滮池與鄗池合在咸陽鄭氏酆鎬之間水北流而不指其的總聞曰此與隰桑之意同亦必與隰桑之人同隰桑之事尚淺故其辭未至于甚白華之事已深故其辭不勝其切此必事干宗社人民而非尋常者也隰桑之君子即此之碩人此之碩人即此之之子當時在朝既有賢者在野亦有賢者惜不能相㑹以為謀而徒勞思悵望此在朝者必有志而寡助在野者必有才而不用者也綿蠻一章綿蠻黃鳥止于丘阿當是重臣出行而下士冗役告勞者也道之云逺我勞如何飲之食之教之誨之命彼後車謂之載之聞其告勞而旋其憫心亦必賢者當是營謝之流也二章綿蠻黃鳥止于丘隅豈敢憚行畏不能趨飲之食之教之誨之命彼後車謂之載之三章綿蠻黃鳥止于丘側豈敢憚行畏不能極飲之食之教之誨之命彼後車謂之載之黃鳥當是春時春多雨丘多泥此適逺所冝告勞也聞音曰食疾二切載子麗切側莊力切總聞曰飲食憐其飢載憐其勞而又教誨者言分有貴賤任有勞佚使以理遣也此不止營謝之流恐即召伯黍苗隂雨正是此時所以重使人意及此也識者更詳瓠葉一章幡幡瓠葉采之亨之當是在野君子相見為禮者食瓠當是夏時君子有酒酌言嘗之二章有兔斯首炮之燔之君子有酒酌言獻之初章言瓠葉為葅耳大要以兔侑酒也故三章連及之北人膳羞多喜用禽獸而凡品以兔為貴射獵亦以得兔為勝三章有兔斯首燔之炙之君子有酒酌言酢之四章有兔斯首燔之炮之君子有酒酌言酬之兔以首言猶今言一頭兩頭也西人凡物皆以頭言于人亦以頭數閒音曰亨鋪郎切獻虛言切炙陟略切炮蒲侯切總聞曰此時當有遁隱在野者數詩皆有此意隰桑所愛之君子白華所念之碩人與此瓠葉亨瓠燔兔之君子恐皆此人得非隰桑白華欲見而不得者至是或假事以相見或將命以相見皆不可得而知疑其前詩有不勝思慕之情此詩有不任欣喜之狀此必有志投而意契者識者更詳漸漸之石一章漸漸之石維其髙矣西北少山東南多山大率山水皆起西而赴東南至海而止西北不甚習見故以為勞也山川悠逺維其勞矣武人東征不皇朝矣不皇猶不遑也古字通用不暇朝而見王不暇出而歸家其餘皆不暇他務將帥迫遽如此則事勢危急可知尋詩前二章初行之時後一章久役之時也毛氏鄭氏以皇為王語勢不順二章漸漸之石維其卒矣山川悠逺曷其沒矣武人東征不皇出矣三章有豕白蹢蒸涉波矣月離于畢俾滂沱矣武人東征不皇他矣豕江豚也此物出則雨兆月近畢則雨近箕則風故謂之畢雨箕風言西北之人不諳東南見豚出于江月近于畢則懷憂也江豚惟自岐出者大江有之不入他流所謂江烟漠漠江雨來天意為霖不干汝毛氏將久雨則豕進涉水波鄭氏豕唐突難禁制尤躁疾者離其牧處涉入水波今人豢豕極多未見如此者也聞音曰沒莫筆切聞字曰集韻漸嶄嶄皆同不必作嶄聞物曰江豚大略猪首魚尾有兩足微白全身皆肉不堪食可取膏湖湘間人多用之總聞曰東南夷見于詩者淮夷荆舒得人則有喜江山之心不得人則有懼山川之意亦各係其人也觀此詩及東山江漢諸詩可見尋詩其人非不難冒盡瘁亦時節不嘉人情少舒觸境皆非美氣象爾苕之華一章苕之華藝其黃矣心之憂矣維其傷矣二章苕之華其葉青青知我如此不如無生三章牂羊墳首三星在罶人可以食鮮可以飽牂羊牝羊也墳當作字轉恐亦通用牡羊也牝羊而牡首豈有此理三星在天而在罶亦豈有是理言雌雄變易上下顛倒此時但得食已為過求飽則難也言世路不嘉也聞音曰飽補掫切總聞曰見苕華而感世態漸就凋不復勞也大要在牂羊三星二句此其所以無生意也此必訴人之詩故曰知我如此何草不黃一章何草不黃何日不行何人不將經營四方二章何草不𤣥何人不矜哀我征夫獨為匪民言不以民待下也三章匪兕匪虎率彼曠野哀我征夫朝夕不暇我非虎非兕而常在野哀之辭也四章有艽者狐率彼幽草有棧之車行彼周道狐在野人在里各其所也狐在草而我挽車常在道狐之不如甚哀之辭也聞音曰行戶郎切𤣥胡均切野上與切暇後五切總聞曰草自黃而𤣥與苕自花黃而葉青同為時節之變苕花漸謝春夏時也草色漸槁秋冬時也當是所厯之時不同苕之花何草不黃之詩一引羊罶起興一引兕虎狐起興又皆以山卉山蕪為辭當是在野者也或士與民未可審知爾詩總聞卷十五
