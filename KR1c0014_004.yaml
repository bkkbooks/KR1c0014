body:
  text: 詩總聞卷四宋王質撰王風黍離一章彼黍離離彼稷之苗行邁靡靡中心搖搖知我者謂我心憂不知我者謂我何求悠悠蒼天此何人哉二章彼黍離離彼稷之穗行邁靡靡中心如醉知我者謂我心憂不知我者謂我何求悠悠蒼天此何人哉三章彼黍離離彼稷之實行邁靡靡中心如噎知我者謂我心憂不知我者謂我何求悠悠蒼天此何人哉聞音曰天鐡因切噎益悉切説文以一得聲總聞曰後人用此意極多自苗至穗自穗至實度及半載不應行役無故淹留至此當是東周懷忠抱義之士來陳秦庭以奉今主歸舊都為意或以尊王室制諸侯為辭往往有怪其久留不去者也徒隱憂難明告以不知者為何人言此等人非我輩人也君子于役一章君子于役不知其期曷至哉雞棲于塒日之夕矣羊牛下來君子于役如之何勿思二章君子于役不日不月曷其有佸雞棲于桀日之夕矣牛羊下括君子于役苟無飢渴雞牛羊皆在郊所豢者也今田野人家向暮多如此班氏日暗暗其將暮覩牛羊之下來寤怨曠之傷情哀詩人之嘆時聞音曰哉將黎切塒辰之切來陵之切思新齎切渴巨列切總聞曰當是在郊之民以役適逺而其妻于日暮之時約雞歸棲呼牛羊來下故興懷也大率此時最難為别懷婦人尤甚君子陽陽一章君子陽陽君子婦人之夫也當是婦人之辭左執簧右招我由房其樂只且二章君子陶陶左執翿右招我由敖其樂只且房敖皆地名當是招其妻從房從敖而往也此言不安其所既去則樂陽陽酒色也陶陶酒意也以酒銷憂夫婦相為樂也聞音曰只且嘆辭以且相叶聞迹曰房在汝南敖在滎陽房國見左氏楚遷房于荆敖即搏獸于敖之敖總聞曰大率舊説多以伶官為賢者君子之地夫賢者君子亷恥乃其本節安肯苟求食而為此流也當是以簧翿之故不特誤以婦人之夫為君子而又誤以地名之房為房中樂也語意亦于房中不順揚之水一章揚之水不流束薪彼其之子不與我戍申懷哉懷哉曷月豫還歸哉揚水能流物而不能為我流束薪束楚束蒲以濟我家也二章揚之水不流束楚彼其之子不與我戍甫懷哉懷哉曷月豫還歸哉三章揚之水不流束蒲彼其之子不與我成許懷哉懷哉曷月豫還歸哉當是役夫逺戍而恨其家薪芻之不充憫其妻貧苦之獨處願與之同戍而有所不可則逆計月以數歸期也聞音曰懷胡隈切叶歸不用哉叶蒲滂古切聞迹曰揚水自晉州洪洞縣注河周北接晉西接鄭後晉鄭詩揚之水皆此水也申今申州甫今汴州許今許州皆周近地總聞曰詩有三揚之水三羔裘兩黃鳥兩谷風非相祖述也有此曲名故相傳為之如樂府一種名而多種辭辭雖不同而聲則同也今諸曲亦然中谷有蓷一章中谷有蓷暵其乾矣所稱遇人謂夫也此當是婦人之辭有女仳離慨其嘆矣慨其嘆矣遇人之艱難矣蓷益母草也可作瑩靣之藥婦人所珍而山野甚易致夫婦既無食不能相有而相捨指此物以寄意也端午採良佳其乾當是夏時二章中谷有蓷暵其修矣有女仳離條其嘯矣條其嘯矣遇人之不淑矣三章中谷有蓷暵其濕矣冇女仳離啜其泣矣啜其泣矣何嗟及矣當是既乾不可復生而雨澤乃有沾濡雖稍潤亦無及也聞音曰嘆他干切修式竹切莊子翛然而往翛然而來亦此切嘯息六切聞物曰益母草在野甚多最能任酷烈日愈烈色愈鮮此乾則禾稼可知也總聞曰嘗見旱歲道塗夫婦相攜相别有不忍之情于男女亦然此事自古有之初慨嘆吐氣之微也次條嘯吐氣之猛也次啜泣吐聲而又吐淚也此分攜之時也所見亦然今古雖異人情不逺也兔爰一章有兔爰爰雉離于羅兔兔絲也亦作菟絲羅罝也菟草之中置羅置罦置罿雉墮其中也爰延引也我生之初尚無為我生之後逢此百罹尚寐無吪二章有兔爰爰雉離于罦我生之初尚無造我生之後逢此百憂尚寐無覺三章有兔爰爰雉離于罿我生之初尚無庸我生之後逢此百凶尚寐無聰言幼時尚未為未造未庸言未有征役也長時乃為丁壯役少猶可勉役多則何堪不如死也百多也寐不動不醒不聞所謂長夜也聞音曰為吾禾切罹良何切罦步廟切造在敖切憂一笑切覺古孝切左氏齊歌曰魯人之皋數年不覺使我髙蹈惟其儒書以為二國憂皋居號切覺古孝切則是憂覺古蓋常用之也罿昌鍾切總聞曰舊説兔爰緩意雉離急意又以緩有所聽縱也急有所躁蹙也後多祖之以為物有幸不幸也人情無緩兔急雉之理兔至輕捷亦無從容之意雉至卑飛可無躁蹙之意今以兔為兔絲不惟有所本而人情物態不甚抵捂可以粗通也葛藟一章綿綿葛藟在河之滸終逺兄弟謂他人父謂他人父亦莫我顧此人當是居河之湄者也感葛藟而思身世謂葛藟尚不斷我與本宗絶所生稱他人作所生不如葛藟也二章綿綿葛藟在河之涘終逺兄弟謂他人母謂他人母亦莫我有三章綿綿葛藟在河之漘終逺兄弟謂他人昆謂他人昆亦莫我聞聞音曰父方知切顧果五切涘羽已切母滿罪切有羽軌切總聞曰皆以兄弟為辭當是為不友之兄弟所隔而不得安處者也或棄而與他人或出而繼旁族終不若所天之愛此真情也今人或如此以異姓之子為子以同姓之子為子多始末有參差故有歸姓歸宗不幸至冇流落死亡者此人蓋有此恨也采葛一章彼采葛兮一日不見如三月兮草木可采當是春夏之時二章彼采蕭兮一日不見如三秋兮三章彼采艾兮一日不見如三歲兮聞音曰葛居謁切蕭踈鳩切艾魚刈切今皆作牛蓋切古不用此總聞曰當是同志在野之人獨適而不與俱故有此辭言我采此物想彼亦采此物但不同采爾大車一章大車檻檻毳衣如菼婦人見貴人聲勢被服之盛私心慕之此必微時深有相涉盛時不敢復論似有望意以其相忘也豈不爾思畏子不敢二章大車啍啍毳衣如璊豈不爾思畏子不奔三章穀則異室死則同穴謂豫不信有如皎日生異室死同穴言此生永不可同也俟其死則從之也聞音曰檻故覽切菼吐敢切啍他敦切穴户橘切總聞曰此婦人謂其同輩之辭同輩以為未必能也故指日為誓也丘中有麻一章丘中有麻彼留子嗟彼留子嗟將其來施施二章丘中有麥彼留子國彼留子國將其來食三章丘中有李彼留之子彼留之子貽我佩玖彼所留之子可嗟嘆可疑惑卒章嗟嘆疑惑不足盡其情故不言此當是避難之人為在野之家所匿以佩玖報之言其恩可長感也聞音曰古施字作頓伺候之辭時遮切叶嗟國字與或字互用疑惑之辭胡骨切叶麥古蜮字又作蟈蟈音又作域明國或相通也周穆公鼎國作或聞人曰毛氏留氏也子嗟子國字也子國子嗟之父遍考止有衛大夫留封人不見有留子嗟留子國總聞曰當時先王之澤未絶田野尚有義士鄭風緇衣一章緇衣之宜兮敝豫又止改為兮適子之館兮還豫授止子之粲兮緇衣卿士之服當是在外入為卿士在都者相與為禮緇衣且宜且好且席尚以為敝欲有所更甚欲其美也既適館又授粲惟恐其禮之不周也二章緇衣之好兮敝豫又止改造兮適子之館兮還豫授止子之粲兮三章緇衣之席兮敝豫又止改作兮適子之館兮還豫授止子之粲兮聞音曰席祥籥切聞句曰敝豫又止還豫授止舊四句今為六句總聞曰好賢如緇衣惡惡如巷伯古稱緇衣止為好賢尋詩不見有他意大率先儒雜記引詩多隨意隨事不皆叶其本旨此所引二詩略合將仲子一章將仲子兮無踰我里無折我樹把豈敢愛之畏我父母仲可懷也父母之言亦可畏也當是仲氏逞橫婉為辭以拒之非敢有愛而父母在上已不敢專弟雖可念恐父母有責吾兄弟皆可畏也言不特吾得罪汝亦得罪次以兄為辭次以人為辭皆拒之辭也二章將仲子兮無踰我牆無折我樹桑豈敢愛之畏我諸兄仲可懷也諸兄之言亦可畏也三章將仲子兮無踰我園無折我樹檀豈敢愛之畏人之多言仲可懷也人之多言亦可畏也聞音曰母滿補切懷胡隈切畏於非切兄虛王切檀徒沿切總聞曰鄭氏所引武薑昵叔段欲立為太子不遂請制請京又將啓以成亂城頴蓋由此也尋詩乃以父母不欲為辭此事蓋生于薑氏成于薑氏皆其本謀故太叔以至如此安得藉以為辭拒之畏我父母恐是畏諸父母或是畏我諸母必有一誤叔于田一章叔于田巷無居人豈無居人不如叔也洵美且仁二章叔于狩巷無飲酒豈無飲酒不如叔也泃美且好三章叔適野巷無服馬豈無服馬不如叔也洵美且武叔往而人皆從市為之空蓋可觀也聞音曰田地因切狩始九切好許厚切野上與切總聞曰仁慈也好和也武毅也三者人之所歸太叔段何以當之當是其徒夸為之辭大叔于田一章叔于田乘乘馬執轡如組兩驂如舞叔在藪火烈具舉袒裼暴虎獻于公所將叔無狃戒其傷女藪葭葦之地也用火所以發獸也如今野燒韓氏陸渾火詩可見二章叔于田乘乘黃兩服上襄兩驂鴈行叔在藪火烈具揚叔善射忌又良御忌抑磬控忌抑縱送忌三章叔于田乘乘鴇兩服齊首兩驂如手叔在藪火烈具阜叔馬慢忌叔發罕忌抑釋棚忌抑鬯弓忌一章發獸得虎即止此校獵之常制鷹犬得兔即休鷹犬戈矢得虎即息戈矢二章騁伎不以從獸為事也三章畢事初馬緩矢稀次矢覆弓韜將還歸也聞音曰馬滿補切行户郎切御魚駕切鴇補苟切阜符有切弓姑宏切聞物曰鴇當是馬名鴇似鴈有行列似豹有斑文故謂之鴇豹如師子花之類也總聞曰公子吕所謂請除之無生民心子封所謂可矣厚將得衆尋詩若有此理清人一章清人在彭駟介旁旁二矛重英河上乎翺翔臨河名清者甚多河清臨清清河清池清陽酈氏以清陽亭即故清人城引此詩清人在彭當是此地徵調者分而在彭在消在軸毛氏以為河上地髙克邑左氏衛侯宫喜盟于彭水之上衛鄭相近彭或是此二章清人在消駟介麃麃二矛重喬河上乎逍遙三章清人在軸駟介陶陶左旋右抽中軍作好左旋旋鞚多用左手右抽抽矢多用右手此章為中軍則前二章為前後軍也聞音曰彭普郎切英於良切陶徒報切好呼報切孫氏抽土刀切本掐借用作抽掐亦抽也審爾則好旁紐作蒿為正但軸字未詳所以不能如前二章也總聞曰當是軍士有戰心而或抑之不能有所逞左氏魯閔二年所引序皆祖之而增辭甚衍細考春秋所書鄭棄其師十二月狄入衛是月鄭有棄師之告此必衛告急于其鄰髙克實任此行而文公不欲故陷髙克于難存之地也尋詩軍容士氣可見髙克之心亦可見三軍之意序所謂好利不顧君杜氏從之似或未然故書鄭者非髙克棄師實鄭棄師也據傳宋桓逆衛遺民于河立戴公以廬于漕齊桓使公子帥甲乘以戍漕雖未必衛告鄭或是宋齊告鄭鄭文不同此舉故宋齊獨為之也羔裘一章羔裘如濡洵直且侯彼其之子舍命不渝此衣羔裘者信矢直而且中侯也其武而有力也言彼朝服而從事武技彼衣是服者處危而不變主正而不傾與服相稱而不如此也二章羔裘豹飾孔武有力彼其之子邦之司直羔裘而飾以皮其狀可見三章羔裘晏兮三英粲兮彼其之子邦之彥兮晏晚也三心星也詩以三為心星形象數也英心星之光華言衣羔裘自早而至晚心星有光豪意未止彼衣是服者但見其美而不如此之粗縱也聞音曰侯洪故切彥魚肝切聞用曰羔裘加緇衣則為諸侯之朝服單羔裘則為卿大夫之朝服狐裘加黃衣則為諸侯之祭服單狐裘則為卿大夫之祭服麑裘加素衣則為諸侯之喪服單麑裘則為卿大夫之喪服此羔裘卿大夫之朝服也總聞曰羔裘與羔羊其服相肖而治亂賢否之氣象不同遵大路一章遵大路兮摻執子之袪兮無我惡兮不寁故也執袪留之切執手留之愈切其人決去既已堅苦挽必不樂留者亦不敢取必但願其不速姑小駐以敘久要也二章遵大路兮摻執子之手兮無我魗兮不寁好也聞音曰袪起據切惡烏路切魗齒九切好許厚切魗今不樂者猶作此狀總聞曰當是同志相善有不安而他之者以故以好攬之大路非以他譴而避必以正理者也故顯行而無畏憚女曰雞鳴一章女曰雞鳴士曰昧旦子興視夜明星有爛當是君子與朋友有約夫婦相警以曉恐失期也大率此詩婦人為主辭故子興視夜以下皆婦人之辭士女問答相應起辭也亦婦人之辭也將翺將翔弋鳬與鴈所適必遵河或度河故以弋鳬鴈為辭此鴈或是春自南歸北或是秋自北趣南鴈隨隂陽不以中國為居比及秋則已寒今夜興星爛似是春時可以早出也二章弋言加之與子宜之宜言飲酒與子偕老琴瑟在御莫不靜好弋而得鳬鴈又增加之以多為貴也言賔客饜飫之餘則我與子宜飲酒作樂言所得不獨宜及友亦當宜及我同享之也所以貴于加之恐不足也三章知子之來之雜佩以贈之知子之順之雜佩以問之知子之好之雜佩以報之婦人警君子行期知其良友不可誤約所以一章連三知言知之審也若知非良必不導君子以曉出相同行為樂事也所知備為問遺者勸君子畢行樂約俱來言我已有待子無所慮也聞音曰加居之切老魯吼切來鄰知切好許厚切順叶問好叶報惟來贈不叶贈當作貽生轉不然則以之為韻詩多如此聞用曰古以玉為佩雜佩者不必以玉他物但有鳴聲者皆可為佩總聞曰當是君子喜結客婦人又好客惟恐君子不得良友也亦欲其來以觀其人杜氏送王砯詩自陳剪髻鬟鬻市充杯酒上云天下亂宜與英俊厚回竊窺數公經綸亦俱有此殆類王圭之妻也有女同車一章有女同車顔如舜華舜木槿也盛夏已吐花當是此時國人見而喜之辭也將翺將翔佩玉瓊琚彼美孟薑泃美且都二章有女同行顔如舜英將翺將翔佩玉將將彼美孟薑德音不忘聞音曰華方無切行户郎切英於良切將七羊切總聞曰所見親迎之禮彼美之貌似是與婦成禮而非憚耦辭昏者左氏鄭忽辭齊昏之事甚詳此專拾其説不惟尋詩不見而亦與左氏不合當是因薑姓為齊女遂以鄭忽附之識者更詳山有扶蘇一章山有扶蘇隰有荷華扶蘇野蘇也荷華菡萏也扶如言扶踈謂密不見子都乃見狂且此婦人適夫家經厯山隰所見當是媒妁姑以美相欺相見乃不如所言怨怒之辭也二章山有喬松隰有遊龍不見子充乃見狡童龍葒草也遊如言遊放謂散龍當為蘢省文古鼎彛多從省國為或鉦為正銖為朱祥為羊有極省者哉為十帝為闕聞音曰華方無切且子餘切總聞曰此媒妁之過也今多或如此蘀兮一章蘀兮蘀兮落葉當是秋時風其吹女叔兮伯兮倡豫和女蘀已稿風又加其勢可見親族當力相扶持尊者為倡而卑者相和庶幾能免此當是尊者無情卑者有意雖有所禱亦有所責之辭二章蘀兮蘀兮風其漂女叔兮伯兮倡豫要女聞音曰和户圭切老子髙下之相傾長短之相形聲音之相和前後之相隨和叶吹類此漂匹遙切要於遙切總聞曰或國與家未可知當是有乘微弱而謀傾奪者有識有情動念而力不能獨辦故有求于為倡者也狡童一章彼狡童兮狡童即山有扶蘇所見者也不與我言兮維子之故使我不能餐兮與正已者相踈必與比已者相昵此忠于彼者所以不遑食不能息也二章彼狡童兮不與我食兮維子之故使我不能息兮聞音曰餐七宣切總聞曰鄭忽言行蓋亦近賢不可以成敗論人所謂狡童當有他人當之非謂忽也褰裳一章子惠思我褰裳涉溱溱出浮石嶺青衣山洧出潁川陽城山褰裳而涉不待具舟以渡其情必有甚急者尋詩可見子不我思豈無他人狂童之狂也且當是鄭人不安狂童欲脫身逺害而外境有相知者以情屬之相知又似不領其情故其辭若甚急而有切責之意也二章子惠思我褰裳涉洧子不我思豈無他士狂童之狂也且總聞曰三詩皆及狂狡之童正文不得其的而他文未可盡信不知在位之君惟復在位之臣不知在家之長惟復在家之鄰有一皆當相逺而利害最迫禍福所係莫若在位之君臣也鄭自昭公之後子亹子儀連弒而子儀號曰鄭子當是初立少年故有子稱及在位十四年而戕于傳瑕亦不改子號與童頗應其臣如髙伯祭仲傅瑕之徒皆專強但未見童狀其他皆無見也丰一章子之丰兮俟我乎巷兮丰親迎者之貌當是壻無可議而主昏者忽有所嫌悔豫不送兮當是時已至男來迎而主昏者卒有異謀不克成禮後有悔者也二章子之昌兮俟我乎堂兮悔豫不將兮三章衣錦褧衣裳錦褧裳叔兮伯兮駕豫與行四章裳錦褧裳衣錦褧衣叔兮伯兮駕豫與歸當是主昏以不克成禮而悔他推叔伯以遣送之蓋已慚也聞音曰丰芳用切巷胡黃切行户郎切聞用曰褧檾也枲屬也言以枲為錦當是士庶之家也總聞曰與蘀兮皆及叔伯二詩必出一家此叔伯者當是宗黨所推衆情所附故事有難處者率以歸之東門之墠一章東門之墠茹藘在阪其室則邇其人甚逺當是女家男家相鄰室甚近而人甚遙蓋男家頗難之而女家欲成之也二章東門之栗有踐家室豈不爾思子不我即踐不必言淺欲其履此地也尋詩其人甚逺女未就男子不我即男未就女若奔則不期而遽合何有此辭聞音曰墠上演切總聞曰尋詩不見奔狀奔當作去聲猶言急投也冒危犯難觸刑越禮皆有所不顧情所逼也雖逺且不憚奚況不逺此詩從容悁悒與奔不同蓋謀昏而未諧也女采茜以染采栗以食之際不無所感固非正念然以為奔則過也風雨一章風雨凄凄雞鳴喈喈此詩言風雨之狀當是秋時既見君子云何不夷二章風雨蕭蕭雞鳴膠膠既見君子云何不瘳三章風雨如晦雞鳴不已既見君子云何不喜聞音曰喈居奚切瘳憐蕭切晦呼罪切總聞曰婦于夫多稱君子當是秋時將旦而聞雞此婦人之情所難處者也方有所思而遽見故有興悅愈疾之辭子襟一章青青子襟悠悠我心縱我不往子寧不嗣音此已在位而故人在野者也青襟野服當是相思而有欲見之意望其來而不肯至者也二章青青子佩悠悠我思縱我不往子寧不來三章挑兮達兮在城闕兮一日不見如三月兮此從事在都多務不得適野以此寄謝然其不安之情可見聞音曰佩蒲放切來陵之切達陀悅切聞訓曰挑達不安貌總聞曰故人在位而不往見蓋賢者也故人在野而有所慚亦賢者也曹氏青青子襟悠悠我心但為君故沉吟至今正引此詩無爽揚之水一章揚之水不流束楚終鮮兄弟維豫與女無信人之言人實廷女此與周揚之水其辭多同當是同居此水之旁故平常諷道之語多習傳也二章揚之水不流束薪終鮮兄弟維豫二人無信人之言人實不信當是兄弟止二人無他昆為人所間而不協者此蓋兄辭聞音曰女忍與切信斯人切總聞曰束楚束薪亦與周揚之水同意吾家之薪蒸非水所流而與之惟兄弟輸筋力然後可致也何可信人言以替家事乎度其家甚窶所仰甚寡故其辭尤哀也出其東門一章出其東門有女如雲雖則如雲匪我思存縞衣綦巾聊樂我員二章出其闉闍有女如荼雖則如荼匪我思且縞衣茹藘聊可與娛雖遊女如雲之盛如荼之密皆非所思知其有所主也惟縞衣而綦巾縞衣而茹藘者可與通歡縞衣婦喪夫者也綦蒼艾色茹藘絳色以色包首出遊不肯全縞男見此動念知其無所主者也聞音曰闍東徒切且叢租切存也總聞曰此婦人不純喪服且居喪而出遊男子之無似者所動心也出其東門東門之墠者言東門蓋其國都湊集冶樂之地茜草必此方所多有故亦連及之野有蔓草一章野有蔓草零露漙兮當是深夜之時男女偶相遇者也有美一人清揚婉兮邂逅相遇適我願兮二章野有蔓草零露瀼瀼有美一人婉如清揚邂逅相遇與子偕臧雖有情合亦欲以禮成也蓋有慚心欲蓋外議也聞音曰漙土兖切願五逺切聞字曰漙或作不必後用作團亦得所謂庭前有白露暗滿菊花團團包裹也言露多也此漙亦是此意聞訓曰如音訓皆作而古字多用此春秋星隕而雨毛氏君子偕老清視清明也揚廣揚而額角豐滿也此清揚眉目之間皆毛氏訓而微異今從前説總聞曰大率始無恥而終有慚聖人多憐之凡存諸詩皆非斥絶者也溱洧一章溱與洧方渙渙兮士與女方秉蕳兮女曰觀乎士曰既且且往觀乎洧之外洵訏且樂惟士與女伊其相謔贈之以芍藥女情有所迫男心有所憚故再督而始從二章溱與洧瀏其清矣士與女殷其盈矣女曰觀乎士曰既且且往觀乎洧之外洵訏且樂惟士與女伊其將謔贈之以芍藥舊説椒滋陽者也故女贈男以椒芍藥滋血者也故男贈女以芍藥雖不害為過用意然揆以人情未必如此相遇相謔之際正世俗所謂奔路者也安得更有所擇聞音曰渙乎元切蕳居賢切且叢租切聞迹曰溱通作潧水經潧水即溱也許氏酈氏皆引此詩溱與洧者也左氏龍鬭鄭時門之水洧淵時門鄭南門也今洧水自鄭城西北入而東南流徑鄭南城之南門蓋洧占鄭都城內外為多故此言洧亦多洧之內則城內而洧之外則城外也總聞曰士始以辭拒女卒以情從女士過輕于女過蓋自女先發端而又督成也鄭氏以為仲春韓氏以為上已則季春也鄭俗于此招魂續魂秉蘭草祓除不祥皆附合此詩氣象頗似晚春聚會遊觀之時但不知上已何考詩總聞卷四
