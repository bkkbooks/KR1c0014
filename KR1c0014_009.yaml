body:
  text: 詩總聞卷九宋王質撰雅聞雅一雅樂歌名也雅有大雅小雅見于季子所觀猶之可也南山有臺之類豈不大而入小泂酌之類豈不小而入大姑猶之可也既强以為風有正風變風又强以為雅有變雅前人所言以事之美惡分正變以辭之繁簡分大小既立此法則古詩必有更張移易者細推季子所觀小雅有美有惡大雅有美無惡小雅美哉思而不二怨而不言其周德之衰乎猶有先王之遺民焉杜氏以為遺民者商王餘俗故未大審爾乃周德之盛非周德之衰也故此成康以下者皆是也大雅廣哉熙熙乎曲而有直體其文王之德乎杜氏以為雅者詠盛德形容但歌其正不歌其變審爾則小雅亦雅也何以及衰故此穆夷以上者皆是也更改移易斷無可疑者風亦有之如何彼穠矣之類明為王姬下嫁齊侯之詩是也姑存以待識者聞雅二雅大小諸篇據序王雅及后稷及公劉及太王及王季及文王及武王及成王及宣王凡其上世之賢君無有不及變雅止及幽厲而不及他王自厲王以上有昭王穆王共王懿王孝王夷王自幽王以下有平王桓王王風止于桓王未聞以下而皆不及至其詩無可復見幽厲之干涉者則以為思古思古不思文王而專思武王不思康王而專思成王皆不可曉恐其間亦不及他王或臣或民或男或女者不專二人當之子貢曰紂之不善不如是之甚也是以君子惡居下流天下之惡皆歸焉然既為此學當不愧于天不怍于人不可承流言為實說使為惡而苟免者何幸非已而妄受者何寃且如無將大車悔將小人小眀悔仕亂世小人亂世豈非為君之罪而不以幽王為刺何也采菽婦人怨曠瓠葉士大夫饔餼微薄何與于人君而乃以幽王為刺何也且如漸漸之石以夷狄征役久病而作苕之華以夷狄師旅並起而作何草不黃亦以夷狄用兵不息而作而前後兩詩皆刺幽王中一詩不刺幽王何也瞻卬召旻皆凡伯刺幽王大壞一稱旻天一稱昊天獨以旻為閔小旻又不以為閔何也節南山正月十月之交雨無正小旻小宛序皆刺幽王而毛氏以二詩為刺幽王四詩為刺厲王何也序者如此釋者如此皆所不曉也聞雅三漢晉以下有迎享送神曲皆用諸大神後世亦施諸小神今考楚茨自楚楚者茨一章濟濟蹌蹌一章迎神也執爨踖踖一章我孔熯矣一章送神也又有夕牲引牲歌夕牲視牲也引牲陳牲也今考信南山恐是此歌甫田大田皆是饗神之曲後世有藉田迎享送神歌太社及先農迎享送神歌必有自來或曰頌告神之詩雅非告神之詩特詠事之詩也自梁定國樂竝以雅為稱衆官出入奏俊雅皇帝出入奏皇雅太子出入奏徹雅王公出入奏賔雅上夀酒奏介雅食舉奏需雅撤饌奏雍雅牲出入奏滌雅薦毛血奏牲雅降神及迎送奏諴雅皇帝飲福酒奏獻雅燎埋奏埋雅今楚茨信南山大田甫田略見而楚茨為詳後世有飲福撤爼歌今楚茨末章亦具所謂禮儀既備也聞雅四古曲不傳于後世而三國六朝之間尚或有之漢有殿中食舉七曲大樂食舉十三曲魏有四曲皆取鹿鳴而魏曲又增騶虞伐檀文王皆古聲亂後改騶虞伐檀文王三曲更自作聲莭其名雖同而聲實異唯鹿鳴獨得存後又改第一曰於赫與古鹿鳴同第二曰巍巍用後所改騶虞聲第三曰洋洋用後所改文王聲第四曰日復復用鹿鳴聲不用伐檀聲也且以詩推之則其存尚見于此今觀於赫與鹿鳴繁簡長短不同不知何由用其聲世傳桑景舒聞虞美人曲能動虞美人草以為此吳音也别製一闋與虞美人曲逈絶而草亦動恐或有之自晋宋以來食舉謂之四廂歌此鹿鳴所謂人之好我示我周行也古列位左右前後分置所謂輔拂疑丞是也自後謂之四廂食舉猶存其名後又謂之東西廂歌漸廢四廂之制而至今軍職猶存四廂之名然皆虗稱也大率古朝禮與軍禮相埒軍禮左右前後而尊者處中朝禮亦然今軍職則故軍儀亦故朝儀也其他未易可推惟食舉以鹿鳴之辭又以魏晋之號略見古燕饗之禮也周小雅鹿鳴一章呦呦鹿鳴食野之蘋當是園囿之間與臣之髙尊者燕樂即所見起興嘉賔非凡臣也我有嘉賔鼓瑟吹笙吹笙鼓簧承筐是將人之好我示我周行二章呦呦鹿鳴食野之蒿我有嘉賔德音孔昭視民不恌君子是則是效我有㫖酒嘉賔式燕以敖此章獨不及樂蓋與導言通情所謂德音也前後皆禮飲其中蓋從容酬酢欵曲凡庭樂作則人語當止人語交則庭樂當息三章呦呦鹿鳴食野之芩我有嘉賔鼓瑟鼓琴鼓瑟鼓琴和樂且湛我有㫖酒以燕樂嘉賔之心聞音曰行户郎切效古交切集韻效效效通作爻又爻子謂放效也作交兩音皆可用吳氏不必專用交大率吳氏多定從一讀去古既逺苟叶則皆可也湛持林切總聞曰鄭氏示作置蓋以卷耳置彼周行易之視古示字也古無示字示作永不從目者使人觀也從目者自我觀也皆有所示也賔之與我相好使列位觀之賔之德音甚眀使下民觀之皆民見而不敢為偷君子見而欲有所似也此臣必國之所推衆之所服故人君表出以風厲也少年試武昌遇鄉人竇姓忘名曰勉旃俟中選當歌鹿鳴送女趣使先歌即取簫吹之其聲舒緩全無髙急音呦呦作兩聲甚久下或一字或兩字或三字一轉未有四字者其人少知書喜音律遭亂從軍後莫知所在惜是時方十六嵗未知好古不究所以今併載于此四牡一章四牡騑騑周道倭遲豈不懷歸王事靡盬我心傷悲豈不懷歸詩多有此辭悲情之中有願意臣子之義兼全也二章四牡騑騑嘽嘽駱馬豈不懷歸王事靡盬不遑啓處不遑啓處詩亦多有此辭與豈不懷歸同情二句合在一章尤動人三章翩翩者隼載飛載下集于苞栩王事靡盬不遑將父四章翩翩者隼載飛載止集于苞杞王事靡盬不遑將母五章駕彼四駱載驟駸駸豈不懷歸是用作歌將母來諗聞音曰馬滿補切下後五切母滿罪切諗式荏切旁紐作氏任切叶駸聞物曰隼鳻鳩也南人呼為鳻隼行役當在春時總聞曰古者重于以身臣人身非我有也雖父母不得養之載驟駸駸亟欲畢王事也將母來諗以飬母告君欲休官歸家也父男子猶能自力母婦人必待人而後飬故人子尤所動心將父者一而將母者再也古風至西漢猶存官吏以府寺為舍十日一休沐以所居之官為家而其家即相判也不獨行役雖居官守亦與其家成踈故詩多有父子及夫婦相懷之辭皇皇者華一章皇皇者華于彼原隰侁侁征夫每懷靡及征夫皆有靡及之心則為使者惟恐不及可見上忠勤則下奮勵也二章我馬維駒六轡如濡載馳載驅周爰咨諏周遍也不必以為忠信左氏亦未嘗言忠信止曰必咨于周而毛氏以忠信為周杜氏從之其言訪問于善為咨咨親為詢咨禮為度咨事為諏咨難為謀臣獲五善敢不重拜不審左氏在何代是時已有此學至漢儒益盛左氏之文不及周以上裕而純過于秦以下肆而駮氣象皆古而有純駮也唯左氏似裕而有蹙迫之象似純而有雕鐫之迹非周以上之文也似肆而有謹嚴之法似駮而有娟美之風非秦以下之文也恐是生于戰國之時而不染戰國之習强為力以變俗者也左氏共知其非丘眀孔門弟子之文論亦不見因載于此故以天序為子夏孔門亦不如此殆西漢以下東漢以前其駮又甚也三章我馬維騏六轡如絲載馳載驅周爰咨謀四章我馬維駱六轡沃若載馳載驅周爰咨度五章我馬維駰六轡既均載馳載驅周爰咨詢聞音曰諏子須切絲新齎切謀謨柸切度待洛切聞事曰左氏金奏肆夏之三不拜工歌文王之三又不拜歌鹿鳴之三三拜鄭氏肆夏文王鹿鳴俱稱三謂其三章也以此知肆夏詩也引國語曰金奏肆夏樊遏渠所謂三夏也吕氏肆夏繁遏渠皆周頌也肄夏時邁也繁遏執競也渠思文也鄭氏以文王鹿鳴言之則九夏皆詩篇名頌之族類也杜氏二曰肄夏一名樊三曰昭夏一名遏四曰納夏一名渠下謂三夏天子所以享元侯也肆夏之三謂肆夏昭夏納夏良是不知繁遏渠云何王夏而不及蓋避之也杜氏又文王之三謂文王大眀綿良是鹿鳴之三謂鹿鳴四牡皇皇者華良是文王大雅之首鹿鳴小雅之首也舉其首以次至三也古者酒有三獻或五獻每一獻三樂此用三獻故用三樂凡九樂但序者不細察以鹿鳴為燕嘉賔以四牡為勞使臣以皇皇者華為遣使臣皆祖此而又失之文王既曰兩君相見之樂文王之序何不曰兩君相見也特燕禮之間舉其詩之輕重為其禮之隆殺非某詩必為某事也不獨此工歌而已他賦者亦然隨時取意隨意取詩以此知序者之過也總聞曰所謂大聲不入俚耳折楊皇華則嗑然而笑折楊逸詩皇華則此詩是也當是流傳里閭道路之間喜為咏歌亦可以推他詩凡風雅頌皆人間所常侑樂寫情如今大曲慢曲令曲及其他新聲異調者也頌特其體制差異則人間罕行亦有雖大樂而有别名吕氏所謂執競一日繁遏思文一名渠别名當是人間所可用者也常棣一章常棣之華鄂不韡韡不如本字鄂蒂也蒂無光采花有光采然蒂承花之光采皆從蒂而生花落則蒂結為子此花之本也凡今之人莫如兄弟當是春時見此花而感同氣也兄弟國家之本凡為上之光采因同氣而生因他氣而成也所謂莫如二章死喪之威兄弟孔懷原隰裒矣兄弟求矣天下莫可畏于死喪莫可愛于兄弟言畏愛之極如此原隰之間鳥獸之羣尚兄弟相求故不及脊令也三章脊令在原兄弟急難每有良朋况也永歎脊令首低尾昻首尾相應也亦當是有見興感兄弟急難相應當如此也四章兄弟鬩于墻外禦其務每有良朋蒸也無戎朋友常有相愛之意其善者不過長歎其氣盛者亦終不肯犯難施力也集韻戎通作爾雅相也博雅推也言無所施力也務戎不相叶因左氏以務為侮故說者競起左氏必以經改蓋附㑹綿禦侮為辭故劉氏從之又以戎為戍相叶吳氏以務戎皆改詩之所存蔑矣遂轉務音䝉集韻雺霧霿霜皆有䝉音此說最佳雖字無雨亦通用通呼然似不必詩之取叶至不一且以二章言之脊令在原兄弟急難每有良朋况也永歎四句三叶兄弟鬩于墻外禦其務就句取叶禦務是也蓋其歌曲必禦字務字兩斷每有良朋蒸也無戎朋作蓬音今北人多作此呼于歌曲雖不知其的于諷詠亦自有微音其他取叶隨詩可見今略載于此五章喪亂既平既安且寧雖有兄弟不如友生危急之時最倚兄弟為切安平之際乃資朋友為多何者彼各有門户親族難代其捐軀而救難也故以危難責朋友而以身許相知者皆非正也六章儐爾籩豆飲酒之飫兄弟既具和樂且孺孺屬也和樂之情則均而尊卑之屬則别也七章妻子好合如鼓瑟琴兄弟既翕和樂且湛妻子雖如琴瑟之協而兄弟亦如和樂之耽則家道全美也妻子協而兄弟暌豈得為樂也必兄弟無他而妻子乃合蓋妻子不患不協而易暌者兄弟也下文可見八章宜爾室家樂爾妻帑是究是圖亶其然乎凡人必思之深謀之盡乃見實理實理見則信心生也聞音曰弟待禮切懷胡隈切難泥㳂切嘆他涓切生桑狌狌亦作猩腥賈氏生生先醒也後生後醒也湛持林切末以乎叶孔氏說詩大體依韻亦有即將助語以當韻之體如此詩之類是也聞字曰集韻侮務通用傷也慢也左氏作侮可從然丁氏似附㑹務侮恐難通聞句曰或說常棣之華鄂止句言花鄂皆不韡韡也蓋以不爾為真爾亦有所疑王氏不韡韡言韡韡也故因疑而析句五字三字苟于古有疑而不敢强立說特就其中求合亦不害好古也總聞曰此詩未嘗有切責深恚之辭特以情以理感悟而已左氏周公弔二叔之不咸故封建親戚以蕃屏周召穆公思周德之不類故糾合宗族于成周而作詩毛氏槩言召公杜氏以為虎也其詩在厲王之時則詩未必皆作于成周之盛時也魚麗之序文武以天保以上治內采薇以下治外不無所礙故孔氏以序閔管蔡之失道故作常棣外傳周公之詩曰兄弟䦧于墻為周公作也陸氏鴟梟為詩常棣作詩變為言作者周公之于詩其道在鴟梟其事在常棣又略左氏召穆公直以為周公其欲附合于序如此今以鴟梟倣之其辭似非周公之作也而召穆公之作蓋亦未見杜氏厲王衰微兄弟道闕召穆公于東都收㑹宗族作此周公之樂歌厲而至宣宣而至幽幽而至平平王始遷東都豈有百餘年之前糾合宗族㑹聚東都召穆公賢者必不無君無國如此故凡左氏所載不敢不信而間亦有難信者也伐木一章伐木丁丁鳥鳴嚶嚶出自幽谷遷于喬木嚶其鳴矣求其友聲相彼鳥矣猶求友聲矧伊人矣不求友生出谷遷木毛氏以為君子雖遷髙位不可忘其朋友此意甚善鄭氏又求其尚在深谷者此意尤善用鳥意推人情古風可見神之聽之終和且平神且求聽以其和平亦有感動也二章伐木許許釃酒有藇既有肥羜以速諸父寧適不來微我弗顧於粲灑掃陳饋八簋既有肥牡以速諸舅寧適不來微我有咎不來者得非我弗相顧我且有咎何為不來責躬引愆必欲要致其來也三章伐木于阪釃酒有衍籩豆有踐兄弟無逺民之失德乾餱以愆民之失德則以乾餱吾儕雖小不滿意不必介念俗謂幸見恕且盡歡也有酒湑我無酒酤我坎坎鼓我蹲蹲舞我逮我暇矣飲此湑矣有酒則飲無酒則沽不可虗度也有鼓有舞隨所有取樂及我職事有暇共飲此酒乃所願也聞音曰丁陟耕切羜直吕切父扶雨切顧果五切掃蘇后切簋已有切舅巨九切咎巨九切阪孚臠切踐在演切愆起淺切酤侯古切暇後五切聞章曰舊六章今為三章皆以伐木為首辭聞物曰嚶音纓柔細也毛氏驚懼鄭氏相切直皆恐非大率鄭氏附合求友舊說嚶音鶯遂以為鶯相承出谷求友為鶯之事如此誤衍甚多聞事曰禮天子同姓謂之伯父異姓謂之伯舅毛氏因諸父諸舅之辭遂以為天子其初意甚正其後意稍違今定從初意聞人曰諸父父黨諸舅母黨兄弟亦母黨玩辭諦意皆異姓與常棣同姓不同也總聞曰鄭氏伐木謂昔日未居位在農之時與友生于山巗伐木為勤苦之事今有酒而釃之本其故也此意甚佳但不當以為王者識者更詳天保一章天保定爾亦孔之固人傳夭辭如皇矣帝謂也俾爾單厚何福不除俾爾多益以莫不庶二章天保定爾俾爾戬榖罄無不宜受天百祿降爾遐福惟日不足三章天保定爾以莫不興如山如阜如岡如陵如川之方至以莫不增四章吉蠲為饎是用孝享禴祠蒸嘗于公先王君曰卜爾萬夀無疆君先君也總言先世諸公諸王鄭氏嘏傳神辭上下稱人以先字貫于其中如小旻上下稱事以否字貫于其中語法正同神之弔矣詒爾多福民之質矣日用飲食羣黎百姓遍為爾德神他神也先世之神已竟則他位之神次至弔至也詒遺也當是祝傳神辭先世有尸他神無尸六章如月之恆如日之升如南山之夀不騫不崩如松柏之茂無不爾或承聞音曰除治慮切享虛良切福筆力切禮福者備也備旁紐作逼古文福字多叶直極等字至唐猶然古者不獨以福作逼字音亦以福作逼字用賈氏疏者或制大權以福天子顔氏福古逼字自後福作祜意不作逼意然逼音猶在也總聞曰此詩第一第二章𨗳天情至第三章天隱而不可慿則以物之大者喻之第四第五章導神情至第六章神亦慿而不可慿則又以物之極大者喻之前七爾後四爾皆天神下辭達其君也前五如後六如皆天神指物喻其君也大率皆藉天神為辭采薇一章采薇采薇薇亦作止當是將佐述離家還家之狀曰歸曰歸嵗亦莫止靡室靡家玁狁之故不遑啓居玁狁之故二章采薇采薇薇亦柔止曰歸曰歸心亦憂止憂心烈烈載飢載渴我戍未定靡使歸聘三章采薇采薇微亦剛止曰歸曰歸歲亦陽止王事靡盬不遑啓處憂心孔疚我行不來薇作春時薇柔夏時薇剛秋時冬不言者來歸也所以下言昔我往今我來之期適滿期年也四章彼爾惟何維常之華彼路斯何君子之車戎車既駕四牡業業豈敢定居一月三捷常即常棣也止是物記時如前章采薇非專喻將帥車馬服飾也詩屢稱常棣之華似皆有所興也大率詩人因物起興非接于所見興無由生此再指初發之時也秦子作人當如常棣灼然光發亦因詩人棣華為辭不必泥也當是周道春時多此物故引之一月三捷言屢勝也不必言一侵一伐一戰為三也五章駕彼四牡四牡騤騤君子所依小人所腓四牡翼翼象弭魚服豈不日戒玁狁孔棘以象牙飾弓袋以鯊皮飾矢服今軍中猶有此制六章昔我往矣楊栁依依今我來思雨雪霏霏行道遲遲載渴載飢我心傷悲莫知我哀既以薇茁薇稚薇壯計歲月又以棣華計時候末章眀言昔我往矣楊柳依依今我來思雨雪霏霏與前章皆相應指期甚眀也聞音曰作即各切亦總古切莫武博切亦莫故切皆通作總古莫故尤顯處臣列切疚訖力切來六直切華方無切服滿北切戒訖力切哀於希切聞事曰爾雅陽為十月郭氏純隂用事嫌于無陽故名此恐是十一月陽生之候初章言歲莫此是預言來歸之期後章亦然不應十月已歲莫今月令皆是周制其言嵗時早晚悉用夏正總聞曰禮師有功則愷樂獻于社其後號曰短簫鐃歌又其後號曰鼓吹亦謂之鐃歌鼓吹舊有艾如張逺如期之屬其後不可勝紀采薇出車六月吉日恐是此曲出車一章我出我車于彼牧矣自天子所謂我來矣召彼僕夫謂之載矣王事多難維其棘矣此行天子使之來也其詩皆以王命為辭此亦是將佐叙離家還家之狀與采薇同二章我出我車于彼郊矣設此旐矣建彼旄矣彼旟旐斯胡不斾斾憂心悄悄僕夫况瘁此二章于牧地調民卒也言旐言旟旟州里所建旐縣鄙所建止是集衆二章皆曰僕夫亦是偏禆之屬故使令稱僕夫也下章既言南仲遂稱旗旐旗諸侯所建其容乃盛非前章比也三章王命南仲往城于方出車彭彭旗旐央央天子命我城彼朔方赫赫南仲玁狁于襄南仲文王之屬也林氏南得氏宣王之時恐非此南氏之仲子與宣王之南仲同姓又同次也今同姓同次而不同時有之四章昔我往矣黍稷方華今我來思雨雪載塗王事多難不遑啓居豈不懷歸畏此簡書左氏翹翹車乘招我以弓豈不欲往畏我友朋杜氏逸詩句法與此相類極可玩味五章喓喓草蟲躍躍阜螽未見君子憂心忡忡既見君子我心則降赫赫南仲薄伐西戎君子謂南仲也當是將佐之在别部而來軍前者故有未見既見之辭六章春日遲遲卉木萋萋倉庚喈喈采蘩祁祁執訊獲醜薄言旋歸赫赫南仲玁狁于夷聞音曰牧莫狄切來六直切載節力切彭鋪郎切華方無切降乎攻切喈居奚切聞事曰此行在北無戰止是往戍故言城在西有戰故言伐言執言獲聞跡曰毛氏朔言北方也襄除也今定襄屬并州朔方亦屬并州朔方固是北方但襄除無謂總聞曰前四章自西都往北方也夏往而冬歸故曰昔我往矣黍稷方華今我來思雨雪載塗後二章自北方歸西都又往西方春至西都故曰喓喓草蟲躍躍阜螽未見君子憂心忡忡既見君子我心則降赫赫南仲薄伐西戎既見而又行也春歸西都故曰春日遲遲卉木萋萋倉庚喈喈采蘩祁祁執訊獲醜薄言旋歸赫赫南仲玁狁于夷其去來不逾春也一嵗所成併西北方之事結之枤杜一章有枤之杜有睆其實其去言枤杜與薇作同時此當是師徒之室家所叙與采薇出車同期而其人則異也王事靡盬繼嗣我日日月陽止女心傷止征夫遑止其歸亦與薇剛嵗陽同期二章有枤之杜其葉萋萋王事靡盬我心傷悲卉木萋止女心悲止征夫歸止前詩皆以深冬而歸此詩獨至次春而歸比同歸差後必有故也三章陟彼北山言采其杞王事靡盬憂我父母檀車幝幝四牡痯痯征夫不逺杞方茁而歸不逺與卉木之萋相應登北山采杞者征夫在北蓋有望且欲迎也四章匪載匪來憂心孔疚期逝不至而多為恤當是以病不載則不來故後期望夫固懷憂此又為多蓋比同歸後期爾五章卜筮偕止㑹言近止征夫邇止卜也筮也合以為近果近不踰春也古者人神相孚卜筮可信如此聞音曰母滿罪切幝尺善切痯古轉切來六直切疚訖力切偕舉里切近渠記切聞字曰繼嗣我日積日為月而至于陽此句法甚健總聞曰不必言同歌同時異歌異日且引易君子小人不同日尋詩無見大率行者居者各以情見辭非歌以遣行勞還勤歸也後用此不可知非以此詩為朝廷待軍旅之禮也南陔闕白華闕華黍闕魚麗一章魚麗于罶止鱨鯊君子有酒止㫖且多二章魚麗于罶止魴鱧君子有酒止多且㫖三章魚麗于罶止鰋鯉君子有酒止㫖且有四章物其多矣維其嘉矣物其㫖矣維其偕矣物其有矣惟其時矣聞音曰鯊蘇何切有羽軌切嘉居何切偕舉里切時上紙切聞章曰舊六章今為四章文勢恐然聞字曰麗著也讀如本字聞用曰後有魚麗陳前後左右中五陳每一陳具五陳大率敵人入者無不有所著今漁人置魚器大略如此相水道錯綜縱橫布之嘗使試之于地頗類陳形總聞曰陸氏鱨鯊之形長魴之形方鱧之形圓鰋之形偃鯉之形俯以著萬物盛多不必如此大率西北人重魚東南人重獸各以少為貴也由庚闕詩總聞卷九
