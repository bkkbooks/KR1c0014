body:
  text: 詩總聞卷十八宋王質撰蕩一章蕩蕩上帝下民之辟疾威上帝其命多辟訴上帝曰為邪者民也非我也又訴上帝曰使民為邪者帝也非我也此商王自解之辭端也天生蒸民其命匪諶靡不有初鮮克有終天生衆民其命誠難信初雖善終歸惡又自解之辭也二章文王曰咨咨女殷商曾是彊禦曽是掊克曽是在位曽是在服天降慆德女興是力文王嗟之曰彊禦掊克居爾之位仕爾之服天生此等倨慢之人汝不抑之使衰反長之使興其力也若是尚歸咎于天與民乎斥其自解之非也三章文王曰咨咨女殷商而秉義類彊禦多懟流言以對冦攘式內侯作侯祝靡屇靡究文王又嗟之曰秉義類者彊禦之徒則怨之採流言者冦攘之徒則親之以祝詛為常然無極無窮也尚歸咎于天與民乎亦斥其自解之非也四章文王曰咨咨女殷商女炮烋于中國斂怨以為德不明爾德時無背無側爾德不明以無陪無卿文王又嗟之曰以强梁斂怨而反為德所以不明其實有德者無在後在側之賢人也實有德所以不明者無為卿之賢者也是故以斂怨為德也尚歸咎于天與民乎亦斥其自解之非也五章文王曰咨咨女殷商天不湎爾以酒不義從式既愆爾止靡明靡晦式號式呼俾晝作夜文王又嗟之曰天未嘗令女沉酒汝以不義為法故以沉酒為當然也晦而飲明而止既過所止則以明為晦號呼亂神故晝夜易景也尚歸咎于天與人乎又斥其自解之非也六章文王曰咨咨女殷商如蜩如螳如沸如羮小大近喪人尚乎由行內奰于中國覃及鬼方文王又嗟之曰蜩螳時變則寂沸羮火緩則息汝去亡甚近而相化之人尚相從而行其不平之憤自中國達于逺夷犯衆怒之多也尚可歸咎于天與人乎又斥其自解之非也七章文王曰咨咨女殷商匪上帝不時殷不用舊雖無老成人尚有典刑曽是莫聽大命以傾文王又嗟之曰非天不與女以時不用舊而喜新故相導至此老成人已往而老成人之法尚存有及此者曽不見聽安得不傾尚歸咎于天與民乎又斥其自解之非也八章文王曰咨咨女殷商人亦有言顛沛之揭枝葉未有害本實先撥殷鑒不逺在夏后之世文王又嗟之曰木之將拔枝葉未凋本根先撥汝已往之鑒在夏世未來之鑒復在汝之世矣尚歸咎於天與民乎又斥其自解之非也示之往鑒幸其或改也聞音曰上辟舊必亦切君也下辟舊匹亦切邪也板上辟邪也下辟法也左氏引此詩杜氏亦然今皆訓邪皆從匹亦詩固有字同意異者此則字意相似不必分也終諸仍切服蒲北切祝周救切國越逼切側莊力切明謨郎切卿墟羊切式失吏切呼火故切夜羊茹切羮盧當切喪蘇郎切行户郎切時上紙切舊巨已切揭去例切撥方吠切聞跡曰楚俗多鬼髙宗伐鬼方即殷武荆楚此舉最險逺者言之聞人曰鄭氏老成人伊尹伊陟臣扈之屬書稱汝無侮老成人常談如此不必指名也總聞曰商王為人之詳見書甚明所謂乃罪多參在上乃能責命於天大率其人好責人而不責己好遂非而不悔過祖伊之語與此詩相符抑一章抑抑威儀維德之隅人亦有言靡哲不愚庶人之愚亦職維疾哲人之愚亦維斯戾以其威儀見其德哲人常事庶人之愚不能安於此意愚人常事然賢者之哲而乃愚亦有戾于此其時險惡可見古者被髮佯狂皆出此時吳皓齊洋之事可見二章無競維人四方其訓之有覺德行四國順之訏謨定命逺猶辰告敬慎威儀維民之則此哲人所欲告君者也所告者人也德行也大要以敬威儀為本三章其在于今興迷亂于政顛覆厥德荒湛于酒女雖湛樂止從弗念厥紹罔敷求先王克共明刑此哲人所欲戒君者也所戒者迷也顛覆也荒湛也大要以求先王共明刑為本四章肆皇天弗尚如彼泉流無淪胥以亡止夙興夜寐灑掃廷內維民之章止修爾車馬弓矢戎兵用戒戎作用逖蠻方此哲人所欲勸君者也所勸者灑掃廷內也修車馬弓矢也大要以勤夙夜為本五章質爾人民謹爾侯度用戒不虞慎爾出話敬爾威儀無不柔嘉白圭之玷尚可磨也斯言之玷不可為也此又哲人所欲勸君者也所勸者質人民也謹侯度也戒不虞也大要以謹言語敬威儀為本六章無易由言無曰苟矣莫捫朕舌言不可逝矣無言不讐無德不報惠于朋友庶民小子子孫繩繩萬民靡不承此又哲人所欲戒君者也所戒者勿易言語也大要以惠臣民為本七章視爾友君子輯柔爾顔不遐有愆相在爾室尚不愧于屋漏無曰不顯莫豫云覯神之格思不可度思矧可射思此又哲人所欲戒君者也所戒者勿近柔佞也大要以敬神明為本八章辟爾為德俾臧俾嘉淑慎爾止不愆于儀不僭不賊鮮不為則投我以桃報之以李彼童而角實虹小子此又哲人所欲戒君者也所戒者愆也僭也賊也大要以報善言逺頑童為本九章荏染柔木言緡之絲溫溫恭人維德之基其維哲人告之話言順德之行止其維愚人覆謂我僭民各有心哲人之話言皆如此當順而行之愚人反謂此言為僭哲愚各有心在所以察之也十章於乎小子未知臧否匪手攜之言示之事匪面命之言提其耳借曰未知亦既抱子王雖曰未知既已抱子蓋其君不為幼冲也民之靡盈誰夙知而莫成民之不滿者孰早有所知而暮有所成言雖知未能遽成也王若有所知漸進以圖功苟無所知雖欲冀成自不可得也大率欲王知哲愚之當從違也十一章昊天孔昭我生靡樂視爾夢夢我心慘慘見其君無所知則我心有所憂訴之於天不以有生為樂甚憂之辭也誨爾諄諄聽我藐藐匪用為教覆用為虐借曰未知亦聿既耄不采我意固未問反以教為虐王心昏塞顛倒如此以為未知必待既耄言此時當有所知又何待也十二章於乎小子告爾舊止聽用我謀庶無大悔天方艱難曰喪厥國取譬不逺昊天不忒回遹其德俾民大棘告爾不為不久若能聽用則庶幾無悔不然則雖悔無及也故又盡言之今天困我以艱難將速我以喪亡我所取譬不逺維德之隅一喻也如彼泉流二喻也白圭之玷三喻也投我以桃報之以李四喻也荏染柔木言緡之絲五喻也所喻如此訴之于天切不可差忒也爾或回遹民大困急則喪亡不可救也聞音曰疾集二切告古得切政諸成切叶今女雖湛樂為句從勿念厥紹為句樂魚教切叶紹刑寒剛切叶王大率陽庚兩音多通用兵補芒切虞元具切儀牛何切嘉居何切為吾何切言旁紐作蘖苟旁紐作格集韻舌逝皆食列切四字無不叶也以矣相叶亦可然吳氏以為未詳非也讐市又切報敷救切友羽軌切子奬禮切格綱鶴切度待洛切射弋灼切嘉居何切義吾何切絲新齎切言魚巾切今西人猶作此音否補美切事上止切昭之笑切樂魚教切慘七到切藐眉教切虐宜照切國越逼切總聞曰其初歷舉哲人之話言自於乎小子而下則已之語也哲人畏禍茹言而不吐我畏義盡情而不匿當是彼疏此親彼當用邦無道則愚之法此當用同姓之卿之法不特分親亦當屬尊尋詩可見厲王在位四十七年在彘十五年計六十二年方嗣位必少年此稱小子殆是桑柔一章菀彼桑柔其下侯旬捋采其劉瘼此下民桑柔初茁而未盛也止可維旬過旬則捋採稀踈言不久也言民甚病不可以支嵗月也不殄心憂倉兄填兮倬彼昊天寧不我矜訴之于天也大率人情無所泄則訴之于天似怨天非怨天也聲怨于天歸怨于人故天者萬物輸情之所也二章四牡騤騤旟旐有翩亂生不夷止靡國不泯民靡有黎止具禍以燼於乎有哀國步斯頻世治見旟旐以為喜世亂見車旌以為哀此總言亂之狀也三章國步蔑資天不我將靡所止疑止云徂何往君子實維止秉心無競誰生厲階至今為梗當位者不以正固爭而以默為事此厲階所以至今為梗也此總言禍之端也四章憂心殷殷念我土宇我生不辰逢天僤怒自西徂東靡所定處多我覯痻孔棘我圉此總言已奔走困急之狀也五章為謀為毖亂况斯削告爾憂恤誨爾序爵誰能執熱逝不以濯其何能淑載胥及溺濯所以救熱用之不善則反以及溺我告我誨爾當善用之六章如彼遡風亦孔之僾民有肅心荓云不逮好是稼穡力民代食稼穡維寶代食維好此條舉之事也力民所以作稼穡反不得食而有代食者是力民藝之而他人食之也如是代食者坐享所奉豈不自以為嘉則代食為民之病一也七章天降喪亂滅我立王降此蟊賊稼穡卒癢哀恫中國具贅卒荒靡有旅力以念穹蒼此條舉之事也不幸降蟊賊以病稼穡身有所屬力無所施故田卒至于荒則力役為之病二也大率禍亂之源皆生於農事之廢八章維此惠君民人所瞻秉心宣猶考慎其相維彼不順自獨俾臧自有肺腸俾民卒狂瞻彼中林甡甡其鹿朋友已譖不胥以榖人亦有言進退維谷此以下多稱維此維彼維此者欲其為此也維彼者欲其不為彼也此秉心宣猷則考其質者彼自有肺腸則使其狂者惟其自有肺腸所以交相譖而不相善也九章維此聖人瞻言百里維彼愚人覆狂以喜匪言不能胡斯畏忌此所見者逺所言者逺彼或覆或狂喜覆狂則不喜逺者也賢者豈不能分别此為覆此為狂何用犯此畏忌以詒我危辱也言時不可正言也十章維此良人弗求弗迪維彼忍心是顧是復民之貪亂寧為荼毒大風有隧有空大谷此懷良心者既不求亦不進彼懷忍心者既加顧又加復既愛忍心則必不愛良心者也故貪亂者安為荼毒而無復惻怛也凡當荼毒者皆當大風之衝大空之谷可見人之危恐也十一章維此良人作為式穀維彼不順征以中垢大風有隧貪人敗類聽言則對誦言如醉匪用其良覆俾我悖此懷良心者則所為皆善彼懷不順之心者則所行皆汚凡遇貪濁者皆當大風之衝安得不傷敗也相聽從之言則對可諷誦之言則醉不用其良而反使為悖者故良人衰而不順之人盛也十二章嗟爾朋友豫豈不知而作如彼飛蟲時亦弋獲既之隂女反豫來赫民之罔極職凉善背為民不利如云不克朋友疑其在朝廷無所别白故曉之曰我豈不知而無所為如蟲之飛可弋而獲蓋小人隂于女而陽於我而任事之人主薄而不主厚喜背而不喜面既能為不利則或恐不勝故不如且已也曉之辭也十三章民之回遹職競用力止民之未戾職盜為冦凉曰不可止覆背善詈雖曰匪豫既作爾歌民之所以多端皆在職者主競故競者用力也民之所以未定皆在職者主盜故盜者為冦也薄言不可則已反于背肆詈女雖自以非我欲推怨他人然已為爾作歌烏能掩其惡而文其姦也言歌可諷而人喜傳也聞音曰填池鄰切天鐵因切燼旁紐作辛叶頻溺奴學切瞻職良切相思將切迪徒沃切垢居六切悖蒲昧切獲黃郭切赫黑各切背必墨切民之未戾止不可覆背善詈終爾歌可歌相叶吳氏不得謂之未詳也集韻可歌皆居何切聞物曰甡甡鹿精采貌鹿在林而人遇谷言鹿之不如也聞人曰序以為芮伯毛氏以為芮良夫蓋承左氏其言既明當從所譏詆之小人當是榮夷公之徒也聞跡曰作此詩者當是或行或居山野之中其首言桑其次言水其次言草其次言蟊其次言禾其次言林其次言鹿其次言谷凡再其次言風隧亦再其次言弋蟲良夫或以正言不容退處未可知也聞事曰風起則塵埃肆揚人物不見今西北多然逆風而行尤不可故曰維彼遡風亦孔之僾僾與愛同風衝則草木頽偃隧道即成今西北猶然大率多在山蹊之間故曰大風有隧有空大谷谷讀作浴民敬事稼穡肅敬也從事草間荓草也反以為緩嫚是欲奪民力以與代食者也皆代食之人蔽上如此樊氏詆王氏是謂我耕稼而汝食之相傳不平之語史書文言爾總聞曰君子小人不可雜處雜處則小人必勝君子必負此詩反覆委曲如此然所謂維此者實何所設施維彼者實何所懲艾以當時之治亂興亡可見雲漢一章倬彼雲漢昭回于天與有嘒其星同意言無雨狀也王曰於乎何辜今之人天降喪亂飢饉薦臻靡神不舉靡愛斯牲圭璧既卒寧莫我聽何辜今之人一句辭端已切當二章旱既大甚藴隆蟲蟲不殄禋祀自郊徂宫上下奠瘞靡神不宗后稷不克上帝不臨耗斁下土寧丁我躬寧丁我躬一句語意又切當告困于后稷又告困于上帝三章旱既大甚則不可推兢競業業如霆如雷周餘黎民靡有孑遺昊天上帝則不我遺胡不相畏先祖于摧告困於昊天上帝又告困于先祖四章旱既大甚則不可沮赫赫炎炎云我無所大命近止靡瞻靡顧羣公先正則不我助父母先祖胡寧忍豫告困于羣公先正又告困於父母先祖五章旱既大甚滌滌山川旱魃為虐如惔如焚我心憚暑憂心如熏羣公先正則不我聞昊天上帝寧俾我遁又告困于羣公先正又告困於昊天上帝寧俾我遁欲棄天下而逃困之極也六章旱既大甚黽勉畏去胡寧癲我以旱憯不知其故祈年孔夙方社不莫昊天上帝則不我虞敬恭明神宜無悔怒又告困於昊天上帝又告困於明神憯不知其故此災衆知其自厲王而稱不知其故者為父諱也七章旱既大甚散無友紀鞫哉庶正疚哉冢宰趣馬師氏膳夫左右靡人不周無不能止瞻卬昊天云如何里告困於庶正羣臣又告困于昊天八章瞻卬昊天有嘒其星大夫君子昭假無贏大命近止無棄爾成何求為我以戾庶正瞻卬昊天曷惠其寧又告困於昊天又告困于大夫君子庶正何求為我言何必求我我將遁也羣公三公也先正羣公之先正也已往者也書言先正保衡孔氏正長也庶正見存者也如天官宫正地官黨正之屬統言之也冡宰言其長也天官膳夫地官師氏言其屬也左右統言之數官言皆近王也靡人不周天官酒人之屬地官封人之屬無人不及也大夫中大夫下大夫之屬是也君子統言之數官皆美稱也言官僚錯綜參差又非可以十月之交為例也宣王求天求帝求神求先祖求父母而又求于臣言我雖棄位臣則受戾故未忍去而苦兾寧也聞音曰天鐵因切臨力中切皇矣臨衝韓氏作隆衝臨當讀作隆推吐雷切遺夷佳切顧果五切助牀所切豫演女切川樞倫切遁徒勻切莫幕故切虞元具切宰奬禮切今南人以宰為子奬禮切又為宰亦奬禮切子宰皆奬皆通右羽軌切正諸盈切云如何里將如之何言計窮也里辭也今北人猶有此音聞人曰序以為仍叔美宣王也尋詩皆王辭是時喪亂方繁不見天下喜王化復行王自憂不見百姓見憂他稱召康公召穆公凡伯衛武公芮伯惟芮伯粗可考然皆美諷譏切以為他人所作猶之可也至仍叔决非叔辭按經世宣王癸酉即位大甚之旱必其初基之時魯桓五年天王使仍叔之子來聘左氏仍叔之子弱也杜氏譏使童子出聘故本父字自宣王初年至是得一百二十三年而其子尚幼當亦未及弱冠也如此方仍叔能為文美君之時官為大夫則非幼稚者也大約以其年度之一百四五十嵗而百餘年生子亦似非人情識者更詳總聞曰兩言大命近止言將亡也非是哀辭實有是理不諱此字然後可以感動人也嵩髙一章嵩髙維嶽峻極于天維嶽降神生甫及申維申及甫維周之翰四國于蕃四方于宣申申伯也甫仲山甫也鄭氏以甫為訓夏贖刑之甫侯相去近二百年所不可曉二章亹亹申伯王纘之事于邑于謝南國是式王命召伯定申伯之宅登是南邦世執其功三章王命申伯式是南邦因是謝人以作爾庸王命召伯徹申伯土田王命傅御遷其私人四章申伯之功召伯是營有俶其城寢廟既成既成藐藐王錫申伯四牡蹻蹻鉤膺濯濯五章王遣申伯路車乘馬我圖爾居莫如南土錫爾介圭以作爾寶往近王舅南土是保至是遣行也王舅非獨申伯一人故曰往近王舅當是諸舅先有在謝者今與相近時申伯在諸舅之中最尊故曰王之元舅也六章申伯信邁王餞于郿申伯還南謝于誠歸王命召伯徹申伯土疆以峙其糧式遄其行至是餞行也以謝為國故自西而南稱還歸七章申伯番番既入于謝徒御嘽嘽周邦咸喜戎有良翰不顯申伯王之元舅文武是憲至是始至國也申伯皆稱王命王錫王遣王餞皆慿宣王之威靈而已則缺然故稱不顯此周邦所以咸喜也若申伯以屬行之尊委寄之重夸耀矜驕以自為顯人情方且不平何由皆喜也八章申伯之德柔惠且直揉此萬邦聞于四國吉甫作誦其詩孔碩其風肆好以贈申伯聞音曰天鐵因切翰胡干切蕃多邅切式失吏切伯逋莫切邦卜工切田地因切馬滿補切寶博抱切行户郎切番芬邅切翰胡干切憲虛言切國越逼切碩常約切伯逋莫切聞跡曰謝在汝南謝城後以封為氏郿在長安郿縣音眉恐當與歸相叶音眉總聞曰古有五嶽爾雅河南華河西泰河東岱河北恆江南衡又太山為東嶽華山為西嶽霍山為南嶽恆山為北嶽嵩山為中嶽書四嶽謂東西南北也在中帝者之鎮域故不使臣掌之毛氏徒知爾雅山大而髙曰嵩而不考嵩髙為中嶽二說皆爾雅也何獨舍一而取一當是欲附合四嶽之義故遺一嶽而不知闕中中者五數也又當是以嵩髙字而不知通用也于是以堯時姜氏掌四嶽于周則有甫有申有齊有許也又以嶽降神靈和氣以生申甫之大功止須後說不須前說申甫皆當是此境所生故申伯封謝山甫封樊嵩髙為大室屬豫州蒸民一章天生蒸民有物有則民之秉彛好是懿德民之秉彛好德蓋其常稟然天有特為時而生者則與常稟不同所謂出乎其類拔乎其萃者也天監有周昭假于下保兹天子生仲山甫二章仲山甫之德柔嘉維則令儀令色小心翼翼古訓是式威儀是力天子是若明命使賦三章王命仲山甫式是百辟纘戎祖考王躬是保出納王命王之喉舌賦政于外四方爰發四章肅肅王命仲山甫將之邦國若否仲山甫明之既明且哲以保其身夙夜匪解以事一人五章人亦有言柔則茹之剛則吐之維仲山甫柔亦不茹剛亦不吐不侮矜寡不畏彊禦六章人亦有言德輶如毛民鮮克舉之我儀圖之維仲山甫舉之愛莫助之衮職有闕維仲山甫補之七章仲山甫出祖四牡業業征夫捷捷每懷靡及四牡彭彭八鸞鏘鏘王命仲山甫城彼東方八章四牡騤騤八鸞喈喈仲山甫徂齊式遄其歸吉甫作誦穆如清風仲山甫永懷以慰其心至是方徂齊也當是東方有大變故山甫自上卿出將命恐是厲公胡公子之亂聞音曰下後五切明謨郎切寡果五切圖動五切及極業切彭鋪郎切喈居奚切風孚愔切蔡氏君子博文貽我德音辭之集矣穆如清風正用此詩惟若賦難叶蓋在下字字上作叶也是使相叶讀至是使少止若使作餘聲可也古文難執定律當通方也聞訓曰詩言東又言齊其為東齊必然爾雅以為齊疾也郭氏引仲山甫徂齊實之此書蓋句疑也而釋者亦未必其人其人蓋亦博逹者也識者更詳總聞曰齊亂在宣王即位之三年立公子赤誅殺厲公者恐是山甫所畫按司馬氏胡公自營邱徙薄姑獻公自薄姑徙臨菑經世蓋在厲王丁未至宣王初立得二十七年而毛氏以為古者諸侯之居逼隘則王者遷其邑而定其居蓋去薄姑而遷臨菑也不應以二十三年之前兩世之後而始與之定居則徂之者其為定無忌胡赤之亂審也韓奕一章奕奕梁山維禹甸之有倬其道止韓侯受命王親命之纘戎祖考止無廢朕命夙夜匪解䖍共爾位止朕命不易幹不庭方以佐戎辟自纘戎祖考至以佐戎辟當是冊命之辭如平王冊晉文王顯文武克慎明德昭升于上敷聞在下下叶武如威王冊晉文敬服王命以綏四國糾逖王慝慝叶國靈王冊齊莊世祚大師以表東海王室之不壞繄伯舅是賴又纂我祖考無忝乃舊亦多韻語不然則是增損其文入詩大率古文多韻語非有意作為天機所動語音自律也二章四牡奕奕孔修且張韓侯入覲以其介圭入覲于王止王錫韓侯淑旗綏章簟茀錯衡止𤣥衮赤舄鉤膺鏤鍚鞹鞃淺幭鞗革金厄此自韓城覲京都也三章韓侯出祖出宿于屠顯父餞之清酒百壺其殽維何炮鱉鮮魚其蓛維何維筍及蒲其贈維何乘馬路車籩豆有且侯氏燕胥此自京師歸韓國也屠當作杜謂杜郵也古屠杜通用左傳晉大夫屠蒯禮記作杜簣胥恐亦是地名當是揟次也揟次與休屠相近屠胥恐是此識者更詳古今遼邈無由可見其的但以所載稍可附近者又以人情事理推之庶乎其可也顯夫周大夫侯氏三水姓四章韓侯取妻汾王之甥蹶父之子韓侯迎止于蹶之里止百兩彭彭八鸞鏘鏘不顯其光止諸娣從之祁祁如雲韓侯顧之爛其盈門鄭氏汾王謂厲王也厲王流于彘彘在汾水之旁故時人因以號之猶莒郊公黎北公此亦善推古也五章蹶父孔武靡國不到為韓姞相攸莫如韓樂止孔樂韓土川澤訏訏魴鱮甫甫麀鹿噳噳有熊有羆有貓有虎慶既令居韓姞燕譽蹶父姓姞母姓當是蹶氏取南燕姞氏有此女女或隨母姓故蹶獨稱父也南燕在滑州燕譽言母黨亦喜而譽之也毛氏以燕作安殆未嘗細考也六章溥彼韓城燕師所完韓城在周畿當是昔調侯國中有燕人今又燕甥來為國母皆韓人喜之辭也以先祖受命因時百蠻韓之先祖或曰周成王之子封韓或曰周武王之子封韓後避難為寒氏據諸家舊說多言武王之子所謂先祖即始受封者也不知主名其後易韓為寒亦有此理晉封武子于韓原當是再續王錫韓侯其追其貊奄受北國因以其伯實墉實壑實畝實籍獻其貔皮赤豹黃羆當時周疆多雜夷種追貊當是韓城以北相附近者也氐羌亦當是韓城以西相附近者也韓侯特受命統在北者耳尋詩當是其祖所隸聞音曰解古義切易夷益切辟必歷切衡户郎切幭莫歷切厄於栗切彭鋪郎切樂魚教切藉籥切聞事曰出祖者二仲山甫出而如祖之儀上云纘戎祖考是也韓侯出而如祖之儀下云以先祖受命是也陳氏此說亦新然不必如此過用意也左氏昭公適楚夢襄公祖襄公適椘夢周公祖杜氏祖祭道神也毛氏軷道祭也用此為妥聞跡曰韓城在同知梁山在韓城縣孟子所謂去邠踰梁山邑于岐山之下居焉總聞曰雅之餞有二王餞于郿王親餞也顯父餞之卿往餞也此詩之餞有二顯父之餞在屠者也侯氏之燕在胥者也其禮則殺其餼則隆此足見宣王待申伯韓侯有差江漢一章江漢浮浮武夫滔滔陳氏江漢常武同為宣王淮夷之詩江漢之滸王命召虎是淮南之夷率彼淮浦省此徐土是淮北之夷亦善推古者也匪安匪遊淮夷來求既出我車既設我旟匪安匪舒淮夷來鋪二章江漢湯湯武夫洸洸經營四方告成于王四方既平王國庶定時靡有爭王心載寧三章江漢之滸王命召虎式辟四方徹我疆土匪疚匪棘王國來極于疆于理至于南海至七閩百粵則自淮以南之夷此說為的也四章王命召虎來旬來宣文武受命召公維翰無曰豫小子召公是似肇敏戎公用錫爾祉周冊命臣下各有所無定處伯姬鼎王在周康穆宫寰入門立中庭北卿史恭受王命書王呼史滅冊錫寰此當是在周文武宫也旬當是史名宣當是命書也五章釐爾圭瓉秬鬯一卣告于文人此文人召虎先世也古彛器多稱文考宰辟父敦用對揚王休命用作文考寶敦敦對揚王休用作朕文考寶敦師設敦對揚皇后休用作朕文考乙仲寶敦大夫始鼎對揚天子休用作文考日已寶鼎古者美稱莫如文故君子以稱臣之先臣亦以自稱其先亦有稱皇考者􅌏敦敢對揚天子休命􅌏用作朕皇考龔伯尊敦亦有稱皇文考者牧敦敢對揚王丕顯休用作朕皇文考益伯寶尊敦大率稱文考為多古者錫有功則必有彛器以紀其事以告于家廟敦鼎食器宰辟父敦之類是也卣飲器此秬鬯一卣是也書文侯之命女肇刑文武用㑹紹乃辟追孝于前文人與此詩相符其先稱文武則所謂文武受命是也次自稱則所謂無曰豫小子是也不以為我君不足紹文武而但盡爾力以似召公也次稱其先則所謂告于文人是也書先稱汝克昭乃顯祖孔氏唐叔也次追孝于前文人孔氏繼先祖之志為孝則謂唐叔也此文人當是召祖也錫山土田于周受命自召祖命于周受命文武周之始祖當是于文武之廟受命也爾祖當是入命于文武耳此時亦宜受命于文武蓋文武既有賢臣又有賢孫皆文武所肇非我敢私也六章虎拜稽首天子萬年虎拜稽首止對揚王休作召公考天子萬壽止明明天子令聞不已矢其文德洽此四國召公答冊命之辭不稱文武者已拜命于文武之廟此則拜恩于宣王之庭略見古者冊命功臣之制聞音曰滔他侯切湯普羊切定唐丁切海虎猥切翰胡干切似養里切命彌并切考去久切壽殖酉切國越逼切聞訓曰肇始也戎大也自此始敏以大召公之烈言自召公之後初有虎也聞人曰作召公考召公康公也召虎祖也考召虎父也王命多及召祖故兼祖考答之古者臣謝君之賜其器多然宰辟父敦對揚王休命用作文考寶敦敦對揚王休用作朕文考寶敦此必有器上所謂卣者殆是又知對揚王休者對揚王之休而已承之也下作召公考王命使作之也古亦有兼祖考而作器􅺦敦作皇祖益公文公武伯皇考龔伯鼎彛厲鼎用作皇考文考孟鼎此兼祖考而言之者也總聞曰後二章一則宣王冊命及俾作彛器大略之辭二則召虎答冊命及所作彛器大略之辭亦當是採當時冊命實語又採當時彛器實語合而成此詩韓侯止有冊命比此差略常武一章赫赫明明王命卿士南仲大祖大師皇父此詩無此字義所命之卿士南仲為大祖官為大師字為皇父當是自南仲以來纍世著武故曰常武或曰古者有功則書之大常舉南仲載在大常之武功以命其孫故曰赫赫明明日月至周始自衮升常此義差長整我六師以修我戎止既敬既戒惠此南國二章王謂尹氏命程伯休父左右陳行戒我師旅姓則程爵則伯字則休父當是副皇父者尹氏掌命之官疑是史也厖敦王呼史犬冊命尨牧敦王呼內史吳冊命牧古冊命臣下多史掌之此初曰王命卿士次曰王謂尹氏疑先所稱王命者即尹氏也古文語法如此史尹氏命二人而于後結之率彼淮浦省此徐土不留不處三事就緒三章赫赫業業有嚴天子王舒保作匪紹匪逰徐方驛騷震驚徐方如雷如霆徐方震驚四章王奮厥武如震如怒進厥虎臣闞如虓虎鋪敦淮濆仍執醜虜截彼淮浦王師之所五章王旅嘽嘽如飛如翰如江如漢如山之苞如川之流綿綿翼翼不測不克濯征徐國六章王猶允塞徐方既來徐方既同天子之功四方既平徐方來庭徐方不回王曰還歸聞音曰士公土切父扶雨切戒訖力切國越逼切緒象吕切業宜腳切騷蘇侯切怒暖五切苞逋甌切國越逼切來六直切聞字曰戎吳作戍常棣蒸也無戎亦作戍然常棣不必此為戍可用聞事曰其初王舒不甚怒也止欲保安其作業而已其次王奮乃甚怒也王怒故將亦怒所以虓虎執虜當是不可招來不受慰撫故至於殺伐向使如淮夷即來求來鋪則無事此也大率淮南之夷弱淮北之夷强總聞曰江漢常武均為淮夷之詩然江漢差易常武若用力過多設辭過周舊說預告徐土之民不久處于是汝三農之事皆就其業為其驚怖先以言安之又我非解緩非遨遊徐國傳遽之驛見之知王兵必克馳走以相恐動雖未必全然亦有是理當是皇父德望信譽不及召虎故徐方驚逸擾動易克而難安其末寵勞之禮逺不及召虎亦其人其功自有差降瞻卬一章瞻卬昊天則不我惠孔填不寧降此大厲止邦靡有定士民其瘵蟊賊蟊疾靡有夷屇止罪罟不收靡有夷瘳蟊賊蟊疾貪者也罪罟虐者也二者士民所以皆病也二章人有土田女反有之人有民人女覆奪之此宜無罪女反收之彼宜有罪女覆說之三章哲夫成城哲婦傾城止懿厥哲婦為梟為鴟婦有長舌維厲之階止亂匪降自天生自婦人止匪教匪誨時維婦寺此推言蟊賊罪罟所由起自婦人寺人也故曰時維婦寺四章鞫人忮忒譖始竟背豈曰不極伊胡為慝如賈三倍君子是識婦無公事休其蠶織此又推言婦寺所由昌自君子也故曰如賈三倍君子是識大率商賈者一賣一買一識謂牙儈也此所謂三倍當時在重位而稱君子者乃商賈之牙儈也賤之辭也五章天何以刺何神不富舍爾介狄維豫胥忌天何以災異而責王神何不以富盛而厚王則天神之意可知何不念爾之害介謂一害也夷狄二害也此則不問而惟我相忌其為害者不在我而在彼也怨之辭也不弔不祥威儀不類人之云亡邦國殄瘁災則不弔不畏天者也威儀則不善不愧人者也有賢人相助猶或庶幾人云亡則必殄瘁矣亦怨之辭也六章天之降罔維其優矣人之云亡心之憂矣天之降罔維其幾矣人之云亡心之悲矣天之降罔甚寬未必能觸惟人云亡則可憂賢人去則天罔逼矣此不恨王之不弔不類而痛人之云亡也憂之辭也七章觱沸檻泉維其深矣心之憂矣寧自今矣止不自我先不自我後藐藐昊天泉久則愈深心久則愈憂此時不在我先不在我後適然當此豈非天乎傷之辭也無不克鞏無忝皇祖式救爾後苟能盡固其民不忝于祖尚可救其後所謂往者不可諫來者猶可追此又愛之辭也聞音曰說王氏引此詩作脫叶奪如此則收旁紐作受叶有兩上叶兩下叶皆隔句叶也階居奚切天鐵因切寺祥吏切背必墨切富方未切天如本音叶先祖後多以為不叶大率武部有兩聲通用藪隴主切亦蘇后切斗腫庾切亦當口切婺部有兩聲亦通用注抹遇切亦丁侯切逗厨遇切亦他侯切不可悉數則後亦可叶祖籠五切總聞曰一顧傾人城再顧傾人國非不知傾城與傾國佳人難再得此語所從來已久也聰明才略之君不以再傾為懼而以再得為難所謂懿厥哲婦也召旻一章旻天疾威天篤降喪癲我饑饉民卒流亡我居圉卒荒當是既有小旻大旻故以召加旻末章有召公也二章天降罪罟蟊賊內訌昏椓靡共潰潰回遹實靖夷我邦我居圉卒荒言凋殘也實靖夷我邦言寂寞也以靖夷為佳語則非三章臯臯訿訿曾不知其玷臯臯大言也訿訿小語也不自知其為玷惡小人之辭也兢兢業業孔填不寧我位孔貶人心危則君位危憂君之辭也四章如彼嵗旱草不潰茂如彼棲苴我相此邦無不潰止苴當作苡車前草也遇旱而草亦如此禾其可知草亂茂原野之中多然今不散則不茂言凋瘁也且指一物言之如車前最耐旱亦棲止不橫逸他草可知我觀此邦反無不散者草當亂而不亂人不當亂而反亂物反性則無生意五章維昔之富不如時維今之疚不如兹彼疏斯稗胡不自替職兄斯引昔之富多君子不如今之富多小人也昔之病少君子不如今之病少小人也言相反也彼時以為菜此時以為米以菜為米可見君子之窮病也我不退而自默而尚為位之長此事甚大言可慮也此章言胡不自替職兄斯引下章言職兄斯𢎞不烖我躬語參差則文遒健六章池之竭矣不云自頻泉之竭矣不云自中溥斯害矣職兄斯𢎞不烖我躬池竭不肯言自頻諱無外注之水也泉竭不肯言自中諱無內發之水也言外之善言不來內之善言亦不來彼既諱言人皆以何不勿言相戒我猶居位之長此事甚大又言可慮也此在髙位任重事而無可奈何徒懷深憂慮後患也七章昔先王受命有如召公日辟國百里今也日蹙國百里於乎哀哉維今之人不尚有舊維今之人豈不有似舊者言亦有召公之流但無先王耳所謂天生堯舜禹稷自至者也聞音曰喪蘇郎切訌户工切共居容切邦剝工切兹津之切中諸仍切害何葛切躬姑𢎞切舊巨已切上以二里相叶聞字曰替亦作㬱當作㬱以似而轉側吟切止語之聲也呼音合引當作𢎞亦以似而轉胡肱切㬱𢎞相叶兩章皆稱職兄斯𢎞作引無謂總聞曰古稱昏亂之時如幽如厲蓋無以加也然觀發為篇章抒為歌咏有不諱之朝所難言者至唐猶有此風白居易元稹反以此得名而時君世貴未有逞憾者也至其亡也鄭綮猶以此結驟知躐大位古風雖替而未盡絶也自後有造詩獄有興史禁有嚴著書之科有峻尺牘之律讀詩可興嘆也詩總聞卷十八
