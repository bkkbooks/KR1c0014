body:
  text: 詩總聞卷二上宋王質撰風聞風一風樂歌名也禮寛而静柔而正者宜歌頌廣大而静疏達而信者宜歌大雅恭儉而好禮者宜歌小雅正直而静亷而謙者宜歌風言風不及南當是風也南也其聲同律故舜樂先南次風同被之于琴其聲無爽也季子獨稱南不稱風凡及風者止稱國至雅則稱雅頌則稱頌惟衛齊因辭及風亦非指名稱風葢南風同類舉南則風在中也雅亦有風頌亦有風故豳詩有豳雅豳頌嵩髙其風肆好烝民穆如清風禮商者五帝之遺聲也商人識之故謂之商齊者三代之遺聲也齊人識之故謂之齊頌風亦並言明南風雅頌其聲皆相適也禮風賦比興雅頌六詩當是賦比興三詩皆亡風雅頌三詩獨存風南一也徃徃南聲簡于風聲故存者南少而風多也聞風二列國立説甚多然不必也今詩魏在齊下而季有大小前人未之及者何也欽定四庫全書詩總聞卷二宋王質撰邶風柏舟一章汎彼柏舟亦汎其流耿耿不寐如有隠憂微我無酒以遨以遊此當有難言者也言隱憂言静思下章不愬他人而愬同姓蓋有不可顯言者也二章我心匪鑒不可以茹鑒當作藍實可菹與下匪石匪席同意亦有兄弟不可以據薄言徃愬逢彼之怒三章我心匪石不可轉也我心匪席不可卷也威儀棣棣不可選也言我趨美如此屈氏紛吾旣有此内美兮又重之以脩能在位皆同類威儀如此不可擇而告之也四章憂心悄悄溫于羣小覯閔既多受侮不少静言思之寤辟有摽辟開也摽拊也開其襟而拊心也今人憤悶者猶然五章日居月諸胡迭而微心之憂矣如匪澣衣靜言思之不能奮飛日月愈乆愈微所謂但見有不如也聞音曰轉陟兖切卷眷勉切聞訓曰左氏懼選杜氏數也言多威儀不可勝數也總聞曰不遇非所當憂葢憂時也古列國通疆皆可之然有所不忍與何必懐此都異意此人葢愛君親上者也緑衣一章綠兮衣兮錄衣黄裏心之憂矣曷維其已二章綠兮衣兮綠衣黄裳心之憂矣曷維其亡三章緑兮絲兮女所治兮我思古人俾無訧兮四章絺兮綌兮凄其以風我思古人實獲我心言衣服漸闕恩愛弛也一章緑衣黄裹二章緑衣黄裳已非備禮之正服三章但有緑絲而不能成衣裳也四章以夏服禦秋冬之風併與緑絲亦無可見恩愛盡替也其初已度他時之有增故末云實獲我心言與所期相應也聞音曰治澄之切訧于其切風孚愔切許氏風以凡得聲古凡汾林切自昔用風皆叶與汾林之屬相叶總聞曰其為婦人哀怨之辭無疑但其人未可知舊説以為莊姜雖不敢不信然尋詩未有所見此婦人必有識慮知古今多稱古人者言古有此今當之也班氏緑衣兮白華自古兮有之燕燕一章燕燕于飛差池其羽二月中為乙鳥至當是國君送女弟適他國在此時也之子于歸逺送于野瞻望弗及泣涕如雨二章燕燕于飛頡之頏之之子于歸逺于將之瞻望弗及佇立以泣三章燕燕于飛下上其音之子于歸逺送于南瞻望弗及實勞我心四章仲氏任只其心塞淵終溫且惠淑愼其身先君之思以朂寡人仲氏次女也任氏也其女所嫁之家也先君鍾情此女以屬于我故以美言譽之以善言勸之思其父則愛其男女之兄弟且于女兄弟尤深今人多然乂況旣孤乃始出適益傷其父之不見而念其妹之愈切也聞音曰野上與切南尼心切淵一均切聞跡曰任當是薛國總聞曰君夫人出逺郊送歸妾旣違妻妾尊卑之禮又違婦人迎送之禮莊姜識禮者也鄭氏以歸妾為戴媯歸宗也戴媯既生桓公烏有絶其母子之理莊姜亦識義者也以桓公為已子而絶戴媯使不母桓公人情㫁矣又烏有瞻望泣涕不可勝忍之情且有大可疑者使桓公㓜稚戴媯隔離容或有之旣稱先君則莊公已沒桓公已立尤非人情也尋詩差池若有一前一後之意頡頏上下若有一低一昂之意當是女子徃適人君子來迎婦故即燕取興兼其末皆非婦人稱謂之辭日月一章日居月諸照臨下土乃如之人兮逝不古處胡能有定寧不我顧之人是人也當是在位者為人所聞君忘故情已失故處望是人甚深不斥言之為君故婉也此近厚之人也二章日居月諸下土是冒乃如之人兮逝不相好胡能有定寧不我報三章日居月諸出自東方乃如之人兮徳音無良胡能有定俾也可忘毛氏日始月盛皆在東詩人言月多東指其盛也四章日居月諸東方自出父兮母兮畜我不卒言不如其死也詩凡無所愬者多歸天次歸日月次歸父母不能堪者多歸死今人猶冇此態胡能有定報我不述此効力為國而有所問也度其勢未已故皆曰胡能有定也聞音曰顧果五切聞訓曰居諸皆辭也禮檀弓曰何居鄭氏音姬齊魯之間語助也總聞曰莊姜既曰賢婦當曉多義又識禮分在莊公則為無良在莊姜則為不可忘乃有深銜切憤之意似非賢者所存也碩人之詩其愛君之情如此必無過當之辭也終風一章終風且暴顧我則笑終風末風也風至末則衰猶能為暴況當盛時可謂大異也謔浪笑敖中心是悼天災如此當儆懼而反傲侮是可憂也二章終風且霾惠然肯來莫徃莫來悠悠我思當是謔浪笑傲者來過君子君子不欲親之我不徃彼彼亦勿來此也疎之之辭也三章終風且曀不日有曀寤言不寐願言則嚏嚏鼻也俗言為人暗及則鼻發聲此當是謔浪笑傲之人不平君子之不與已同故切齒也四章曀曀其隂虺虺其靁寤言不寐願言則懐氣象猶冬雷也故君子深憂至于不寐也聞音曰霾陵之切來陵之切思心齎切懐胡隈切三章皆用引韻獨此不用舊説以為疑詩無定體以叶為先苟叶雖少參差無害總聞曰敬天者有災則罪已慢天者有災則罪人此遭變異而反瀆侮者必以某人某人致此在位相過及之同類者相和有識者獨憂也擊鼓一章擊鼓其鏜踴躍用兵衛伐鄭之役在魯隠四年是役宋陳蔡皆従夏秋再舉初踴躍後乃憂嗟不堪連沒也杜氏苦哉邊地人一歳三従軍土國城漕我獨南行衛在河北鄭在河南城漕不離國也伐鄭則越境差逺故有嘆羨其徒之辭二章從孫子仲平陳與宋不我以歸憂心有忡不我以歸者夏還而冬再舉當是征夫不得還家也三章爰居爰處爰喪其馬于以求之于林之下居死者也死歸塜壙謂之居處傷者也傷留在處謂之處喪馬有刑不敢歸則逃者也四章死生契濶與子成説執子之手與子偕老生則契死則濶同歸偕老願之辭也五章于嗟濶兮不我活兮于嗟洵兮不我信兮不能契而竞當濶也故此不言契而獨言濶不知在逺者信我為死耶不信我為死耶想不信我死幸其存也聞音曰兵晡茫切行户郎切忡敕衆切老魯吼切信斯人切馬下相叶今従見音馬莫下切下亥雅切易林東行西處喪其犬馬南求驊騮夫駒林下亦自與處相叶今處既不甚切不必叶可也總聞曰再舉皆勝而人情如此葢知州吁之必不免故人慮併及祻而有憂心也衆仲曰州吁阻兵而安忍阻兵無衆安忍無親衆叛親離難以濟矣又曰州吁弑其君而虐用其民欲以亂成必不免矣衆仲之語即衛人之情也凱風一章凱風自南吹彼棘心棘心夭夭母氏劬勞孤子事寡母者也當是賤者之家母采棘心以為食棘心棘芽也其子不欲其母親此故傷其勤勞其意蓋在乎保衰佚老也二章凱風自南吹彼棘薪母氏聖善我無令人采棘心猶之可也采棘薪則勤勞過甚也其子以為婦當代姑不欲其母太勞也有子至七人其年亦老不宜采薪故其子傷其母而罪其室家也三章爰有寒泉在浚之下有子七人母氏勞苦四章睍睆黄鳥載好其音有子七人莫慰母心感寒泉其母勞而口渴也感黄烏其母勞而聲急也此所以責妻乂責已也聞音曰南尼心切下後五切聞跡曰寒泉逕河内雍城與清水合總聞曰令人賢婦也七婦未必皆不賢而其子憐其母故責其婦也孟子曰凱風親之過小者也小弁親之過大者也親之過大而不怨是愈疏也親之過小而怨是不可磯也凱風之過不能従其子之善意必寡識者也小弁之過不能救其子之顛危必寡情者也此孟子所謂大小之别也趙氏以謂凱風言以慰母心母心不悦親之過小也小弁言行有死人尚或墐之而曽不閔已親之過大也此頗得孟子之意小弁之序以為作于太子之傅而趙氏以為作于伯竒是時己不用序故併載于此雄雉一章雄雉于飛泄泄其羽季冬節為雉始雊今飛鳴如此當是春深婦人感春氣則生欲心所謂有女懐春者也我之懐矣自詒伊阻食其禄而不去有此隔絶則是自詒也二章雄雉于飛下上其音展矣君子實勞我心三章瞻彼日月悠悠我思道之云逺曷云能來瞻彼日月謂日没月出月没日出日月漸長而君子何時能來也四章百爾君子不知徳行不忮不求何用不臧忮心求心最害心源之本也所以子路終身誦之而孔子以為何足以臧言忮求皆生于心不治苟能治心安有此病也聞音曰思新齎切來陵之切行户郎切總聞曰此葢婦人發辭以雄雉比其夫以雌雉比已也末章百爾君子如州長掌師田行役之事縣師掌軍旅田役之事者也苟無害于人無邀于人何所用而不為善此必有求于行役者而不遂故獨使逺役其妻所以有怨辭雖怨猶有相勸為善之意此婦人亦近厚也匏有苦葉一章匏有苦葉濟有深渉深則厲淺則揭二章有瀰濟盈有鷕雉鳴濟盈不濡軌雉鳴求其牡三章雝雝鳴鴈旭日始旦士如歸妻迨氷未泮自暮春通媒至暮冬合昬正月節為解凍冰未泮則猶冬言非時四章招招舟子人渉卬否人渉卬否卬須我友男女之家當隔濟而居故通媒及成昬皆以度水為辭須友女辭也猶有所待者如時太早欲少緩以須仲春不肯先期也女必甚賢而父母急欲遣之非女意也聞音曰揭苦例切軌舉有切否補美切友羽軌切卬讀作我今人猶有此音下又我兼稱聞跡曰濟濟水也濟不可渉或是濟之支流故亦稱濟總聞曰爾雅繇膝以下為揭繇膝以上為渉繇帶以上為厲此書雖云興于中古隆于漢氏細推止是漢儒相發明以實訓注然亦非一人所為所以多迕如掲為揭衣膝以下安用揭衣衣上裳下與衣恐礙故釋者以為搴裳如以衣渉水為厲縧帶以上水及衣非止膝以上乃反為渉與厲恐礙故釋者以衣為襌此類甚多至以為出于周尤所不曉谷風一章習習谷風以隂以雨婦人承夫命出有所營當是夫厭薄婦以此為端而稍逺之且稍苦之登途而値風雨觸境興懐然其辭皆理正情長度其曲在夫也黽勉同心不宜有怒二章采葑采菲無以下體徳音莫違及爾同死三章行道遲遲中心有違不逺伊爾薄送我畿四章誰謂荼苦其甘如薺宴爾新昬如兄如弟五章涇以渭濁湜湜其沚宴爾新昬不我屑以當是其夫以他事加其妻故其妻愈忿言我持正無慊臨行當見涇渭之流故興辭也六章毋逝我梁毋發我笱我躬不閲遑恤我後臨行祝後事之辭當是其家近水此言梁笱下言方舟泳㳺恐是臨涇渭支流上云涇渭也七章就其深矣方之舟之就其淺矣泳之游之八章何有何亡黽勉求之凡民有喪匍匐救之九章不我能慉反以我為讎既阻我徳賈用不售阻我所得以物易食于人而人又不售訴窮之辭十章昔育恐育鞠及爾顛覆既生既育比予于毒昔育子之時恐所育者窮并爾皆不相保今所生既可育反視我如毒言家理稍進子息已全不堪其見斥也十一章我有㫖蓄亦以御冬宴爾新昬以我御窮乾蓄非喜啖也特無可奈何地力稍蘇蔬本稍長則不用矣今西北多然言夫窮相親富相疎十二章有洸有潰旣詒我肄不念昔者伊余來塈不以美言啖之又以武怒加之付以勞苦之事不念我始來相歸之時少使我安息也當是其夫與所昵安享而其妻經營勞苦故甚不堪也聞音曰救居尤切售時周切聞章曰舊六章今為十二章聞物曰葑蔓菁也菲蔓菁類也毛氏茐也爾雅蒠也説文茐也今蒠茐二名不傳郭氏以為紫葉赤色是蔓菁也根亦可食故曰無以下體也聞用曰笱魚箄籃也總聞曰此非絶也特以勞役之事苦之新昬近有所昵非納采問名而禮昬者也徒見兩及新昏男女之合以夜晝居于内問疾可也故以納婦為昬其他交際皆可稱昏丁氏昏冥也從女許氏婦家也詩多為昏大率論古當以人情推之既絶不可以相見而尚薄送何也既絶遂為他人而尚祝以毋逝毋發何也末云伊余來塈望來而求安也絶則豈復來乎泥兩字新昏失一篇大意所謂君子不亮烏乎執先亮而後執則善不亮而徒執故闇者不可以語也式微一章式微式微胡不歸式微發辭也微如旄丘所謂瑣尾者也當是黎侯行李薄旅況悴故再言式微甚可憐也尋詩稱君所謂黎侯出寓可從微止君之故胡為乎中露二章式微式㣲胡不歸微止君之躬胡為乎泥中下語又單稱㣲其意尤可悲也露人所不欲犯而胡為犯之指在旁故舊也泥人亦不欲犯而胡為犯之指君自已也當是此役相隨者有故無親故旄丘責其親也總聞曰中露泥中言行役冒犯之苦語法如此未必是地名也鄭氏所謂衛公以二邑處黎侯或說衛公者宣公也宣公父子夫婦其亂不可勝言何暇及人能以二邑處黎侯葢亦過厚而黎之臣子責以不脩方伯連率之職似非人情故旄丘之叔伯若以人情推之當為黎之親族而非衛之臣子也旄丘一章旄丘之葛兮旄丘丘之多草木者也星名旄頭言光芒多冠亦名旄頭言羽毛多葛野葛也深春乃生此詩當是此時何誕之節兮叔兮伯兮何多日也言行役乆厯時不知以何時而出盡春未歸其親族皆不䘏責其無情也二章何其處也必有與也何其乆也必有以也三章狐裘蒙戎匪車不東叔兮伯兮靡所與同其衣既不整無車又不能東行役如此乏闕而親族不與同憂又責其無情也四章瑣兮尾兮流離之子叔兮伯兮褎如充耳瑣細尾亦細言在末者微也流離破服如此而親族如不聞也甚責其無情也聞音曰節子悉切乆舉里切子奬禮切聞事曰古隴頭歌隴頭流水流離山下念吾一身飄然在野與此流離同意鄭氏言鳥名恐非總聞曰當是卑者責尊者也宗族有故尊者當任之而以叔伯為衛臣聖人必不以此無理之事存之何以勵為親戚且為臣子者也簡兮一章簡兮簡兮方將萬舞日之方中在前上處簡擇也所以下云日中所擇之時也二章碩人俁俁公庭萬舞有力如虎執轡如組伶官其貌與力與伎皆武士以武士為伶人武備之弛葢可見也三章左手執籥右手秉翟赫如渥赭公言錫爵伶官執事之際乃飫以酒見之于容下不恭肅則上之淫湎亦可見也四章山有榛隰有苓云誰之思西方美人彼美人兮西方之人兮詩人有所指也其人當在西之山野故云山榛隰苓言斯人在位濁亂必不至此必秉正不詭隨者也聞音曰翟直角切聞用曰萬舞也篆文象形龍生鼎齊侯鐘尤明總聞曰公庭非祭所葢燕樂也賢者必不肯入此流執此事葢自碩人生此意碩俁皆大也與下如虎相應此亦非賢者之容其所謂賢者在西方者是也泉水一章毖彼泉水亦流于淇有懐于衛靡日不思孌彼諸姬聊與之謀此當是衛女適他國而他國女復適衛交相為婚姻送别之辭故下傳意厯問其親也其地必相近皆與淇相接者也二章出宿于泲飲饑于禰女子有行逺父母兄弟問我諸姑遂及伯姊三章出宿于干飲錢于言載脂載舝還車言邁遄臻于衛不瑕有害亦欲亟至衛雖無瑕然有害言夫必以為罪也故不敢言歸四章我思肥泉茲之永歎思須與漕我心悠悠駕言出遊以寫我憂聞音曰思新齎切謀謨杯切泲奬禮切弟待禮切干居焉切舝下介切害暇憩切歎他涓切漕徂候切丁氏水運也舊説疑未盡因水運得名何害古曹徂侯切漕以曹得聲亦不礙運義聞跡曰美溝逕朝歌注淇水為肥泉漕水注河逕鞏縣泲水合渠水厯中牟干言恐皆是地名衛縣有竿城恐是干甘陵有信鄉故縣信恐是言字禰須亦皆地名總聞曰不見父母終之意但言女子有行與父母兄弟相逺此常事亦常情也北門一章出自北門憂心殷殷北門所従去國之道終窶且貧莫知我艱已焉哉天實為之謂之何哉二章王事適我政事一埤益我我入自外室人交徧讁我已焉哉天實為之謂之何哉三章王事敦我政事一埤遺我我入自外室人交徧摧我已焉哉天實為之謂之何哉當是出而幹職事歸而遭阻間故有怨辭聞音曰艱居銀切哉將黎切讁行棘切敦都因切遺夷仁切總聞曰各隨所方之門為所適之道不必言背明向隂偶爾向北若東門之墠東門之枌皆向明之方而其詩反皆暗昧淫濁之事恐難以方論也北風一章北風其涼雨雪其雱惠而好我攜手同行其虛其邪旣亟只且二章北風其喈雨雪其霏惠而好我攜手同歸其虛其邪旣亟只且此當是離本邦適他國又不安而歸也三章莫赤匪狐莫黒匪烏惠而好我攜手同車其虚其邪旣亟只且狐烏皆野所見言狐赤烏黒皆不以寒而改行役顔色改變傷之辭也聞音曰行户郎切邪祥余切且子餘切喈居奚切車斤於切聞訓曰涼風色薄也喈風聲緩也大率風作雪者也雪成則風稍止雨作去聲總聞曰常情重遷虛歎辭非不欲徐而不可不急只且皆嘆聲屢歎者深不欲去之意也静女一章静女其姝俟我于城隅愛而不見搔首踟蹰當是其夫出外為役婦人思而候之此是夫辭二章静女其孌貽我彤管彤管有煒悦懌女美三章自牧歸荑洵美且異匪女之為美美人之貽彤管樂器之加飾者也以遺其夫荑草之美者也以遺其婦交相為悦也聞音曰異盈之切叶荑吳氏貽作以志切旁紐皆可叶然作平聲讀意多聞字曰愛而不見方言注以愛為薆正引此詩言掩翳也亦有理然不必如此愛而不見之意亦深聞事曰或以愛尋隈竊合此安得為静女總聞曰牧見左氏隠五年鄭侵衛牧杜氏衛邑當是此地夫自牧而歸女隅城而候當是官役稍苛牧夫遲歸婦人思君子之深出門亦非獲已然猶不敢逺至城之外而潜處城之隅足見其静也新臺一章新臺有泚河水瀰瀰新臺當是地名新臺有泚清也有洒浄也河水瀰瀰盛也浼浼濁也新臺之地必有水而清非河之比也尋詩當是此地之人娶妻不如始言故下有不悦之辭本求燕婉乃得惡疾者為可恨也燕婉之求籧篨不鮮二章新臺有洒河水浼浼燕婉之求籧篨不殄三章魚網之設鴻則離之燕婉之求得此戚施夫不悦其妻則以惡疾詆之此夫必淫佚婦必髙潔河水濁而臺清魚網下而鴻髙婦不同夫故夫不悦婦籧篨今龜胸也戚施今駞背也二疾雖亦有兼之者然未必至此恐是益辭聞音曰鮮想止切洒先典切浼美辦切殄他典切聞字曰鄭氏殄作腆不必胡不早殄也惡辭也聞跡曰衛玷臺女臺三女臺皆在河側所至地名不論虛實眞偽多相承為稱總聞曰聖人存詩所以訓世也聖人曰詩可以興可以觀可以羣可以怨邇之事父逺之事君審爾則此等之詩誠不可于君臣父子之間言之則聖人所以為世訓者乃如此徃或進講及此拱手不啟口旣而以其實對云有不可言于君父之前者自此凡此類悉不講遂以為常恐非聖人本意而相承為誠然故輕儇者則資玩狎之談而恭愿者則持緘黙之誡左氏宣公右膳之事或有而恐非此詩識者更詳二子乘舟一章二子乘舟汎汎其景二當作之女乘舟渡河而歸人其徒餞送者也舊説以為伋夀争相為死之事尋詩乘舟汎水有相思不忍别之意伋夀之變死者一君二長子二公子大亂者二世交争者三國而廢立者二天王豈所謂不瑕有害者然伋夀之死亦非人情似好竒者為辭伋夀之變縱如左氏所言亦曖昧倉卒而非如此従容者也願言思子中心養養送者之懐也二章二子乘舟汎汎其逝願言思子不瑕有害聞音曰景舉兩切害暇憩切總聞曰大率異詩同辭必當時常談如不瑕有害是也送人適人而動懐雖無他疵然不無所傷盖人情以為動念而慕之也當是未適人之女畏物之議如此葢賢女也詩總聞卷二
