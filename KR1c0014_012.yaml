body:
  text: 詩總聞卷十二宋王質撰節南山一章節彼南山維石巖巖赫赫師尹民具爾瞻憂心如惔不敢戲談師官尹氏也不敢戲談有所畏避也下章皆有不敢之意當是其人雖無可敬而其位貌亦有可憚者國既卒斬何用不監何所用心而不監小人之為惡問之不欲斥言也下章稱何稱誰倣此二章節彼南山有實其猗赫赫師尹不平謂何天方薦瘥喪亂𢎞多民言無嘉憯莫懲嗟三章尹氏太師維周之氐秉國之均四方是維天子是毗俾民不迷不弔昊天不宜空我師氐祗也旁紐作氐為國之根一重也執國之平二重也四方所藉以為維三重也天子所倚以為毗四重也下民視之以為明五重也尹氏可謂重臣而天職如此不宜使斯人居尊官當是尹氏以六官司空之職兼三公大師之任故曰不宜空我師訴之於天不欲斥言也下章稱天倣此四章弗躬弗親庶民弗信弗問弗仕勿罔君子呼尹氏為君子尊之辭也戒小人勿得欺尹氏憐之辭也下章稱君子倣此式夷式已無小人殆瑣瑣姻亞則無膴仕用平則已無近小人無使姻亞為膴仕有此二者則不平也曉之辭也五章昊天不傭降此鞠訩昊天不惠降此大戾訩訟也當是尹氏不平群臣多爭卒章亦及訩君子如屆俾民心闋君子如夷惡怒是違爾如能止則彼鞠訩之心自息爾如能平則彼惡怒之氣自去勸之辭大率此詩詆之多言不平曉之多言夷六章不弔昊天亂靡有定式月斯生俾民不寧憂心如酲誰秉國成不自為政卒勞百姓亂與月俱生言有增也爾秉政而不自為政言為交爭者所爭所以政多門而民受弊也七章駕彼四牡四牡項領我瞻四方蹙蹙靡所騁當是小人銜王命乘使車言封疆之蹙如此小人安能逺騁但擾自境之內爾八章方茂爾惡相爾矛矣既夷既懌如相酬矣方盛怒俄相歡小人之常態也九章昊天不平我王不寧不懲其心覆怨其正皆因尹氏不平故小人交爭我王不寧小人之罪奚逃不革其心而反怨其正當是有規正者重憎怨也亦小人常態也十章家父作誦以究王訩式訛爾心以畜萬邦家父不敢戲言而顯言作誦者以告於王也盡為王道其致訟之故皆因尹氏不平也化尹氏之心反不平以為平則可畜天下之衆不然愈盛民將散而無與為國也聞音曰山所旃切巖魚杴切猗於何切嘉居何切氐都黎切信斯人切仕鉏里切子奬里切殆養里切傭敕龍切訩許容切屇居氣切闋睦桂切天鐵因切定唐丁切生桑經切姓桑經切酬市由切正諸盈切誦疾容切邦土工切邦本音外又卜工切瞻彼洛矣君子至止福祿既同君子萬年保其家邦與此同又披耕切桓綏萬邦屢豐年補因切凡見詩者如此他所不舉聞迹曰南山韓氏吾聞京城南茲惟群山囿即是此山左氏惟言節無南山字聞人曰家父見魯桓八年桓王也十五年莊王也舊説刺幽王自幽王之死至是七十五年尚能為王出使求車刺幽王之詩皆老臣之辭則約百餘嵗矣故此未必刺幽王也總聞曰尹氏之不平罪本在于王而不指歸王小人之鞠訩罪不在于尹氏而不深言尹氏家父蓋忠慤而恕厚者也度尹氏亦無大惡但居位而不舉職無公言直道而不控制小人就其上而班之胡廣趙戒之流也正月一章正月繁霜我心憂傷當是賢者避患去國其道所懷與所遇所見者民之訛言亦孔之將念我獨兮憂心京京哀我小心癙憂以癢小心故懷憂致病二章父母生我胡俾我愈不自我先不自我後所遇不在先不在後適與我相當何為於此時而生我致此病也與我生不辰同意好言自口莠言自口憂心愈愈是以有侮憂事太過則招侮言多畏則易陵也三章憂心惸惸念我無祿民之無辜並其臣僕哀我人斯于何從祿所憂本在無祿今無辜及其身又及其臣僕如此將何地而從祿乎言此祿不可從當他求也瞻烏爰止于誰之屋所見烏一也此烏止誰屋也言未有所歸四章瞻彼中林侯薪侯蒸所見中林二也言欲樵採以自給也民今方殆視天夢夢既克有定靡人弗勝方危為憂所亂視天瞀惑若不堪用者苟定則何人不勝任言皆可用也有皇上帝伊誰云憎訴之于天也何人可憎願明指也今皆危與所憎同受苦所以願明指也五章謂山蓋卑為岡為陵民之訛言寧莫之懲山高者也岡陵卑者也今見山以為岡陵為憂所惑召彼故老訊之占夢具曰豫聖誰知烏之雌雄召耆宿問占夢猶是視天夢夢餘意蓋憂思之中惶惑妄見占何為不祥也所問者皆言其通曉乃不知烏孰為雌雄猶是瞻烏餘意尚不知雌雄安知所當止也言卜者不能決疑六章謂天蓋高不敢不局謂地蓋厚不敢不蹐維號斯言有倫有脊哀今之人胡為虺蜴天高而以為低故曲膂地厚而以為薄故纍足亦為憂所亂也以為不然則為此號發此言如耳有輪如背有脊又較然也言為憂所亂之極也七章瞻彼阪田有菀其特所見阪田菀特三也特特生之木也欲依阪田特木以自給也天之扤我如不我克彼求我則如不我得執我仇仇亦不我力天動我心如我不能任事者王初求惟恐不得以我為能也既得我不以我為能我亦自疑我非不能至此而若不能者蓋天動我心不使任其事可以免其難也八章心之憂矣如或結之今茲之正胡然厲矣正正月也此詩皆此月之事三陽之月奚為寒之厲如此甚也以天時推人事深可憂也燎之方揚寧或滅之赫赫宗周褒氏滅之當是幽王以後事故舉已往以比後來或以火方熾豈有可滅之理識者推觀前覆褒姒能覆宗周言雖盛易滅也九章終其永懷又窘陰雨所遇陰雨四也其車既載乃棄爾輔載輸爾載將伯助豫車既載且行遇雨方知遺輔車之器亦為憂所亂也既墮所載未能遽行願伯助我修敗車涉淖塗伯當是伯兄同行者也言隻力不能獨辦也十章無棄爾輔員於爾輻屢顧爾僕不輸爾載終踰絶險曽是不意無遺其輔用益其輻屢顧其僕而言不可墮所載也此戒僕之辭也我為憂所亂雖踰險曽不以是為意言意不在車也十一章魚在于沼亦匪克樂潛雖伏矣亦孔之昭所見池魚五也當是初居有此因有感也魚在沼為人所豢雖潛不能逃也言我豈可受彼祿也憂心慘慘念國之為虐十二章彼有旨酒又有佳殽洽比其鄰止昏姻孔云念我獨兮憂心殷殷當是就田野為居廬頗有比鄰之樂而其憂終不能釋也十三章佌佌彼有屋䔩䔩方有穀民今之無祿天夭是椓哿矣富人哀此惸獨當是其鄰稍厚可以相依也佌佌之屋䔩䔩之穀皆其鄰所資也但恐斯人無祿為妖者並出而椓喪之富人尚可我惸獨將如之何也此當是老而無子者兩言念我獨一言哀此獨與伯兄同行可見其獨也聞音曰京居良切愈勇主切後下五切口孔五切夢彌登切勝書蒸切雄于陵切局訖力切厲力蘖切輔扶雨切豫演女切輻筆力切意乙力切昭之若切椓都木切吳氏以殽叶云未詳鄰連上句昏連下句則叶故古之音律雖不可盡聞亦在詳推也總聞曰一詩及憂者八而言憂之狀者又不一也所謂小心良是心最小者憂最深十月之交一章十月之交朔日辛卯日有食之亦孔之醜是月必朔望日月俱食所以謂之甚醜見下左氏童謡其九月十月之交杜氏晦朔交會也又丙子旦日在尾月在箕杜氏日月合朔於尾月行遲故至旦而過在箕此交殆類此時按經是年九月戊申朔日有食此朔當是戊寅小盡當是丁丑併載于此彼月而微此日而微今此下民亦孔之哀二章日月告凶不用其行四國無政不用其良彼月而食則維其常此日而食於何不臧日食之變甚大于月食所以春秋書日食不書月食月食固為常一月而兩食則為異變于何不臧一何不善也孔氏良是三章􅏎􅏎震電不寧不令百川沸騰山冡崒崩高岸為谷深谷為陵哀今之人胡憯莫懲雷收水涸皆八月中氣而中月電震川沸大異四章皇父卿士番維司徒家伯冡宰仲允膳夫棸子內史蹶維趣馬楀維師氏艷妻煽方處皇氏番氏家氏仲氏棸氏蹶氏楀氏凡七族皆因艷妻而處位也七族之中皇父為最盛下云抑此皇父又云皇父孔聖自此而下皆皇父作向之事也五章抑此皇父豈曰不時胡為我作不即我謀徹我牆屋田卒汚萊曰豫不戕禮則然矣此督民作都于向怨之辭也汝豈不知是農時而何為使我興作又不就我相謀而徹我屋荒我田皇父以為非害汝也禮當然也言不引愆反飾非也六章皇父孔聖作都于向擇三有事亶侯多藏不憗遺一老俾守我王擇有車馬以居徂向擇三事之多藏群臣之有車馬者以向為歸此殆類郿塢也七章黽勉從事不敢告勞無罪無辜讒口囂囂下民之孽匪降自天噂沓背憎職競由人八章悠悠我里亦孔之痗四方有羡我獨居憂民莫不逸我獨不敢休天命不徹我不敢效止我友自逸此不與皇父同惡而為所苦者也此人當是向人而督向事故自徂向之下即言黽勉從事不敢告勞又言悠悠我里亦孔之痗當是此役督迫甚急切責亦重同黨不肯當之而異己者承之也故多言我獨也聞音曰卯莫後切哀於希切行戶郎切令盧經切臧才浪切王于放切吳氏以鄭國氏之三卿信維多藏之人又在位之人皆去無留衛王藏王皆為平聲雖仄聲亦是平意不必以為未詳天鐵因切痗呼罪切徹直質切馬滿補切謀謨柸切萊陵之切矣於姬切聞訓曰徹通也言其命不通也自恨之辭聞句曰我不敢效我友自逸舊一句今分為二句聞迹曰向邑名在河內軹縣總聞曰其言如此危憤猶有望于遺老守王大率賢者責君終淺愛君終深與後世訐君惡以賣己名者異也雨無正一章浩浩昊天不駿其德降喪飢饉斬伐四國尋詩皆無雨無正之文亦無雨無正之意他詩不見此比歐陽氏亦嘗疑之以為古人于詩多不命題而篇名往往無義例其或有命名者則必述詩之意今雨無正之名據序曰雨自上下者也言衆多如雨而非政也今考詩七章都無此義與序絶異而不言其所以然據詩周宗既滅鄭氏厲王流彘之時考詩正大夫離居言不從王者也三事大夫莫肯夙夜邦君諸侯莫肯朝夕言雖從王而不以君事王者也在鎬無君在彘有君與無君同兩地皆無正可宗也雨恐當作兩字之轉雨兩字全相類古雨作兩兩亦作兩易差旻天疾威弗慮弗圖舍彼有罪既伏其辜若此無罪淪胥以鋪二章周宗既滅靡所止戾正大夫離居莫知我勩莫知王失所之勞言不從王者也憤之辭也三事大夫莫肯夙夜邦君諸侯莫肯朝夕庶曰式臧覆出為惡庶幾因事為善而反出令為惡無保君免難之心有挾君肆惡之志憤之辭也三章如何昊天辟言不信如彼行邁則靡所臻告以有法之善言不以為信今則流離何所底止傷之辭也凡百君子各敬爾身胡不相畏不畏于天責凡從王者之辭也各自敬爾身而已何為更不畏王不畏王是不畏天也憤之辭也四章戎成不退飢成不遂曽我􅉏御慘慘日瘁責凡不從王者之辭也君避兵而奔所謂戎成君逃難而餓所謂飢成小臣懷憂至病而大臣曽無攘賊輸餼者憤之辭也凡百君子莫肯用訊聽言則答譖言則退莫肯用訊者無肯用王告難之訊也有隨己者則答之凡言王不可迎者也有毁己者則退之凡言王不可不迎者也五章哀哉不能言匪舌是出維躬是瘁哿以能言巧言如流俾躬處休此監謗之流弊今王自當之商鞅歎為法之弊至此雖悔何及也六章惟曰豫仕孔棘且殆云不可使得罪于天子亦云可使怨及朋友責為王將命告難之辭也凡往圖事者如此之急且危或言不可使者天子必責其交私謂其相護避危事也或言可使者朋友又受其移怨謂其見推涉危道也大率無奮志捐軀之士寧以不可使得罪于天子而不願可使得薦于朋友也七章謂爾遷于王都曰豫未有室家鼠思泣血無言不疾昔爾出居誰從作爾室責不赴王之辭也曰豫未有室家以室家為拒人之辭也無言不稱疾以疾為欺人之辭也言必得妻奉疾而後可行也勸者不堪其意而詰之爾往昔避亂離都之時何嘗有妻事汝言無妻云久不獨今日也安得以此拒我為辭聞音曰國越逼切夜弋灼切今北人猶有此聲夕祥籥切信斯人切天鐵因切訊息罪切出尺遂切殆養里切子奬禮切友羽軌切家古胡切血虛屈切説文洫恤皆以血得聲易女承筐不實士刲羊無血聞訓曰淪胥水回復貌詩多言此毛氏淪率也胥相也言牽率相引也大費意集韻淪沒也胥長也皆言水狀不能快流也下云無淪胥以敗此必是方言但今不曉聞字曰鼠當作癙病也與正月癙病同集韻通作鼠總聞曰厲王出奔彘嵗在己未死于彘嵗在癸酉凡十五年居正位之君在彘行君事之臣在鎬不可三月無君而十五年曽無一人唱反正之謀舉勤王之師者雖厲王不君然命義天下大戎也以正律之當會同諸侯誅戮羣小奉厲王于西都周召二伯左右為之弼諧既不能然儲賢嗣以待將來雖不為無功于周然終非萬世之正也此詩聖人所以存之君臣之際有考焉小旻一章旻天疾威敷于下土當是有大旻又有小旻亦如有大明又有小明大旻今不存毛氏列于十月之交雨無正為小故曰小旻謂其辭比前稍約也識者更詳謀猶遹回何日斯沮謀臧不從不臧覆用我視謀猶亦孔之卭此詩多及謀猶當是與圖事者君子之言不用小人之言是從故君子為憂集韻猷通作猶二章潝潝訿訿亦孔之哀謀之其臧則具是違謀之不臧則具是依我視謀猶伊于胡底胡底何所止也言必至于亂也鄭氏良是三章我龜既厭不我告猶龜猶厭其不誠不以告之而况於人亦不以告也謀夫孔多是用不集發言盈庭誰敢執其咎如匪行邁謀是用不得于道雖謀夫孔多皆邇言也如深坐而不出則行路之實語不得而聞之言不廣詢外議止聽側言也四章哀哉為猶匪先民是程匪大猶是經維邇言是聽維邇言是爭如彼築室于道謀是用不潰于成凡邇言皆非先民之程大猷之經也如築室臨路必與路之附近者相謀則審勢取材就近而得實今築室于道而定謀于室何由工徒可散而功役可成乎大率工散則功成俗語畢功謂之放散亦言不廣詢外議止聽側言也後稱廣謀雜聽者多以築室于道為辭故曰作舍道旁三年不成尋詩正以聽言狹而不廣近而不逺為憂不如後世所衍之意此類誤引經者亦多五章國雖靡止或聖或否民雖靡膴或哲或謀或肅或艾如彼泉流無淪胥以敗靡止言流落也靡膴言薄惡也然不為無人在審擇之鄭氏有通聖有不能者有明哲者有聰謀者有恭肅者有治理者上下兼貫五事而以否間則不能是五者也如此則語差而遒斷而整可以為法六章不敢暴虎不敢慿河人知其一莫知其他戰戰兢兢如臨深淵如履薄氷前三如曉之辭後兩如戒之辭也當是此詩之作遇水感情末兩章皆指水興辭泉當流不可淪胥淪胥回復也不流則敗言人情不可塞也虎當畏不可搏河當濟不可陵搏虎陵河未有不貽害者言人情不可忽也淵不可臨而深者愈不可臨氷不可履而薄者愈不可履皆言人情不可忽也尋詩所以謀臧者不從而違謀不臧者覆用而依皆怙尊忽衆之過也此詩正中其病聞音曰用餘封切哀於希切底都黎切猶余救切集疾就切咎正九切道徒厚切聽他經切否補美切膴火吳切謀魚胡切艾魚氣切敗蒲昧切他湯河切淵一均切總聞曰暴虎慿河臨深履氷四者皆危事亦皆北俗北俗強健河東有一種打虎社大率平地日中則虎瞀此時多伏則驚起以搏之孟子所謂馮婦者也大叔于田袒禓暴虎獻于公所亦飾言也打虎社自有虎衣虎器又有獅子筒以竹木為之呼吸作聲則虎驚此暴虎也河壖奔徙無常有平地高陸忽為深河有衝波巨浪忽為大野人認水聲知之有車乘馬牛臨河忽沒者此慿河也河深冬北風則氷亦有厚薄堅脆大率驟氷者多不常連氷者多可保人多循狐迹而渡相傳狐能聽氷下水聲擇無聲處乃行亦有為所誤此履氷也書若履虎尾涉於春氷最善下語虎以尾為威之節人旁觀其尾緊緩高低展縮及左右輒知其所趣南人亦能識之才立春正月節雖風雪苦寒亦不可度北人謂之巢水以是推之則詩人所謂戰戰競兢當是親經厯者也小宛一章宛彼鳴鳩翰飛戻天説與小旻同以大小别繁簡也大明小明可見我心憂傷念昔先人明發不寐有懷二人當是見後嗣不肖而思其先也二人考妣也恐是見幽王褒后思宣王宣后二章人之齊聖飲酒溫克彼昏不知一醉日富各敬爾儀天命不又人即所念之人也其先飲酒如此其後乃飲酒如此憂天命不復再來言將亡也三章中原有菽庶民采之螟蛉有子蜾螺負之教誨爾子式穀似之因采菽而見螟蛉蜾螺興感言其子不似其父也異類誨他種猶相肖而胞胎子息乃不肖也四章題彼脊令載飛載鳴我日斯邁而月斯征夙興夜寐無沗爾所生又見脊令興感言兄弟不相親愛日邁月征而奔走無定也五章交交桑扈率場啄粟哀我填寡宜岸宜獄握粟出卜自何能穀又見桑扈興感言彼尚有粟可啄我不唯無之又恐墮刑持粟求卜問如何可以逺害皆兄弟之間憂疑之情也持粟求卜有田里之狀采菽亦有田野之態當是王之兄弟家窮財薄如此故曰填寡六章溫溫恭人如集于木惴惴小心如臨于谷戰戰兢兢如履薄氷守善畏事之人憂惴如此言其上沉酗而不可測也故以酒起辭當是王之兄弟被苦懼禍而不安者如言先人所生所感之興皆父子兄弟間事也聞音曰天鐵因切富筆力切又夷益切采此禮切負薄猥切聞事曰鳩深春則新雛能飛宛小也雛之新也菽初茁可葅當是春時作此聞人曰毛氏二人為文武語意似不爾各為君臣亦恐不爾總聞曰考為宣王妣不知誰氏見幽王而思其考見褒姒而思其妣所謂各敬爾儀各者謂幽王褒姒也一為君一為后故下云天命不又卒之幽王殺而褒姒虜不又之證作者蓋有所見也小辨一章辨彼鸒斯歸飛提提説亦與小旻同下章言菀栁鳴蜩當是夏時作此民莫不穀我獨于罹何辜于天我罪伊何心之憂矣云如之何二章踧踧周道鞠為茂草我心憂傷惄焉如搗假寐永嘆維憂用老心之憂矣疢如疾首大率憂思多頭目昏瞀此疾首與伯兮首疾同意三章維桑與梓必恭敬止古人所居必植桑植梓定之方中可見此殆是祖業也靡瞻匪父靡依匪母不屬于毛不離于裏天之生我我辰安在毛在外謂毛髮之屬裏在內謂骨血之屬皆父母所生也今我亦受父母之毛髮亦受父母之骨血何民莫不穀我獨于罹也所生之日安在恐是其日其時不吉也猶今説命年月日時以支干納音推凶吉四章菀彼栁斯鳴蜩嘒嘒有漼者淵萑葦渒渒譬彼舟流不知所屆心之憂矣不遑假寐舟當以人駕御任其自流將何所止此心蕩漾無繩繂憂思之心多然五章鹿斯之奔維足伎伎雉之朝雊尚求其雌譬彼壞木疾用無枝心之憂矣寧莫之知木壞則枝枯無所覆芘其身言孤苦也故言寧莫之知園有桃所謂其誰知之也六章相彼投兔尚或先之行有死人尚或墐之君子秉心維其忍之心之憂矣涕既隕之七章君子信讒如或酬之君子不惠不舒究之伐木椅矣析薪杝矣舍彼有罪豫之他矣八章莫高匪山莫浚匪泉君子無易由言耳屬于垣無逝我梁無發我笱我躬不閲遑恤我後此詩每章皆因物有感一章飛鸒二章茂草三章桑梓四章菀栁鳴蜩萑葦舟流五章奔鹿雊雉壞木六章投兔死人七章伐木析薪八章山泉梁笱有懷在心凡觸目皆感傷也聞音曰斯先齊切提是移切道徒厚切草此考切酬當口切老魯吼切梓奬禮切毋滿罪切在此禮切屆居氣切伎其宜切雌于西切先君留切酬承况切杝湯何切山所旃切笱舉后切後候口切聞物曰椅杝毛氏以為伐木椅其巔析薪隨其理其説固然然不必如此椅梓屬他棠棣屬皆木名也又鄭氏鹿奔其勢宜疾而足反舒留其群也嘗見襄郢間走鹿屢駐足回顧舊説甚善投兔之説恐未然嘗見關陜間麞鹿為鷹犬所逐反投于人安得不爭先收護也人在旁鷹犬自止總聞曰司馬氏幽王娶申后生宜臼又悅褒姒生伯服廢申立褒而放宜臼宜臼平王也故太子之傅有此辭尋詩蓋士大夫之在下位者被讒懼罪其所感之物鳥獸草木山水以至舟楫薪蒸梁笱皆民間所見所用者末章與谷風民婦怨民夫之辭全同言已不能保物于何有當是君既不察親又不救末章有自訣之意也巧言一章悠悠昊天第五章始有巧言之文于詩罕見識者更詳曰父母且無罪無辜亂如此憮昊天已威豫慎無罪昊天泰憮豫慎無辜當是以讒獲罪于父母故曰已威又曰泰憮已泰皆甚也父當是幽王母當是褒后此辭似是平王也二章亂之初生僭始既涵亂之又生君子信讒君子如怒亂庶遄沮君子如祉亂庶遄已君子指父母也方亂初生僭者頗蓄之及亂又生讒者即信之矣然讒回心怒彼而福此亂立消也曉之辭也三章君子屢盟亂是用長君子信盜亂是用暴盜言孔甘亂是用餤匪其止共維王之卭不安其所止不服其所共惟為讒以病上而已信者以為我之益而不知為我之病曉之辭也四章奕奕寢廟君子作之秩秩大猷聖人莫之他人有心豫忖度之躍躍毚鬼遇犬獲之寢廟文武之廟也大猷文武之猷也言文武之業將墜也他人之心蓋廢嫡立庶也此亦易度但兔自恃其狡不知其有犬也言有不堪而俟變者也似是申侯四章七言亂子得罪于父母未遽至此蓋其時已醖釀申侯犬戎之事也五童荏染桑木君子樹之往來行言心焉數之蛇蛇碩言出自口矣巧言如簧顔之厚矣柔木讒人之狀也其君以為可倚而不知行路皆能數其心言淺謀而機露也故廢宜臼立伯服未幾而生變蓋姦謀久露衆謀漸集經世廢立在甲子殺立在庚午首尾七年六章彼何人斯居河之麋無拳無勇職為亂階既微且腫爾勇伊何為猶將多爾居徒幾何此必其人居河之側也無拳勇之才有微腫之疾雖其謀甚多而其徒無幾其為人所鄙賤如此所謂衆怒難犯專欲難成者知其無能為也似是虢石父之流聞音曰且七余切憮火吳切威紆胃切盟謨即切共居容切度待洛切獲黃郭切樹上主切數所主切口去厚切厚狠口切階居奚切幾居希切總聞曰平王雖非令主然亦非下流故文侯之命聖人存之觀其辭足以動人似是唐文宗之倫故國人銜切幽王而傷憫平王其後驪山之變即申立平以奉周祀何人斯一章彼何人斯此必前詩居河之麋者皆曰彼何人斯鄙惡之辭而此詩又甚造譖者當是近水而居所謂河麋是也被譖者亦當近水而居所謂我梁是也梁橋也其心孔艱胡逝我梁不入我門伊誰云從維暴之云鄭氏暴為暴公恐止如前詩亂是用暴之暴此當是過其門之梁不入而遂去被譖居家者所以疑也二章二人從行誰為此禍胡逝我梁不入唁我始者不如今云不我可過門者當是兩人始末之辭有異始以為可末以為不可大率此反覆之人也惟自知反覆所以難相見懼詰之窮也唁弔也當是得譴居家三章彼何人斯胡逝我陳我聞其聲不見其身不愧于人不畏于天當是過門留語而去陳所陳之梁也與前梁同四章彼何人斯其為飄風胡不自北胡不自南胡逝我梁祗攪我心大率彼人以此人懷憂生疑故愈設辭以亂其神欲使不安而自投于禍也惟其造謀如此所以愈難相見懼察之露也五章爾之安行亦不遑舍爾之亟行遑脂爾車一者之來云何其旴謂行之安又不暇止宿謂行之亟又方暇脂車但造陰謀設暗機欲害我而不一過我爾六章爾還而入我心易也還而不入否難知也一者之來俾我祗也猶有望于回而入門也當是寄語彼人還而入則我心寬還而不入則女謀不可測也二章俱望其一來而此章尤切兾其來以安其心憂疑之甚也七章伯氏吹塤仲氏吹箎及爾如貫諒不我知出此三物以詛爾斯此所謂二人從行也二人一塤一箎如索之貫而不解言二人相密如此也安知我心之憂疑不免以詛告神言欲此釁不成非他辭也蓋慮其人之知愈肆毒也八章為鬼為蜮則不可得有靦靣目視人罔極作此好歌以極反側汝若真鬼蜮則不得相見汝亦人爾雖懷慚不見我然同居近河相見安有窮時言終必相見也我不安之情至此亦極言汝可以已也物極必變蓋又恐動之辭聞音曰艱居銀切禍胡果切天鐵因切風愔切南尼心切舍商居切易余友切祗祈友切斯先齊切蜮越逼切側莊力切聞物曰鬼鬼車也蜮水弩也二物害人皆不可見三物犬豕雞也左氏鄭伯使卒出猳行出犬雞以詛射頴考叔者聞事曰鄭氏詛謂祝之使沮敗也禮有詛祝形載辭後世轉為陰邪之事非古聞人曰皆偶然為此春秋魯文公八年公子遂會雒戎盟于暴十年及蘇子盟于女栗二年及二地相去甚密又偶見維暴之云蓋人所言也遂相孚合而為辭毛氏又見魯成十一年晉郤至與周劉子爭溫為王官之邑則併與暴同為畿內國名而杜氏傳經乃以為鄭地也以此示博而不知後之識者亦有以審也總聞曰當是朝臣與太子相連者既陷太子將及其徒所以憂疑也造釁之人亦當是不足比數者巧言末章固有鄙賤之辭此詩尤甚方讒遂譖行雖可鄙不無可畏爾巷伯一章萋兮斐兮成是貝錦尋詩當為寺人所讒而被刑如司馬遷者也識者更詳彼譖人者亦已大甚二章哆兮侈兮成是南箕彼譖人者誰適與謀貝文斕斑似錦而非錦箕星排比似箕而非箕言初無是事強造成也三章緝緝翩翩謀欲譖人慎爾言也謂爾不信四章捷捷幡幡謀欲譖言豈不爾受既其汝遷譖人者多為所窺不以為可信或有所遷怒而反被害者勸其勿好譖也五章驕人好好勞人草草蒼天蒼天視彼驕人矜此勞人彼譖人者誰適與謀取彼譖人譖者非獨一人必有其徒也二章皆言誰適與謀六章投畀豺虎豺虎不食投畀有北有北不受投畀有昊楊園之道投畀豺虎豺虎不食言豺虎亦惡之也投畀有北有北不受言夷狄亦惡之也投畀有昊天無所不容也宜其受之乃亦棄之于楊園之道楊園郊野之地墳塜所在也甚憤怨之辭七章猗于畝丘寺人孟子作為此詩凡百君子敬而聽之猗美盛畝丘禾田也今田猶稱若干畝若干丘當是憂時作此聞音曰甚食茌切謀謨柸切翩批賔切信斯人切幡芬邅切天鐵因切者掌與切謀滿補切者謀相叶移取彼譖人一句則不必掌與滿補可也邱祛竒切末以之叶詩聞句曰移第六章彼譖人者誰適與謀取彼譖人三句入第五章移第七章楊園之道一句入第六章韻叶且意多聞人曰寺人之長者故曰孟其題亦曰伯聞迹曰楊園白楊之園也塜墓多植白楊陶氏荒草何茫茫白楊亦蕭蕭古人挽歌多以白楊為辭總聞曰勞人猶言為掃除之役在闒茸之中當是此人執役永巷之間故曰巷伯詩總聞卷十二
