body:
  text: 詩總聞卷十六宋王質撰周大雅文王一章文王在上於昭于天作此詩者大率以曉商人文王肇興商人雖久猶疑未純乎周凡此皆曉之辭周雖舊邦其命維新有周不顯帝命不時文王陟降在帝左右疑者曰周險逺衰微七百餘年之舊邦勢亦可知曉者曰邦雖舊而命則新將非舊比也疑者曰周不顯如此是必非天所命曉者曰周雖不顯但帝命未值其時然文王升降無不在帝之左右與帝相親如此帝深屬之時至則命集也二者商人之所共疑者也而周人以禮以迹曉之具見下章二章亹亹文王令聞不已陳錫哉周侯文王孫子文王孫子本支百世凡周之士不顯亦世曉者又曰以文王之聲名以文王之孫子以文王之士文王之聲名其永長如此終非不顯也而孫子與士亦永長如此皆非不顯者也三章世之不顯厥猶翼翼思皇多士生此王國王國克生維周之楨濟濟多士文王以寧曉者又曰汝且以為不顯何所思之士即生所治之國而皆效力幹事以寧王心豈得不顯也四章穆穆文王於緝熙敬止假哉天命有商孫子商之孫子其麗不億上帝既命侯于周服曉者又曰天之命周甚大商之孫子雖其數滋多奈何周既為天所命不若為侯於周之服內言土地已屬周也五章侯服于周天命靡常殷士膚敏祼將于京厥作祼將常服黼冔王之藎臣無念爾祖曉者又曰侯服于周疆非我之强臣爾也天命無常忽去彼而就此也以殷士而助周祭當為我忠臣無念爾先祖而動心也六章無念爾祖聿修厥德永言配命自求多福殷之未喪師克配上帝宜鑒于殷駿命不易曉者又曰不必念舊但自修德以合天所命自求其福母為他人輟禍也方殷之未喪爾祖自當配天今殷之不祚可以為鑒命不易可圖勿妄起念也七章命之不易無遏爾躬宣昭義問有虞殷自天上天之載無聲無臭儀刑文王萬邦作孚曉者又曰既知天命不易可圖自求多福無遏爾躬若妄圖則爾躬必絶汝但宣明此事以義而問人度商能從天再受命乎我所曉汝者皆天意也天意雖無聲臭可知汝但法效文王則取信天下汝斯能保福也聞音曰天鐵因切時上紙切右羽軌切國越逼切服蒲北切京居良切福筆力切易以致切躬姑𢎞切天鐵因切臭祛尤切孚房尤切聞訓曰陳錫猶敷錫也哉如字言天以此與周也聞用曰冔商冠也常服不禁祼祭則從周服言亦不絶其先也總聞曰商德在天下亦深三分有其二以服事商其二有則其一非有此其臣懷疑造變亦不少也惟九年大統未集豫小子其承厥志蓋天心未盡一則天命未甚純文王所以終身守節所謂至德也其餘見他詩參考益明此必文王既沒之後武王未定之時以稱諡知之大明一章明明在下赫赫在上天難忱斯不易維王明明文王也商之臣故曰在下赫赫武王也周之君故曰在上天雖難信其可信者不變此意而終歸于周王也亦皆曉之辭天位殷適使不挾四方天位雖在有商之嫡子言紂也而主令已不達於天下言人心已去天命將改也二章摰仲氏任自彼殷商來嫁于周曰嬪于京乃及王季維德之行勢國也仲女曰任氏自爾王之畿為我君之婦來助我之行德蓋天意託大任誕文王故逺使之至也此言文王之所由生也三章大任有身生此文王維此文王小心翼翼昭事上帝聿懷多福四章厥德不回以受方國天監在下有命既集文王初載天作之合五章在洽之陽在渭之涘文王嘉止大邦有子大邦有子俔天之妹文定厥祥親迎于渭洽渭之間親迎之地也郃陽渭城皆在長安顔氏郃水名也引此在洽之陽六章造舟為梁不顯其光有命自天命此文王于周于京纘女維莘長子維行篤生武王保右命爾燮伐大商造舟為梁今浮橋也親迎而得太姒既繼大任之事武王將生天命將近也此言武王之所由生也七章殷商之旅其㑹如林矢于牧野維豫侯興上帝臨女無二爾心言牧野之舉也此章以後多與牧誓武成同辭同意其㑹如林即其旅若林也矢於牧野即豫其誓也上帝臨女即天休震動用附我大邑周也維師尚父即既獲仁人也餘見下八章牧野洋洋檀車煌煌駟騵彭彭維師尚父時維鷹揚言尚父之助也鷹揚非尚父蓋六師衆士也書言虎貔熊羆此言鷹皆武猛貌也尚父毛氏以為可尚可父鄭氏以為吕望尊稱司馬氏太公望吕尚東海上人謂之尚者蓋其里號也尚與上同又西伯出獵至渭陽得尚與語曰吾先君太公望子久矣謂之太公望者蓋其稱號也西伯載與俱歸立為師謂之師者蓋其官號也周有師望敦師望簋官號與稱號兼之也此言師尚者官號與里號兼之也父者古尊稱也周有師寏父鼎師淮父彝師毛父敦古稱謂多如此劉氏别録師之尚之父之故曰師尚父毛氏亦此意也疑非向所言類魏晉之間淺儒之語也後世以為官稱大誤鄭氏頗近而不甚詳疑亦意為之辭而未嘗考正也凉彼武王肆伐大商㑹朝清明㑹朝清明即書言甲子昧爽也是日將旦乃牧野誓時亦牧野戰時當是才誓即戰尋書可見聞音曰上展羊切京居良切行户郎切身尸羊切福筆力切國越逼切集昨合切彭鋪郎切明謨郎切聞人曰古稱天子後遂衍出天孫古稱天妹後遂衍出月姊古人以謂莫尊于天男則曰天子女則曰天妹亦是寓言後遂飾為實語聞事曰凉爽也與㑹朝清明相應㑹戰之時也書亦言㑹總聞曰此詩先及王季次及大任先及文王次及大姒先及武王次及尚父始末集天命有天下者五人而已文武為本宗文王之身因王季大任而有武王之身因文王大姒而有伐商之功因武王尚父而有文王大明兩詩有周之發生作成皆具於此綿一章綿綿瓜瓞民之初生自土沮漆后稷封邰不窋鞠公劉四世而始居漆沮之間皆以農事為務自土當作白土地名在京室漆垣之間古公亶父陶復陶穴未有家室公劉之後慶節始國豳皇僕差弗毁隃公非髙圉亞圉公叔祖類八世而至古公亶父去豳國岐以陶為居未有家室也以陶為蓋於上曰復復覆也以陶為基於下曰穴穴竅也西人稍深者今尚如此陶猶今土墼也二章古公亶父來朝走馬率西水滸至于岐下爰及姜女聿來胥宇三章周原膴膴堇荼如飴爰始爰謀爰契我龜曰止曰時築室于兹得可宇之地也四章乃慰乃止乃左乃右乃疆乃理乃宣乃畝自西徂東周爰執事計功興役也五章乃召司空乃召司徒俾立室家其繩則直縮版以載作廟翼翼分官賦事也次第營之先作廟次臯門次應門次冢土是時已有此官俾舉此事氣象已改詩言與周先稱岐天作之詩可見六章救之陾陾度之薨薨築之登登削屢馮馮百堵皆興鼛鼓弗勝築城也廟方作城隨築廟在禮當先城在勢當先所以役人衆而趨役急也鼓督役也人力敏而鼓聲不能及也七章乃立臯門臯門有伉乃立應門應門將將乃立冢土戎醜攸行此古公亶父規模已成形勢已定也所謂太王肇基王跡八章肆不殄厥愠亦不隕厥問柞棫拔矣行道兊矣混夷駾矣維其喙矣此以下王季事也熏鬻之慍不除問亦不絶養其全力治其新造山林茂道路平夷人雖有馬徒有喙言馬瘠也西方以馬之肥瘠為國之强弱馬瘠言勢弱也所謂王季其勤王家九章虞芮質厥成文王蹶厥生豫曰有疏附豫曰有先後豫曰有奔走豫曰有禦侮此以下文王事也虞芮以事問文王如何而方能成言未决也文王以情動虞芮如此而可安生言已决也惟其義理明直所以人情畏服詩人以實推之有此四種之人分治四疆之事所以舉事中節此多士以寧也所謂文王克成厥勳誕膺天命以撫方夏大邦畏其力小邦懷其德如皇矣之密崇大邦畏力也如此詩之虞芮小邦懷德也武成言及王事唯此三人聞音曰馬滿補切下後五切謀謨柸切右羽軌切畝滿罪切家古胡切載節力切陾耳外切馮皮氷切勝書蒸切行户郎切將七羊切行户郎切拔蒲昧切駾徒對切後下五切聞訓曰土落護之謂之救讀作救繩引量之謂之度讀作鐸築自上築削自旁削下語皆築聲也屢頻也聞跡曰齊氏自土為杜自班氏杜水南入渭顔氏公劉來居杜陽漆沮之間皆引此詩虞在河中府虞鄉芮在陕州芮城或言復穴皆地名綿亦地名在天水所謂綿諸道是也地多美瓜未的審爾則綿綿皆當單讀總聞曰孟子嘗稱太王去留之迹甚詳滕文以築薛問以太王去豳居岐對又以事大不免問又以太王去豳居岐對然皆有餘說其初曰君如彼何哉强為善而已其次曰效死勿去請擇斯二者孟子之意世未有知者也避敵去國亡之道也而太王以興自西漸東據形勝以臨關輔其心不在乎避狄而在乎造邦也倘其才其德不如太王其勢其時不如太王則莫若自保孟子餘說露太王之微機雖然何露之有武王明言其肇基王跡顧苐弗深考耳棫朴一章芄芄棫朴薪之槱之棫白楥也朴槲􅈪也皆良木謂燔柴也濟濟辟王左右趣之二章濟濟辟王左右奉璋奉璋峩峩髦士攸宜皆佐王助祭之人也是時周已有祀天之禮三章淠彼涇舟蒸徒楫之周王于邁六師及之皆從王出征之人也是時周已有六師之制四章倬彼雲漢為章于天周王壽考遐不作人在天莫貴于雲漢之章瞻望文王如此願文王之壽無窮其逺不止於作成西人而已併能興起作成四方之人也故下言四方遐不如遐不黃耉之辭五章追琢其章金玉其相勉勉我王綱紀四方在地莫貴於金玉之相瞻望文王如此願文王强力不衰四方皆有綱紀維持也勉字從力即此聞音曰趣此苟切宜牛何切楫籍入切天鐵因切總聞曰前人多言文王受命稱王之事亦無定論凡稱文王者死而追述為詩者也凡言辟王我王或單稱王或以國繫王者生而即事為詩者也死稱諡生稱位可該凡稱文王者也此詩當是文王在位之時旱麓一章瞻彼旱麓榛楛濟濟豈弟君子干祿豈弟此言榛楛中言鳶魚後言柞棫又言葛藟皆以山林禽魚草木卜氣象也二章瑟彼玉瓚黃流在中豈弟君子福祿攸降三章鳶飛戾天魚躍于淵豈弟君子遐不作人其逺不止作人而又能作物也四章清酒既載騂牡既備以享以祀以介景福五章瑟彼柞棫民所燎矣豈弟君子神所勞矣六章莫莫葛藟施于條枚豈弟君子求福不回五章皆言豈弟君子言豈弟有以致此也一章不言豈弟君子享祀貴嚴肅不當樂易也聞音曰濟子禮切弟待禮切降乎功切天鐵因切淵一均切載節力切備蒲北切祀逸織切福筆力切燎力召切勞力報切聞跡曰毛氏旱山名不言何山今旱谷旱溪在上邽旱麓當近此地總聞曰子張學干祿非求人爵蓋求天爵也詩再言干祿一干祿豈弟以豈弟干之也一干祿百福以百順干之也孔子答干祿之問言寡尤行寡悔祿在其中矣其言干祿之意與詩頗同末章求福不回亦首章干祿之意也干字象形正則直生支字亦象形旁則橫出木幹為干枝為支術家言支干蓋此意也思齊一章思齊大任文王之母思媚周姜京室之婦大姒嗣徽音則百斯男當是文王已沒大姒無恙故曰寡妻因思大任周姜之不見而幸大姒之存也二章惠于宗公神罔時怨神罔時恫刑于寡妻至于兄弟以御于家邦因太姒而感文王也故歷道其美宗公自王季已上也事先事神治內治外如此也三章雍雍在宫肅肅在廟不顯亦臨無射亦保在宫在廟如此也臨如今言監臨言不敢肆也保如今言保任言不敢縱也四章肆戎疾不殄烈假不瑕不聞亦式不諫亦入待人如此也戎大也疾病也其病之大者不至于絶烈猛也假僞也其僞之猛者不發其疵不聞短于才者也亦欽其朴取其貞也不諌拙于言者也亦納其訥取其靜也五章肆成人有德小子有造古之人無斁止譽髦斯士古人謂昔文王也至今無有厭者今有名有才之士皆文王所成之人所造之子也誰不知所自來安得更復有厭聞音曰母莫後切婦房缶切男尼心切邦卜工切瑕從假以假取聲叶殄德斁相叶末句單結聞跡曰京室屬上郡太姜配太王當在此地聞事曰太姒雖多男武王周公及管叔蔡叔霍叔及其羣弟固衆亦未有及百者也詩人雖羡美太夸辭當是結太任太姜太姒三人而總之以百男也總聞曰此思真思凡思有在上者此之思齊太任思媚周姜思也思皇多祜辭也有在中者願言思子思也綏我思成辭也有在下者永言孝思思也不可射思辭也大率在下者多辭也太任太姜言思而太姒不言思明存沒有異也皇矣一章皇矣上帝臨下有赫監觀四方求民之莫維此二國其政不獲維彼四國爰究爰度毛氏二國殷夏四國四方固無謂鄭氏二國殷崇四國密阮徂共尋詩止密與崇蓋阮共等受其侵也徂又似非名二國恐是密崇四國恐是邰豳岐豐密崇雖盛而其政不得我意於邰豳岐豐察之蓋可付者也上帝耆之憎其式廓乃眷西顧此維與宅言帝於密崇亦監觀多年終憎其所為而遂命周掃蕩也周漸遷漸大皆常垂顧而使之定居也二章作之屏之其菑其翳修之平之其灌其栵啓之辟之其柳其椐攘之剔之其檿其柘帝遷明德串夷載路天立厥配受命既固言帝轉人心就明德平時荒僻之地一旦為串習夷平之路外事既定又立配以為助內事又成而天命始固也此謂太王太姜也三章帝省其山柞棫斯拔松柏斯兊帝作邦作對自大伯王季維此王季因心則友則友其兄則篤其慶載錫之光受祿無喪奄有四方自去豳遷岐以來至此已久柞棫松柏至難長之木今已如此他當稱是既成其邦又成其對謂王季與大王相對也或說大伯王季為對此止謂造周主事之人大伯與王季作引辭無與于王業也四章維此王季帝度其心貊其德音其德克明克明克類克長克君王此大邦克順克比比于文王其德靡悔既受帝祉施于孫子言帝度王季其心如此和正凡善必能可比文王而無悔言無慚也受帝祉而延孫子大率自王季發之五章帝謂文王無然畔援無然歆羡誕先登于岸密人不恭敢距大邦侵阮徂共王赫斯怒爰整其旅以按徂旅以篤周祜以對于天下前二章言天以此事付周其端始發如此次章言天以此人承周其跡漸著如此至此以某事訓文王以某事敕文王大率使太伯當立而不立王季不當立而立意蓋在此也經世甲子伐崇乙丑伐密此乃密為先崇居次恐經世誤密在安定郡顔氏引此詩崇在京兆密於周京差逺崇於周京差近據司馬氏崇侯虎與商紂昵厚當是其勢有未易動者故先密後崇司馬氏亦受西北之明年伐犬戎又明年伐密須又明年敗耆國司馬氏所說耆即黎徐氏耆一作阮又明年伐邗又明年伐崇之未幾而西伯即殁密崇先後與詩頗相符不知邵氏何所據而先崇後密也六章依其在京侵自阮疆陟我髙岡無矢我陵我陵我阿無飲我泉我泉我池度其鮮原居岐之陽在渭之將萬邦之方下民之王伐密之事既成則王業已就也依在酒泉郡京在上郡阮在渭南縣共在共城縣旅在渭城縣蓋密所擾亦廣豈得不先除之也詩連句有兩旅毛氏前旅師也後旅地名也鄭氏不以旅為國而乃以徂為國恐毛氏良是七章帝謂文王豫懷明德不大聲以色不長夏以革不識不知順帝之則帝謂文王詢爾仇方同爾兄弟以爾鉤援與爾臨衝以伐崇墉崇在京兆鄠縣見春秋晉趙穿帥師伐崇當是其國雖受伐其後元不絶也皆以墉為辭亦當是其城為最恐以城取國名良耜其崇如墉蓋崇墉四方所知常談所傳也八章臨衝間間崇墉言言執訊連連攸馘安安是類是禡是致是附四方以無侮臨衝茀茀崇墉仡仡是伐是肆是絶是忽四方以無拂伐崇之事又成則天下始皆定也此詩其初引辭皆專為密崇二事尋詩伐崇頗難於伐密三言崇墉三言臨衝所以同兄弟以為黨助不可獨舉也伐密言萬邦之方有所倣也下民之王有所往也伐崇言四方無侮四方無拂其勢又重於前商周興替之形于密崇之舉可見也聞音曰赫黑各切獲黃郭切度待洛切宅達各切屏平相切平聲辟剔亦叶仄聲不獨下句叶也椐紀庶切柘都故切拔蒲昧切友羽軌切兄虛王切慶墟羊切比必里切悔虎猥切子奬禮切援胡喚切岸魚戰切邦卜工切共居容切怒暖五切祜侯古切下候五切京居良切池徒何切革訖力切間胡田切安於連切禡滿補切以馬取聲聞事曰是類是禡裒山川之神而祭之禡野祭也是致是附合邦國之旁域而來之附附庸也聞跡曰詩稱周家多以山為辭邰豳多曠土少名山至岐山則過於梁山至南山則又大於岐山此所省之山止謂岐山也聞人曰左氏子魚以為文王聞崇德亂而伐之軍三旬而不降退修教而復伐之因壘而降尋詩用力亦不為少子魚殆飾辭總聞曰自四章而下三言帝謂伐密稱帝謂者一其伐之也先稱文王之德無畔援歆羡而先有意於濟民此伐密之辭端也伐崇稱帝謂者再其伐之也又先稱文王之德不以色不以革不以知識唯順帝以為法此伐崇之辭端也又次稱詢爾同爾以爾與爾皆稱帝稱爾以帝命將之其辭又詳於前大率詩人主意惟言文王無容心皆奉天爾靈臺一章經始靈臺經之營之庶民攻之不日成之二章經始勿亟庶民子來王在靈囿麀鹿攸伏三章麀鹿濯濯白鳥翯翯王在靈沼於牣魚躍臺也囿也沼也辟也雍也皆取美稱也四章虡業維樅賁鼓維鏞於論鼓鐘於樂辟雍五章於論鼓鐘於樂辟雍鼉鼓逄逄矇瞍奏公周之先世武王未有天下之前皆稱公如公劉古公公季至伐紂開周始追為王然自太王以上無見特后稷稱先王亦無號諡也奏公謂奏于先世諸公也古者凡飲食必祭先祭先必有尸聞音曰來六直切伏筆直切逄滿紅切聞跡曰左氏秦獲晉侯舍諸靈臺杜氏在京兆鄠縣今在涇州靈臺縣而鄠無之未知孰是又按宰辟父敦王在辟宫冊周尨敦王在雍位格廟冊尨􅭻敦王格于太室冊􅭻􅌏敦王在周邵宫格于宣榭冊􅌏亦謂之師保父宫牧敦在師保父宫格大室冊牧此總而謂之學其間各有朝廟别宫别位惟王意所欲往則即其所發冊亦無定所也此間不獨發冊發冊其一事爾辟自辟雍自雍又自不同所也總聞曰此規模制度不若綿差詳蓋大勢已定然後及遊觀之所曰靈臺靈囿靈沼是也然後及㑹集之所辟雍是也後世言靈臺過當以為靈臺在太廟之中雍之靈沼謂之辟雍又為明堂外水謂之辟雍殊不及靈囿非不欲及附㑹不能入也識者更詳下武一章下武維周世有哲王武如堂上接武堂下布武之武謂移足躡跡也周之纍世皆如人躡武所謂世有哲王三后在天王配于京此謂成王也不言諡專謂成王也言王季文王武王三后成王能配之也二章王配于京世德作求永言配命成王之孚此以下謂康王也稱諡嗣子稱厥考也自此皆稱永言或言配命合成王之遺訓也或言孝思順成王之遺志也三章成王之孚下土之式永言孝思孝思維則四章媚兹一人應侯順德永言孝思昭哉嗣服一人謂成王也言康王此一人有無窮之思也五章昭兹來許繩其祖武於萬斯年受天之祜祖謂武王也言康王明其所從來而能不絶武王之跡故永久受福祿也兹許皆辭也六章受天之祜四方來賀於萬斯年不遐有佐有佐謂召公畢公之流也凡所以受福甚逺者以在近有此數人也康王之誥王出在應門之內太保率西方諸侯入應門左畢公率東方諸侯入應門右畢命三后協心同底於道道洽政治澤潤生民四夷左袵罔不咸賴豫小子永膺多福尋書與詩相應聞音曰京居良切孚房尤切服蒲北切祜侯古切總聞曰五章又言繩其祖武難以下武為繼以祖武為迹前武言下後武言繩不須强說自明文王有聲一章文王有聲遹駿有聲遹求厥寧遹觀厥成文王蒸哉遹述也駿大也所述皆太王王季之大事大率周家王業皆始于太王王季而成于文王武王二章文王受命有此武功既伐于崇作邑于豐文王蒸哉三章築城伊淢作豐伊匹匪棘其欲遹追來孝王后蒸哉自己邜即諸侯位癸亥受西伯命得四十五年次年作豐是年伐崇次年伐密次年伐黎次年伐邢所以如此之急非逞私欲蓋述先志也四章王公伊濯維豐之垣四方攸同王后維翰王后蒸哉崇在東密在西黎邢在北江漢在南各自此以往皆攸同也三分天下有其二獨自北差未純爾五章豐水東注維禹之績四方攸同皇王維辟皇王蒸哉此詩言四方攸同者二前文王之詩曰四方攸同又曰王后維翰如木有幹尚可㳂而登也後武王之詩亦曰四方攸同又曰皇王維辟如屋有壁不可㳂而升也文武之氣象可見翰幹也辟猶壁也通用六章鎬京辟雍自西自東自南自北無思不服皇王蒸哉七章考卜維王宅是鎬京維龜正之武王成之武王蒸哉今京兆長安縣西北靈臺鄉在灃水上即豐是也昆明池北即鎬是也在長安相去不數十里之間而鎬稍東聖智覽觀如此今考長安圖自長安稍東則土地形勢沃衍宏壯秦又稍東而少南漢承秦舊隋又稍東而多南唐仍隋舊近南山則其勢愈盛可見文王武王之意矣秦隋之勢夫何遜于古惟其所以鍾之者非正氣而將之者非嘉澤故不純粹而堅凝也八章豐水有芑武王豈不仕詒厥孫謀以燕翼子武王蒸哉凡為國者有以詒孫即有以燕子也逺尚如此近者可知翼子如鳥有翼附我身而生者也厥考翼翼自內舒者也民獻有十夫豫翼翼自外助者也訓敬恐非翼日有今日則有明日亦翼子之義也聞音曰淢恐域切孝許六切記孝者畜也如禮者履也德者得也古多如此雖孟子亦曰仁者人也故當以義取聲翰胡干切服蒲北切京居良切正諸盈切仕鉏里切子奬禮切聞物曰芑是陸禾采芑薄言采芑于彼新田于此菑畝生民是穫是畝恆之穈芑即此芑也毛氏鄭氏皆以為草又不言何草蓋謂豐人灌溉田畝而生芑禾言其富也亦如涇水一石其泥數斗且灌且溉長我禾黍總聞曰舊移武成次第而武成一篇遂整今移文王有聲次第而文王有聲一詩亦頗明以皇王二章置在末章之後不用勞心訓釋用力差次而周家始末之跡昭然可見也詩總聞卷十六
