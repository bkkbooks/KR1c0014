body:
  text: 詩總聞卷一上宋王質撰南聞南一南樂歌名也見詩以雅以南見禮胥鼓南鄭氏以為西南夷之樂又以為南夷之樂見春秋傳舞象箾南籥杜氏以為文王之樂其説不倫大要樂歌名也禮舜作五絃之琴以歌南風夔始制樂以賞諸侯南即詩之南也風即詩之風也舜始見之於琴而夔始播之於樂後世誤認其意遂以為盛夏之南風今所傳南風之歌耑主於此初一篇與第二篇皆非上古之制作其辭止類秦漢而下者如云案圖觀䜟在古固未有而秦漢亦未聞也説詩乃轉為自北而南與南風之誤皆同孔子曰人而不為周南召南其猶正牆面而立也歟謂此歌之聲也季子曰美哉始基之矣猶未也然勤而不怨矣其聲與其辭雜言之也毛氏明見詩禮冇南樂之名而必循司馬氏南風之誤當是相承其來已乆亦非獨毛氏之過而況鄭氏又相去愈逺也聞南二分陜世以為司馬氏之創説而不知其來已乆不問他見獨以書禮推之君奭召公為保周公為師相成王為左右猶曰未明可也禮武五成而分周公左召公右亦曰未明可也康王之誥大保率西方諸侯入應門左畢公率東方諸侯入應門右當是周公已沒畢公代其故任畢命所謂今予命爾以周公之事也周召官也自二公為之後世相承不改桓十八年周公黒肩被殺于辛伯成十二年周公楚出奔於晉文四年襄王使召公過賀秦穆公司馬氏所謂周公召公行政號曰共和至秦漢為左内史左馮翊右内史右扶風葢其遺制此詩當是此也所採古彛器有周邵宫亦謂之師保宫衛武公繼治西偏東偏亦見諸師􅼩敦葢周召之任也度其時在遷洛之後此官猶存其宫亦有大室宣榭與宗廟周制可謂重矣此事甚明而後有聖賢淺深之别后妃尊卑之差皆强為辭也聞南三南大夏也正午也故字作午亦作丙亦作丁南之取名以此禮王夏肆夏昭夏納夏章夏齊夏族夏裓夏驁夏凡九後代祀圓丘降神奏昭夏皇帝將入門奏皇夏爼入奠玉帛竝奏肆夏皇帝升壇奏皇夏登歌飲福奏皇夏皇帝就望燎位還便坐竝奏皇夏又加諴夏乃不用其他諸夏皆南聲也頌亦間用此音故時邁曰肆于時夏思文曰陳常于時夏他詩用與不用固未可知然以時邁思文推之大略可見四時各以聲之舒歛為氣之消長春先合後開者也太𤣥之罔亦然夏全開者也太𤣥之直亦然秋先開後合者也太𤣥之酋亦然冬全合者也太𤣥之䝉亦然今君子之揖全開小人之揖全合中人之揖雖聲開而節短此作樂所以有貴于南取純陽也今人取向不敢正取于午必帶他方取律不敢正取于黄鐘必雜他律取音不敢正取于正宫必雜他音南者天之尊神出入之地也比者天之殺神出入之地也處天地之間居隂陽之内者避之所以自古南名不多見後世南聲亦罕傳雖周召二壤之樂皆為南然東西二伯之域各分次周則東南召則西南葢文武履位則居正而周召分疆則析畛也雖然非周召亦豈足以當之後周召之官雖存東西之封各異然其樂寖以銷㣲而隕亡大聖之君臣不作亞聖之輔佐不生天固令其不傳亦無足恠後諸夏間傳餘夏多絶今大樂亦未有專陽而能成聲者也不知古之造音何得度越智力之表如此非天孰能啟之非聖孰能作之宜乎繼者之難也欽定四庫全書詩總聞卷一宋王質撰周南闗雎一章關闗雎鳩在河之洲窈窕淑女君子好逑二章參差荇菜左右流之窈窕淑女寤寐求之處貴適水采荇治葅品供祀事後世雖卑者亦所不屑古人勤儉習熟以為當然也三章求之不得寤寐思服悠哉悠哉輾轉反側西方水急荇類皆罕生故或難求南方多有易致四章參差荇菜左右采之窈窕淑女琴瑟友之五章參差荇菜左右芼之窈窕淑女鐘鼓樂之祀事辦則樂事舉勞佚各適其度故人無厭心也聞音曰吳氏服蒲北切側莊力切采此禮切友羽軌切樂五教切今服房六切詩十有六無用此切友云九切詩十有一亦無用此切者今從吳氏聞訓曰流如本意水東西南北皆為流言取之無方也與左右采之相應聞物曰陸氏雎鳩鶚也亦鵰類也鵰鶚性猛摰所謂鷙鳥不雙又鷙鳥累百不如一鶚非匹鳥也左氏雎鳩氏司馬者也杜氏王雎也許氏亦止言王雎皆不及鵰鶚徐氏常在河洲之上為儔偶鵰鶚夜則多棲深林日則飛髙空非慕水者也郭氏好在江渚上山邊捕魚鵰鶚食飛類非啖魚者也左氏旣取類為司馬固是法制但鵰鶚不應取鳩名禮中春鷹化為鳩恐是未化以前為鷹旣化之後為鳩俗呼鶚為鶚鷹鄭氏以鳩為布穀布穀柔禽全無鷙性其聲闗闗則相宜鵰鶚之聲清烈壯厲與和鳴似不相應所謂鵰鶚恐自難從布穀似可用而鄭氏以為鳲鳩不應二南皆同一物起興然則雎鳩定果何鳩也舊以雎為鳻鳩従分言有行列也又為􅝣鳩言似征役也又為䳕鳩言有信義也又為䳫鳩言應北方癸水也皆與司馬相符異境固不能深知度少皥所以為司馬者特以有法而孔子所以首二南者亦以其有法周南以有法之禽起興召南以善養之禽起興此鳲鳩所以為布穀也又為摶黍俗呼郭翁郭婆翁婆則生家養衆者故従尸并載于此識者更詳總聞曰孔子于闗雎兩及之一曰闗雎樂而不淫哀而不傷此聲也後世以淑女為樂進賢為不淫窈窕為哀思賢才為不傷毛氏知其不可改哀為衷審爾則孔子之意何在今于此詩従容諷詠則孔子之意略見況得其聲耶一曰師摯之始闗雎之亂洋洋乎盈耳哉亂卒章也今闗雎無卒章後世所述亂皆在正辭之後今欲以琴瑟鐘鼓為亂考辭又不倫其亂舊亡至師摯始得而孔子不以入正辭或入正辭而後世不解所謂洋洋盈耳者一倡三歎之音皆在亂也惜無知之者葛覃一章葛之覃兮施于中谷維葉萋萋黄鳥于飛集于灌木其鳴喈喈人心舒適則鳥聲亦覺娟美當是采葛之時所見二章葛之覃兮施于中谷維葉莫莫是刈是濩為絺為綌服之無斁處貴適谷采葛隨時變趣婦功其勤苦如此人情歸寧當有所整飾乃簡樸如此可想見古風也三章言告師氏言告言歸薄汚我私薄澣我衣害澣害否歸寧父母歸寧告女師女師告君所厯不可越也私衣不必分燕服禮服但刈濩煩猥則不無少汚汚則不無少濯聞音曰喈居西切斁弋灼切母莫後切聞物曰黄鳥黄栗留也俗稱金衣公子故又曰倉庚摶黍自是郭公毛氏恐誤聞跡曰谷讀作浴山深曲為谷與綌字所從意同聞用曰毛氏舊説精者為絺麤者為綌恐不然當是稀者為絺密者為綌觀所従可見字莫不有理或以近世過當者一切廢之不可總聞曰説詩當即辭求事即事求意不必縦横曼衍若爾將何時而窮一若稽古至三萬言無足訝也近有講此詩者縦言及以妾為妻之事自譽以為善諷妻妾古有明訓觸事觸辭及之因以感動所謂辭順而意篤者也遺本㫖而生他辭竊取其美以覆芘其不知此談經之大病也時人以講葛覃為講葛藤雖戲語亦切中識者更詳卷耳一章采采卷耳不盈頃筐嗟我懐人寘彼周行内職如外庭皆為周行嬪御祝史之屬將歸寧而有懐故勞苦之使各安其位以待其歸二章陟彼崔嵬我馬虺隤我姑酌彼金罍維以不永懐三章陟彼髙岡我馬𤣥黄我姑酌彼兕觥維以不永傷疲頓惟酒能紓之得酒則銷憂姑解懐人之心凡言不者皆否不顯不時不承之類是也四章陟彼砠矣我馬瘏矣我僕痡矣云何吁矣云何有無可奈何之意處貴欲紓勞亦易而付之無可奈何法度檢抑也聞音曰行户郎切懐胡隈切觥姑黄切以兕角為酒器曰兕觥聞物曰本草卷耳益氣輕身尤能辟瘟癘方將歸寧以備道路早暮之用杜氏所謂登牀半生熟下筯還小益加點𤓰薤間依稀橘奴跡亦可葅也總聞曰處貴歸寧其簡薄如此度古者奉極尊未必如後世奉甚卑大率内宫之政令雖至微外庭皆有掌法度相維故上下不越節儉之風乆而習貫自然也樛木一章南有樛木葛藟纍之樂只君子福履綏之木曲易引蔓人卑易引福大率禍福以氣相感福之氣與順相隨禍之氣與逆相恊二章南有樛木葛藟荒之樂只君子福履將之三章南有樛木葛藟縈之樂只君子福履成之聞訓曰履足所依也福隨歩而有故曰福履以履為禄苟與福相類恐非今従丁氏總聞曰山水皆起西趣南故南方草木鳥獸蟲魚最繁詩人舉此類多稱南有螽斯一章螽斯羽詵詵兮宜爾子孫振振兮二章螽斯羽薨薨兮宜爾子孫繩繩兮三章螽斯羽揖揖兮宜爾子孫蟄蟄兮聞物曰毛氏蚣蝑也説文蝗也爾雅醜奮也無斯字此斯字在下七月斯字在上恐是辭今從許氏蝗子最繁其羽亦有聲亦従郭氏總聞曰鄭氏以謂物有隂陽情慾無不妬忌惟蚣蝑皆得受氣而生異境難察其深情然智者能知又説蚣蝑育子皆八十一叶九九之數亦待智者不能信亦不敢信也桃夭一章桃之夭夭灼灼其華之子于歸宜其室家二章桃之夭夭有蕡其實之子于歸宜其家室三章桃之夭夭其葉蓁蓁之子于歸宜其家人詩舉物多花而後實實而後葉不然亦以豐約别深淺不惟記時亦句法當爾聞音曰華方無切家古胡切古文多用此為叶然不必拘定律苟可叶即已古人聲韻後世亦難盡考也今如見音總聞曰古者王制定民志一仲春㑹男女非時有禁是時庶物各隨形氣聲意相合惟虎交以仲冬于類為異至漢婚姻已乆不拘此然刑賞猶以秋冬春夏其後皆不存矣兔罝一章肅肅兔罝椓之丁丁赳赳武夫公侯干城二章肅肅兔罝施于中逵赳赳武夫公侯好仇好仇與闗雎好逑同言武夫能扞外以䕶内也三章肅肅兔罝施于中林赳赳武夫公侯腹心以詭致物宜静欲物不驚聞音曰仇渠之切或作渠尤切與關雎同叶則逵亦當作渠尤切然音不同意則一不必渠尤亦可聞用曰罝網也今俗呼罝網聞字曰陸氏作菟又作兔今皆用兔於菟虎也言取虎之具取虎不一用穽用矢用繩見杜氏所謂猛虎慿其威往往連急縛雷吼徒咆哮枝撑已在脚今荆峽間或用此未見用罝者今従見字總聞曰西北地平曠多用鷹犬取兔東南山深阻多用罝東南自商至周常為中國之患當文王之時江漢雖定然淮夷未甚盡服當是此地有覩物興感者尋詩可見芣苢一章采采芣苢薄言采之采采芣苢薄言有之二章采采芣苢薄言掇之采采芣苢薄言捋之三章采采芣苢薄言袺之采采芣苢薄言襭之芣苢旁近皆有車前草也與卷耳同不必幽逺故衣袵可羅致葢婦人及時采藥以為療疾之儲者也初茁亦可啖聞音曰采此禮切有羽軌切亦作云九切詩中無用云九與關雎友同今從吳氏聞訓曰薄辭也總聞曰此草至滑利在婦人則下血非宜子之物在男子則强隂益精令人有子非婦人所當屬意者也然良効甚博男女可通用子息葢天數非可以藥物之術致之陶氏亦嘗致疑吾儒安可不精思審是無負古也漢廣一章南有喬木不可休息漢有游女不可求思漢之廣矣不可泳思江之永矣不可方思漢出興元府西縣江出蜀州江源縣至今漢陽乃合此詩當在夏口附近今傳莫愁曲在石城今郢州也襄陽樂在樊城今鄧州也襄陽樂襄陽曲雍州曲襄陽踏銅蹄皆曰大堤北渚大堤在襄陽之西北渚在襄陽之北三洲曲采桑度皆江漢之間游女事也當是相傳江漢故事以為美談二章翹翹錯薪言刈其楚之子于歸言秣其馬漢之廣矣不可泳思江之永矣不可方思三章翹翹錯薪言刈其蔞之子于歸言秣其駒漢之廣矣不可泳思江之永矣不可方思秣馬秣駒皆游子欲求游女之意卒有所抑畏而止以江漢遏情言不可犯也陶氏所謂激清音以感余願接膝以交言欲自徃以結誓懼冒禮之為諐聞音曰廣古曠切泳于誑切永弋亮切方甫妄切馬滿補切總聞曰息當作思叶韻皆在上休叶求廣叶泳夫又何疑陸氏言此以意改此風自昔有之承誤襲訛以盲聾為長厚然易俶載作熾葘可以發笑反俯首呿口從之所謂眞贋虚的彼竟莫知其如何也識者更詳汝墳一章遵彼汝墳伐其條枚未見君子惄如調飢二章遵彼汝墳伐其條肄旣見君子不我遐棄三章魴魚赬尾王室如燬雖則如燬父母孔邇王室在衛近汝雖可畏不可徃然以近父母為懐亦差慰也此徴役渡河趣都者人情所不欲其妻勉以君民之分父母之情蓋賢婦人也聞音曰肄當作隷郎計切説文附著也賤也枚離幹而上出者可以枚數隷附幹而下生者故賤如僕隷也肄勞也無謂聞字曰調或作輖輖重載也可從聞物曰魚勞則尾赤人勞則髪白雖見養生之經然其説乃因此而衍鯉魚多赬尾豈此魚皆勞而他魚不然也荆峽間人云魚血入尾者甘聞跡曰爾雅汝有濆此為長大防之説可置若爾墳當作濆總聞曰魴魚婦人勞送君子之物魚之美者也當是已歸復行故旣見而又有此辭麟之趾一章麟之趾振振公子于嗟麟兮公子生公室而出為人婦者也古謂女為子二章麟之定振振公姓于嗟麟兮三章麟之角振振公族于嗟麟兮聞音曰角虛谷切聞物曰麟上畜也性厚不踐生草不食生物治世多游于郊當是此時見此物故發為此辭詩人未有無見而强起興者今人不復見麟遂謂古人搜物取象此以己心度古心也總聞曰婦人多忮忍葢稟隂也寺人之性亦同故詩言婦寺而能懐慈心非聖人何以化之召南鵲巢一章維鵲有巢維鳩居之營家男子之事守家婦人之事後世隂陽易位男女亂職相承責婦人以幹家能則以為譽不能則以為毁至于求賢審官以臣下之勤勞有進賢之志傳為美談可以太息也之子于歸百兩御之二章維鵲有巢維鳩方之之子于歸百兩將之三章維鵲有巢維鳩盈之之子于歸百兩成之聞音曰居姬御切御魚據切陸氏音迓迎也王氏音馭侍也侍意更多今従王氏聞物曰鵲巢外圓中深頗縝密如小甕鳩巢外平中淺如盤極疎拙未聞其居鵲巢當是詩人偶見鵲有空巢而鳩來居後人附㑹必欲以為常然此談詩之病也總聞曰鳥巢有極工者黄頭白練精細過于鵲巢而詩多稱之世傳鵲結巢取木杪之枝不取墮地者多潔一也傳其枝而受卵雌雄共接者乃用不淫二也開户向天而背太歳有識三也歳多風則去巢旁之危枝先知四也巢中有横木虛度如梁雄者踞之有分五也以比則積善之家必有餘慶者也嚮背之事見淮南子見博物志他皆世所傅云采蘩一章于以采蘩于沼于沚于以用之公侯之事二章于以采蘩于澗之中于以用之公侯之宫三章被之僮僮夙夜在公被之祁祁薄言還歸在公執公事之時故竦敬僮僮竦敬也還歸歸私室之時故舒遲祁祁舒遲也大率公事畢則私樂繼之此所以相濟而為和且能乆也與闗雎末章同意總聞曰采蘋南澗則此是北澗也當是北澗近故與沼沚相連沼沚池上渚也南澗逺故與行潦相接行潦猛水溱集者也亦見采蘋草蟲一章喓喓草蟲趯趯阜螽草蟲小蚱蜢阜螽大䗥也己與夫相别不得共處如蟲得地得時各有喜躍之狀也未見君子憂心忡忡亦旣見止亦旣覯止我心則降二章陟彼南山言采其蕨未見君子憂心惙惙亦旣見止亦旣覯止我心則説三章陟彼南山言采其薇未見君子我心傷悲亦旣見止亦旣覯止我心則夷陟南山望其夫也陟北山亦望其夫也采蕨采薇以自飽而有所待也鄭氏以為婦人適人未見謂在途時旣見謂同牢時旣覯已昏也覯為昏不若為遇意正而情深未適人之婦人不當有此念聞音曰降乎攻切總聞曰古風俗簡滋味薄筋力勞采蕨采薇非耑寄興也草木之實飲食所資雖婦人皆然奚況男子習熟以為當然爾采蘋一章于以采蘋南澗之濵于以采藻于彼行潦二章于以盛之維筐及筥于以湘之維錡及釡三章于以奠之宗室牖下誰其尸之有齊季女牖下非在堂之祭季女非在家之主故采蘩采蘋同為適澗而此又于彼行潦差為艱也盛夏猛漲之水曰行潦亦曰黄潦人多畏之言卑者任勞聞音曰潦魯皓切下後五切亦亥雅切詩十有七惟擊鼓亥雅餘皆後五總聞曰祭祀之菹少用陸菜多用水蔬陸菜非糞壤不能腴茂而水草則託根于水至潔故饋食多用陸祭食多用水古祭六牲大牲牛馬羊小牲豖犬雞皆取血故牲貴熏六清冬三月三酒所謂清厚者也夏三月四飲所謂清薄者也皆用清水白麵為麯故酒貴清六菹蘋蘩藻荇芹苔皆取水産故菹貴潔其他饋食不耑此法菹字従草従水可見陸菜為葅苴肉苴為蕰甘棠一章蔽芾甘棠勿剪勿伐召伯所茇二章蔽芾甘棠勿翦勿敗召伯所憇三章蔽芾甘棠勿翦勿拜召伯所説聞音曰伐扶廢切茇蒲昧切敗蒲昧切拜變制切今人稱跪猶有此音説始鋭切聞字曰説或為税止也詩税意多通用説字聞物曰棠梨樹稍大葉亦大且密可以庇日蔽芾隂貎不必言小棠其實甚細今呼甘棠梨相承舊語也聞用曰周禮中夏教茇舎鄭氏茇讀如菜沛之沛茇舎草止之也軍有草止之法後世漸侈軍行有氊帳毳帳之屬古者茇舎之法不知如何當必輕整牢密易辦且易挈總聞曰召伯内則為保外則分陜不必聽訟甘棠之下當是出行偶爾憩息覩景懐人後世遂指為佳所古今如此甚多行露一章厭浥行露豈不夙夜謂行多露露仲春始成昏姻之時也不相諧而有争故著其辭此當是男家趣女家而女家託故不徃以為豈不欲早夜赴期定約然露不可行也易林所謂厭浥晨夜道多湛露衣濡𥜗重不可歩正用此意此章猶婉下章甚厲二章誰謂雀無角何以穿我屋誰謂女無家何以速我獄雖速我獄室家不足三章誰謂鼠無牙何以穿我墉誰謂女無家何以速我訟雖速我訟亦不女従此男家欲合女家欲判也比類以雀以鼠加以穿屋穿墉之名甚不欲媒之至也自決以獄以訟終不願曲徇甚不欲媒之行也當是男家之辭稍堅故女家之辭亦峻聞音曰夜羊茹切訟才容切聞句曰首章或上下中間或兩句三句必有所闕不爾亦必闕一句葢文勢未能入雀鼠之辭總聞曰暴男侵貞女亂世容或有之而召公之分壤被美教成雅俗不應如此女固可尚男為何人豈文王之化獨及女而不及男耶羔羊一章羔羊之皮素絲五紽退食自公委蛇委蛇素絲為飾尚朴素也二章羔羊之革素絲五緎委蛇委蛇自公退食三章羔羊之縫素絲五總委蛇委蛇退食自公聞音曰皮蒲禾切蛇唐何切革訖力切總字公切聞字曰委當作蜲水精也蛇蠖也其行皆紆曲若君子偕老委委佗佗則當為委委與佗同皆行貎易林長尾蜲蛇畫地為河用此蜲總聞曰婦人奉君子以朴素之衣亦必責君子以朴素之行公退夫婦始燕見羔裘治之于手不常覩之于目非退食來歸之時無以細推其縫數也此言従容欵曲之意也殷其靁一章殷其靁在南山之陽何斯違斯莫敢或遑振振君子歸哉歸哉二章殷其靁在南山之側何斯違斯莫敢遑息振振君子歸哉歸哉三章殷其靁在南山之下何斯違斯莫敢遑處振振君子歸哉歸哉君子行役當在南故屬耳多在南也聞音曰側莊力切下後五切總聞曰君子出行當是雷收聲之後聞雷發聲則覺氣變候移念君子之歸也或何時與何日去此地所厯己多而不能盡省也猶勉之以勤而不勸之以媮然夫婦之情終不可廢也摽有梅一章摽有梅其實七兮求我庶士迨其吉兮二章摽有梅其實三兮求我庶士迨其今兮三章摽有梅頃筐塈之求我庶士迨其謂之聞音曰三疏簮切古三皆作參參與叄同省文作三總聞曰古仲春㑹男女仲春為正時季春為末時仲夏為過時然節氣猶冇渉四月而屬三月者亦為春也梅實初存者十之七其次所存者十之三至取以筐筥則甚熟否則委地盡也其在春夏之交故其辭逾進逾急也當是婦人無依者亟欲及時失時則又經期也小星一章嘒彼小星三五在東肅肅宵征夙夜在公寔命不同星皆經星也心三星在東栁五星在東南君子以王事行役婦人送之指星言入夜也二章嘒彼小星維參與昴參昴皆在西也肅肅宵征抱衾與裯寔命不猶抱衾與裯言聞命即發不及治裝也聞音曰昴力求切古昴皆作留聞訓曰猶亦同也總聞曰宵征言夜行在公言公事非賤妾進御之辭當是婦人送君子以夜而行事急則人勞稱命言不若安處者各有分也大率昔人至無可奈何不得已者歸之于命孔子所謂不知命無以為君子也江有汜一章江有汜之子歸婦人謂嫁曰歸當是循江或航江所歸之路也不我以不我以其後也悔二章江有渚之子歸不我與不我與其後也處三章江有沱之子歸不我過不我過其嘯也歌悔悔不以我同也處處無與同也嘯歌所謂嘻笑之怒長歌之哀觖望之辭也聞音曰汜養里切過古禾切聞跡曰在北多曰河在南多曰江不特正江河也總聞曰婦人在女家必有乆相諳者適夫家必有願相従者而嫁者違之故在家之女役有望不悦之心二者皆是也違者不欲以其家昵厚者俱行望者不意其疎情相棄也野有死麕一章野有死麕白茅包之有女懷春吉士誘之女至春而思有所歸吉士以禮通情而思有所耦人道之常或以懐春為淫誘為詭若爾安得為吉士吉士所求必貞女下所謂如玉也二章林有樸􅈪野有死鹿白茅純束有女如玉三章舒而脱脱兮無感我帨兮無使厖也吠媒妁之來尚欲使舒徐無諠動貞女可知當是在野而又貧者無羔雁幣帛以將意取獸于野包物以茅䕶門有犬皆鄉落氣象也聞音曰包補苟切脱勑外切總聞曰尋詩時亦正禮亦正男女俱無可議者舊説以為不由媒妁誘道也所謂道者即媒妁也以為不以雁幣雖定禮有成式亦當隨家豐儉夫禮惟其稱而已此即禮也文王之化何厚薄于男女貞女不受陵于暴男固為美也暴男敢肆陵于貞女抑何暴耶此與序行露之詩皆所不曉何彼穠矣一章何彼穠矣唐棣之華唐棣郁李與桃李其聞皆中春王姬以夏受送當二三月出舍四五月出境七八月受迎十一二月至齊成禮詩人所見正春盛花發王姬去魯之齊之時也曷不肅雝王姬之車肅無聲而静貌雝有聲而和貎何不如此以觀王姬之車雖尊無所忌憚而徒悦其繁美曷不者亦識者勸使國人何不如此也是時周己衰齊又亂魯桓公為昏主又亂此人所以有媟心也二章何彼穠矣華如桃李平王之孫齊侯之子平王周平王也平王之孫桓王之女也杜氏以齊襄公親迎則自娶也審爾則齊侯之子謂釐公之子也見魯莊元年夏單伯送王姬秋王姬歸于齊甚明凡詩稱某王某侯或稱謚亡者稱謚或稱國存者稱國不必委曲援引寧王格王之類終為强辭度詩顛倒叅錯亦多如豳風皆周公之詩所不可曉三章其釣維何維絲伊緡齊侯之子平王之孫齊與周為昏當是魯桓公文姜夫婦為之委曲故桓公為之主此所謂釣緡也亦玩之辭聞音曰華方無切子奬禮切孫須倫切總聞曰舊説以為唐棣桃李皆為芍藥洛陽芍藥之品有緋碧桃千葉李郁李之類其引援甚新美然不必如此即今郁李桃李其名皆後世因花色範而比合為名非古有也當是以平王遷洛陽而洛陽不唯牡丹為冠芍藥亦異于他所故舉其最盛為辭又王姬當以奇花喻不當以他花比見甚博意甚嘉而詩人偶觸物遂興情初非有所差擇也騶虞一章彼茁者葭壹發五豝于嗟乎止騶虞二章彼茁者蓬壹發五豵于嗟乎止騶虞聞句曰舊一章三句今為四句語意尤長總聞曰此為春田者也一行止五獸言甚不多也草始茁獸未有深芘所取如此其心雖慈然其禮不可闕也供國祭祀充君膳羞有不得已者每有所獲必舉騶虞稱嘆言安得今人如此獸不踐生草不食生肉者也其心甚不欲也詩總聞卷一
