body:
  text: 詩總聞卷八宋王質撰豳風七月一章七月流火九月授衣此田野農民酬酢往復之辭故參錯無次序大率七月至九月一嵗之食已畢一冬之衣又辦相與各道其生業指時指物不一而足卒之躋堂稱夀以答上也一之日觱發二之日栗烈無衣無褐何以卒嵗三之日于耜四之日舉趾同我婦子饁彼南畝田畯至喜民或言曰自七月有寒之漸九月寒事當辦無以禦冬何以卒歲歲既卒陽已深則于耜舉趾饁田以次而至也二章七月流火九月授衣春日載陽有鳴倉庚女執懿筐遵彼微行爰求柔桑春日遲遲采蘩祁祁女心傷悲殆及公子同歸民或又言曰自七月變候九月卒歲之計已備春來男已不可離田女當采桑育蠶男女各分職也女見物變覺年長所以傷悲人常情也公子適野勞田者也女與同歸喜觀公子之儀容徒御隨其後而還也三章七月流火八月萑葦蠶月條桑取彼斧斨以伐逺揚猗彼女桑民又或言曰自七月萑葦將成八月可采儲蠶薄待蠶月時至則采桑從事也條桑南人謂之梯桑批桑北人謂之穿桑采桑止取葉不伐條也正月以後即為之將近蠶月也四章七月鳴鵙八月載績載𤣥載黃我朱孔陽為公子裳民又或言曰自七月有麻事之漸八月可績以奉公子為先併絲麻而結于此章也染采必向陽藉日色也今染人猶然五章四月秀葽五月鳴蜩八月其穫十月隕籜一之日于貉取彼狐狸為公子裘二之日其同載纘武功言私其豵獻豜于公民又或言曰自四月五月有稼事之漸八月可刈十月天寒葉凋可趣野事之時仲冬始出季冬再出過是則春野事休田事起西北非皮不可禦寒縑布皆不足當之小民以羊豕等皮大民以狐狸等皮故絲麻為公子之裳狐狸為公子之裘所自用者豵之類也野豕一歲為豵言皮薄也三嵗為豜言皮厚也野豕多得稚者力弱易制也少得大者力健難獲也以難得者奉上也六章五月斯螽動股六月莎雞振羽七月在野八月在宇九月在戶十月蟋蟀入我牀下穹窒熏鼠塞向墐戶嗟我婦子曰為改嵗入此室處民又或言曰自五月一隂之生更六月至十月而隂氣已盛穹窒熏鼠塞向墐戶將改歲而入此避之也螽莎雞蟋蟀皆類蝗螽今蚱蜢莎雞今促織蟋蟀亦促織但促織聲如云西西蟋蟀聲如云習習尋詩既莎雞蟋蟀同種則螽當亦是同種或螽所化未可知俗言蚱蜢食蠅乃化蟋蟀識者更詳七章六月食鬱及薁七月亨葵及菽八月剝棗十月穫稻為此春酒以介眉壽民又或言曰自六月鬱薁可食其他以次而有十月初寒可以釀酒之時穫當作濩浸米為醪也春酒冬飲而春生非春始為也毛氏凍醪今臘醅也八章七月食瓜八月斷壺九月叔苴采荼薪樗食我農夫民又或言曰自七月又有瓜可食以至苦菜皆可亨飪以勞久苦之農夫也毛氏叔拾也如此則當為椒九章九月築場圃十月納禾稼黍稷重穋禾麻菽麥場圃植果蓏也搗之使堅恐果蓏之株為風所拔也納入也今輸官猶有此稱納禾八官禾倉納氷入官氷室豳俗愛君親上故遇事先公後私絲麻狐狸先獻公黍稷重穋禾麻菽麥先納公以至宫功皆先于乘屋其末則朋酒殺羊而獻公堂豳俗如此美也嗟我農夫我稼既同上入執宫功上今赴役猶有此稱執今作役猶有此稱自十月而輸官之物皆足總禾麥而結之此章也此詩涉民甚切故多凡談但久逺無由盡曉晝爾于茅宵爾索綯亟其乘屋其始播百榖西北小民多茅屋將寒則采茅絞索縶之不爾大風輒卷去今猶如此謂之蛇索言索如蛇也芒種節後始播種又以四月結之也二之日鑿氷冲冲三之日納于凌隂四之日其蚤獻羔祭韭氷最在後非民事也以二月結之自此以後頒氷刷氷民不與也九月肅霜十月滌場滌猶言刷秋氷用盡則刷氷室以待來年之藏冬禾收盡則滌禾場以待來年之耕今人猶言洗厨言收之盡也滌場同意朋酒斯饗曰殺羔羊躋彼公堂稱彼兕觥萬壽無疆朋酒醵酒也醵酒亨羊升公子之堂獻公子之壽一嵗之事畢也禮籥章掌土鼓豳籥中春晝擊土鼓吹豳詩鄭氏豳風七月也鄭氏自七月流火九月授衣至殆及公子同歸為豳風國祈年于田祖吹吹雅擊土鼓以樂田畯鄭氏豳雅亦七月也鄭氏自七月流火八月萑葦至以介眉夀為豳雅國祭蠟則吹豳頌擊土鼓以息老幼鄭氏豳頌亦七月也鄭氏自七月食瓜八月斷壺至萬夀無疆為豳頌不知如何分一詩作三種禮瞽矇諷誦詩世奠擊鼓琴瑟誦也詩也各有聲也此二聲四器也先諷其辭而後入鼓鐘奠鼓也擊鐘也世曵長也又入琴瑟籥章所謂豳詩以鼓鐘琴瑟之聲合籥也禮笙師吹竽笙塤籥簫箎笛管春牘應雅此十二器也籥章所謂雅以雅之器之聲合籥也禮貾瞭播鼗鼓擊頌磬笙磬此四器也籥章所謂豳頌以頌器之聲合籥也禮諸器諸聲亦在和之所謂凡為樂器以十有二律為之數度以十有二聲為之齊量凡和樂亦如之故逆暑迎寒祈年祭蠟皆全用七月特以器和聲有不同耳大率樂非一器所能合非一聲所能和今此以土鼓豳籥為主鄭氏豳籥用豳地竹詩亦如之鄭氏豳籥豳人吹籥之聲章引禮土鼓蒯桴葦籥伊耆氏之樂此亦有理此蓋豳地之樂也豳詩豳歌曲也豳雅豳頌皆豳樂器也合籥而吹之不同擊鼓而節之則同也聞音曰火虎隈切衣魚紀切發方吹切烈力制切褐許既切畝滿罪切庚古郎切行戶郎切裘渠之切野上宇切戶後五切下後五切瓜攻乎切稼古護切穋六直切麥訖力切隂於容切韭已小切饗虛良切觥姑黃切吳氏此詩每句用韻誠然有不可叶者惟曰為改歲嗟我農夫若用許氏之法亦可嵗從示可以示取音叶子夫從工可以工取音叶同既不在韻亦不必徒使以卓見忽古人者空騰口也恐是當時音調又不可不知鴟梟一章鴟梟鴟梟既取我子無毁我室恩斯勤斯鬻子之閔斯二章逮天之未隂雨徹彼桑土綢繆牖戶今女下民或敢侮豫三章豫手拮据豫所捋荼豫所蓄租豫口卒瘏曰豫未有室家四章豫羽譙譙豫尾翛翛豫室翹翹風雨所漂搖豫惟音嘵嘵聞跡曰豳自七月以下皆周公之詩而繫豳周公生于豳岐之間陶染西俗習貫西音蓋千餘年正氣所傳雖聖人烏能變也當是此詩皆豳音入豳樂鄭氏所謂豳人吹籥之聲章是也古音久絶後人不曉孔子所以繫豳蓋有自然之趣初亦何心非若後人强為穿鑿曲生辭說也魯成九年晋侯見楚囚鍾儀使與之琴操南音今西音不知與古音何如西人吐語殺辭必曰斯又若蘇此詩恩斯勤斯鬻子之閔斯破斧哀我人斯亦可想見其風俗也總聞曰鴟梟謂管蔡也子謂伯禽也室謂成周也當是周公在東伯禽在西父子隔絶有不相保之勢言我子猶可王室為重憂王室將危也下民商徐奄淮夷也乘管蔡之流言敢見侮而相挺為亂也室家亦成周也言武王克商二年而病五年而喪饗國日淺初基未固故曰未有有當如克有常憲之有有諸已之有言永保也大率欲以哀苦為之感動成王其初欲誚而未敢其卒乃悔而至泣此詩不為無助也東山一章我徂東山慆慆不歸我來自東零雨其濛徂東往也來自東歸也此其夫來歸與其妻相見叙相别之狀𨗳相見之情也王氏征夫懷親戚誰獨無此情昔人從公闕一徂輒三齡此皆夫辭我東曰歸我心西悲制彼裳衣勿士行枚言寄征衣而不達也不知在士之中第幾行第幾枚也外事不與內通故不達也蜎蜎者蠋蒸在桑野敦彼獨宿亦在車下蠋桑蟲也桑生葉則有蟲如蠶而小春時也我獨宿在車下但見桑蟲不見妻也二章我徂東山慆慆不歸我來自東零雨其濛果裸之實亦施于宇伊威在室蠨蛸在戶町疃鹿場熠耀宵行亦可畏也伊可懷也果裸括樓也其實及宇夏時也想女在家果裸伊威蠨蛸其寂如此我在野亦止見鹿場螢火不見妻也故不及宇及室及戶而言場鹿宿則相環外向猶如戰場蓋夜行所見鄭氏此五物去家無人則然甚佳但上三物當施于內下二物當施于外則語意皆順也三章我徂東山慆慆不歸我來自東零雨其濛鸛鳴于垤婦歎于室灑掃穹窒我征聿至有敦瓜苦蒸在栗薪自我不見于今三年瓜白瓜也近蒂帶苦秋時也穹窒炕也西北人非此不可寢冬時也想女聞鸛鳴則憂我在外而苦雨也灑掃所臥之炕以待我至儲瓜儲薪凡皆待我也四章我徂東山慆慆不歸我來自東零雨其濛倉庚于飛熠耀其羽之子于歸皇駁其馬親結其縭九十其儀其新孔嘉其舊如之何倉庚黃栗留也又春時也見此春鳥追思乘馬親迎結縭相合之時新相見之情與舊相處之情孰優戲之辭也聞音曰上四句每章為起辭上二句不用韻下二句乃用韻吳氏以為未詳山西人呼曰師又若曰沙今猶有此音山歸未嘗不叶也野上與切下後五切户後五切行户郎切畏於罪切懷胡隈切垤地一切窒陟致切年禰因切馬滿補切嘉居何切聞物曰陸氏果裸螉蓋謂草與蟲獸不當相雜也上章言桑蠋下章言鸛瓜栗薪草木與蟲獸亦相雜言之小宛蜾螺負之皆從蟲此皆從果毛氏良是聞跡曰詩自七月以下所繫周公之詩鴟梟固已略言之今又載于此周公東征必皆豳岐生長諳慣之人其人作豳樂歌豳曲夫人何怪項氏有楚其在垓下也聞漢軍四面皆楚歌曰漢皆已得楚乎何楚人多也蓋漢髙部曲皆關中調發之人秦人而有楚歌此項氏所以悲歌慷慷也力拔山兮氣蓋世時不利兮騅不逝騅不逝兮可奈何虞兮虞兮奈若何自今觀之四句如今古詩哀泣何由而生而死生何由而决也舉此以明東山蓋豳人從軍為歌者人諷其辭已足以感人何况其聲惜後人不得聞且不可考也總聞曰書稱二年詩稱三年尋詩再及春一及夏一及秋一及冬歷五時也當是二年始定三年乃歸據皇極經世丙戌東征戊子底平則是三年也詩書所言自不相礙破斧一章既破我斧又闕我斨周公東征四國是皇哀我人斯亦孔之將既又言見害不已也小人雖極力而不害周公之大不害周公之休皇張也吪動也遒聚也有識知其無能為而終以為哀者恐不幸而墮其機也既而自解周公甚大甚嘉甚休豈能無傷也二章既破我斧又闕我錡周公東征四國是吪哀我人斯亦孔之嘉三章既破我斧又闕我銶周公東征四國是遒哀我人斯亦孔之休聞音曰錡於何切嘉居何切聞事曰古專征杖鉞黃金飾斧書左杖黃鉞又有大鉞在左者秉之小鉞在右者秉之後世雖執國之臣止假黃鉞亦未敢當多辭蓋黃鉞即君權也不知此時或是黃鉞或是大鉞司馬氏武王殺紂周公把大鉞召公把小鉞以夾武王此行當是黃鉞其位既尊其勢又重于往時也總聞曰毛氏四國管蔡商奄此當是三監同亂諸邦竝騷所謂有大艱于西土西土人亦不靜人情見天下之變如此周公之危如此故以為哀也伐柯一章伐柯如何匪斧不克取妻如何匪媒不得伐柯當以斧害周公當如此去之取妻當以媒來周公當如此致之皆所以感動成王也二章伐柯伐柯其則不逺我覯之子籩豆有踐管蔡之徒必有尚在成王之側者故曰不逺周公所以未還者為是故也去是則見周公而致禮通情斯有日矣聞音曰踐慈演切總聞曰害周公者固不為少而知周公者亦不為不多成王之眀而又有賢者以感悟之此天所以相周也考書二公召公太公也諸史有執事莫知主名諸人一信一噫二語移成王之心流成王之涕而天又動威于雷風禾木之間文武之澤深矣此詩當是諸史百執事之徒所作願為媒者也司馬氏以雷風之事在周公既卒之後蓋以昔公勤勞王家認昔為古凡隔宿即為昔何論存亡其中眀言惟朕小子其親逆我國家禮亦宜之不應以十年之後事相聨成文而又意勢相貫决不在十年之後也司馬氏恐非據皇極經世周公東征以丙戌沒以丙申併載于此九罭一章九罭之魚鱒魴我覯之子衮衣繡裳二章鴻飛遵渚公歸無所於女信處三章鴻飛遵陸公歸不復於女信宿皆周公歸途所見之物也魚逰近罭鴻飛近渚近陸皆危地公歸恐復陷讒不能免也國人憂周公而未孚成王故欲且留再宿以觀其變女衆人共推為可留之所也四章是以有衮衣兮無以我公歸兮無使我心悲兮雖此有所逆之服然不可歸恐墮其計也國人憂疑之心如此懲已往不能保將來也聞句曰舊一章四句三章三句今為各三句九罭之魚不斷總聞曰鄭氏是東都也東都欲留周公為君謂成王賫來衮衣願其封公于此以衮衣命留之無以公西歸此說極有理東都為周公之計則甚精也初欲少留以觀事變又欲終留以奠别都若爾則不利孺子之讒乃驗周公之心上通乎天下通乎地當是武王遘厲以成王托周公故曰是有丕子之責于天蓋已屬後事也其後南面負扆之事雖以為疑然不必疑也聖人不事形迹如後世之肺腸大誥之作正危疑洶湧之時亦以王命告天下東征西歸又十年乃沒天下康平國勢尊安若使周公避嫌逺疑如常情所存則非所謂出乎其類拔乎其萃者也併載于此狼跋一章狼跋其胡載疐其尾公孫碩膚赤舄几几二章狼疐其尾載跋其胡公孫碩膚德音不瑕狼進則跋其胡退則疐其尾此與周公異意之人所露之狀也周公尚留未歸已歸未至朝廷必有踧踖者成王亦為之遲疑也周公以大包之以美和之故居上公之位安而保聖人之德全也聞音曰瑕洪孤切善哉吳氏之說曰載籍所傳自三代而下以至于今一字之聲無慮數變秦漢以前凡從假者在平則讀如胡或自胡而孶在側則讀如護或自護而孶魏晋之間在平則讀如何或自何而孶在側則讀如賀或自賀而孶齊梁之後在平則讀為胡加切在側則讀為胡駕切亦或自二音而孶自胡而為何自何而為遐自護而為賀自賀而為下其聲音之變如此至其所以變則不得而知而魏晋以前或兼用後世之音至後世既變之後古音之存者蓋蔑矣今以一二考之左氏傳宋野人之歌曰既定爾婁豬盍歸吾艾豭此以豭為胡也楚辭逺逰潄正陽而含朝霞精神入而粗氣除司馬相如大人賦曰回車朅來兮㑹食幽都吸沆瀣兮餐朝霞此以霞為胡也楚辭招魂瓊轂錯衡華英假茞蘭桂樹鬱彌路又曰結撰至思蘭芳假人有所極同心賦此以假為護也張衡狼比周公如以鴟梟比成王也此等當易聞人曰公孫周公公季之孫也初止稱公季後乃稱王季此詩止襲前稱大率公子公孫皆實語總聞曰此必逆周公之使者行道所見也詩人未有無故而興辭觸物吐情此非以狼而詆其人也詩總聞卷八
